<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f0d" />
  <title>TEST SAMANTHA — SCZN3</title>
  <meta name="description" content="Founder-runtime test of the original approved Samantha speech path." />
  <link rel="stylesheet" href="tstt-voice-audition.css?v=1" />
</head>
<body>
  <main class="audition-shell">
    <header class="audition-header">
      <div class="brand-mark">SCZN3</div>
      <div class="brand-product">SAMANTHA FOUNDER TEST</div>
    </header>

    <section class="audition-intro" aria-labelledby="testTitle">
      <span>ORIGINAL APPROVED SPEECH PATH</span>
      <h1 id="testTitle">Test Samantha.</h1>
      <p>Tap the button once and judge the audible result.</p>
    </section>

    <blockquote>“This target is designed to zero your weapon at 25 meters.”</blockquote>

    <section aria-live="polite" aria-busy="true" id="voiceRegion">
      <p class="voice-status" id="voiceStatus">CHECKING THIS DEVICE FOR SAMANTHA…</p>
      <div class="voice-list">
        <article class="voice-sample">
          <div class="voice-name"><span>FOUNDER ACCEPTANCE</span><b id="voiceIdentity">CHECKING…</b></div>
          <button type="button" id="testSamantha" disabled><span aria-hidden="true">▶</span> TEST SAMANTHA</button>
        </article>
      </div>
    </section>

    <p class="audition-rule"><b>SAMANTHA</b><span>RATE 0.70</span><span>ONE DIRECT CLICK</span></p>
  </main>

  <script src="tstt-samantha-test.js?v=1"></script>
</body>
</html>
