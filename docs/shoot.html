  if (!currentImpactPoints.length) return "Tap bullet holes";
  if (!resultsShown) return `${currentImpactPoints.length} ${currentImpactPoints.length === 1 ? "hole" : "holes"} recorded`;

    candidate
    && candidate.savedToSEC === true
    && candidate.experienceMode === "simulation"
    && candidate.simulationSessionId === SIMULATION_SESSION_ID

function isDotTortureAuthoritySession() {
  const missionName = activeMissionName();

    || (activeMissionFamily() === "marksmanshiptraining" && (
      missionName === "dottorture"
      || missionName === "dottorturestandard"
      || missionName === "dottorturelite"
      || missionName === "revolvingdottorture"
    ));
}

function isGssfAuthorityPackage(authorityPackage) {
  if (!authorityPackage || typeof authorityPackage !== "object") return false;
  if (authorityPackage.ok !== true || authorityPackage.status !== "calculated") return false;
  if (authorityPackage.target_profile_id !== "gssf_ac_1" || authorityPackage.mission_family !== "gssf") return false;
  if (authorityPackage.resultPackageType !== "gssfPaperPenaltyResult" || authorityPackage.resultSource !== "backend") return false;
  if (typeof authorityPackage.totalPaperPenaltySeconds !== "number" || !Number.isFinite(authorityPackage.totalPaperPenaltySeconds) || authorityPackage.totalPaperPenaltySeconds < 0) return false;
  const breakdown = authorityPackage.scoringBreakdown;
  if (!Array.isArray(breakdown) || breakdown.length !== 4) return false;
  const expectedZones = new Set(["downZero", "plusOne", "plusThree", "miss"]);
  const seenZones = new Set();
  const seenShotIds = new Set();
  for (const bucket of breakdown) {
    if (!bucket || typeof bucket !== "object" || !expectedZones.has(bucket.zone) || seenZones.has(bucket.zone)) return false;
    if (typeof bucket.count !== "number" || !Number.isFinite(bucket.count) || !Number.isInteger(bucket.count) || bucket.count < 0) return false;
    if (typeof bucket.penaltySecondsPerHit !== "number" || !Number.isFinite(bucket.penaltySecondsPerHit)) return false;
    if (typeof bucket.subtotalPenaltySeconds !== "number" || !Number.isFinite(bucket.subtotalPenaltySeconds)) return false;
    if (!Array.isArray(bucket.shotIds) || bucket.shotIds.length !== bucket.count) return false;
    for (const shotId of bucket.shotIds) {
      if (typeof shotId !== "number" || !Number.isFinite(shotId) || !Number.isInteger(shotId) || shotId < 1 || seenShotIds.has(shotId)) return false;
      seenShotIds.add(shotId);
    }
    seenZones.add(bucket.zone);
  }
  return seenZones.size === expectedZones.size;
}

function isDotTortureTrainingPackage(authorityPackage) {
  if (!authorityPackage) return false;
  const missionFamily = String(authorityPackage.mission_family || authorityPackage.missionFamily || authorityPackage.missionFamilyId || "");
  const missionName = String(authorityPackage.mission_name || authorityPackage.missionName || "");
  const missionGroup = String(authorityPackage.mission_group || authorityPackage.missionGroup || "");
  const secTemplate = String(authorityPackage.sec_template || authorityPackage.secTemplate || "");
  return missionFamily === "marksmanshipTraining"
    && secTemplate === "trainingSEC"
    && (
      missionGroup === "dotTortureFamily"
      || missionName === "dotTorture"
      || missionName === "dotTortureStandard"
      || missionName === "dotTortureLite"
      || missionName === "revolvingDotTorture"
    );
}

function isNonZeroingAuthorityPackage(authorityPackage) {
  return isGssfAuthorityPackage(authorityPackage) || isDotTortureTrainingPackage(authorityPackage);

function authorityPackageMissionKind(authorityPackage) {
  if (!authorityPackage) return "";
  if (isDotTortureTrainingPackage(authorityPackage)) return "dotTortureFamily";
  if (isGssfAuthorityPackage(authorityPackage)) return "gssf";
  if (authorityPackage.status && authorityPackage.status.hasCorrection) return "zeroing";

}

function authorityPackageTargetProfileId(authorityPackage) {
  return String(
    authorityPackage && (

      || ""
    )
  ).toLowerCase();
}

function isAuthorityPackageCompatibleWithActiveMission(authorityPackage) {
  const packageKind = authorityPackageMissionKind(authorityPackage);
  if (!packageKind) return false;
  const activeProfileId = activeTargetProfileId();
  const packageProfileId = authorityPackageTargetProfileId(authorityPackage);
  if (activeProfileId && packageProfileId && activeProfileId !== packageProfileId) return false;
  return packageKind === activeMissionKind();
}

function compatibleAuthorityPackage(authorityPackage) {
  return isAuthorityPackageCompatibleWithActiveMission(authorityPackage) ? authorityPackage : null;
}

function stripStaleAuthorityFields(record = {}) {
  if (!record || typeof record !== "object") return {};
  const next = { ...record };
  [
    "backendAuthorityPackage",
    "ugeoAuthorityPackage",
    "authorityPackage",
    "correctionData",
    "correctionStatus",
    "clicks",
    "poib",
    "groupCenter",
    "score",
    "scoreValue",
    "rawScore",
    "qualityPossible",
    "trainingManualResult"
  ].forEach(key => delete next[key]);
  return next;
}

function hasIncompatibleAuthorityPackage(record = {}) {
  if (!record || typeof record !== "object") return false;
  const packageToCheck = record.backendAuthorityPackage || record.ugeoAuthorityPackage || record.authorityPackage || null;
  return !!(packageToCheck && !isAuthorityPackageCompatibleWithActiveMission(packageToCheck));
}

function authoritySafeRecord(record = {}) {
  return hasIncompatibleAuthorityPackage(record) ? stripStaleAuthorityFields(record) : { ...record };
}

function clearIncompatibleAuthorityFromSession(candidate) {
  if (!candidate) return candidate;
  if (!hasIncompatibleAuthorityPackage(candidate)) return candidate;
  return {
    ...stripStaleAuthorityFields(candidate),
    matrixSnapshot: candidate.matrixSnapshot || {},
    targetAuthority: candidate.targetAuthority || {},
    shotData: {
      ...(candidate.shotData || {}),
      status: "authority-cleared-for-mission-change",
      score: null,
      scoreValue: null
    }
  };
}

function syncAuthorityDerivedState() {
  backendAuthorityPackage = compatibleAuthorityPackage(backendAuthorityPackage);
  currentClicks = zeroingClicksFromAuthorityPackage(backendAuthorityPackage);
  currentScore = backendScoreValue(backendAuthorityPackage);
  resultsShown = isAuthorityPackageCalculated(backendAuthorityPackage);
}

function zeroingClicksFromAuthorityPackage(authorityPackage) {
  if (!authorityPackage || isNonZeroingAuthorityPackage(authorityPackage)) return null;
  if (!authorityPackage.clicks || authorityPackage.mechanicalValidation?.status !== "calculated") return null;
  const correction = authorityPackage.correction || {};
  const clicks = authorityPackage.clicks || {};
  return {
    ...clicks,
    elevation: correction.elevation,
    windage: correction.windage,
    poib: authorityPackage.poib,
    authorityPackage
  };
}

function isAuthorityPackageCalculated(authorityPackage) {
  if (!authorityPackage) return false;
  if (isDotTortureTrainingPackage(authorityPackage)) {
    return authorityPackage.ok === true && ["created", "calculated"].includes(String(authorityPackage.status || ""));
  }
  if (isGssfAuthorityPackage(authorityPackage)) {
    const classifications = backendHitClassifications(authorityPackage);
    const render = authorityPackage.renderCoordinates || {};
    const renderHits = Array.isArray(render.hits) ? render.hits : [];
    return authorityPackage.ok === true
      && authorityPackage.status === "calculated"
      && (classifications.length > 0 || renderHits.length > 0);
  }
  return !!(authorityPackage.status && authorityPackage.status.hasCorrection);
}

function ensureTargetSession() {
  if (session) return session;
  matrix = SIMULATION_MODE
    ? simulationTargetMatrix()
    : targetAttributionOverride(SCZN3M4.getActiveMatrix() || defaultTargetMatrix());
  matrix = SCZN3M4.saveMatrixSnapshot(matrix);
  session = SCZN3M4.createSession(matrix);
  if (SIMULATION_MODE) {
    session = SCZN3M4.replaceSession({
      ...session,
      experienceMode: "simulation",
      simulation: true,
      simulationSessionId: SIMULATION_SESSION_ID

function parseTrainingTimeInput(value) {
  const raw = String(value || "").trim();
  if (!raw) return { ok: true, seconds: null, display: "optional/pending" };
  const clock = raw.match(/^(\d+):([0-5]\d)$/);
  if (clock) {
    const minutes = Number(clock[1]);
    const seconds = Number(clock[2]);
    return { ok: true, seconds: (minutes * 60) + seconds, display: `${minutes}:${String(seconds).padStart(2, "0")}` };
  }
  if (/^\d+(\.\d+)?$/.test(raw) && Number(raw) >= 0) {
    const seconds = Number(raw);
    return { ok: true, seconds, display: `${seconds} sec` };
  }
  return { ok: false, message: "Time must be seconds or mm:ss." };
}

function readTrainingStageScores() {
  const inputs = Array.from(document.querySelectorAll(".training-stage-score-input"));
  const hasAnyStageScore = inputs.some(input => String(input.value || "").trim() !== "");
  if (!hasAnyStageScore) return { ok: true, stageScores: null, total: null };
  const stageScores = [];
  for (const input of inputs) {
    const raw = String(input.value || "").trim();
    const label = input.dataset.stageLabel || "Stage";
    const max = Number(input.dataset.stageMax || 0);
    if (!raw) return { ok: false, message: "Enter all stage scores or use Total Score." };
    if (!/^\d+$/.test(raw)) return { ok: false, message: `${label} score must be a whole number from 0 to ${max}.` };
    const score = Number(raw);
    if (score < 0 || score > max) return { ok: false, message: `${label} score must be between 0 and ${max}.` };
    stageScores.push({
      stageIndex: Number(input.dataset.stageIndex || stageScores.length),
      label,
      score,
      max
    });
  }
  return {
    ok: true,
    stageScores,
    total: stageScores.reduce((sum, stage) => sum + stage.score, 0)
  };
}

function readTrainingManualResult({ requireScore = false } = {}) {
  const maxScore = trainingMaxScore();
  const scoreInput = document.getElementById("trainingManualScore");
  const missesInput = document.getElementById("trainingManualMisses");
  const timeInput = document.getElementById("trainingManualTime");
  const notesInput = document.getElementById("trainingManualNotes");
  const stageRead = readTrainingStageScores();
  if (!stageRead.ok) return stageRead;
  const scoreRaw = String(scoreInput ? scoreInput.value : "").trim();
  let score = stageRead.stageScores ? stageRead.total : null;
  if (score === null && !scoreRaw) {
    return requireScore
      ? { ok: false, message: `Enter a score from 0 to ${maxScore}.` }
      : { ok: true, result: null };
  }
  if (score === null) {
    if (!/^\d+$/.test(scoreRaw)) return { ok: false, message: `Score must be a whole number from 0 to ${maxScore}.` };
    score = Number(scoreRaw);
  }
  if (score < 0 || score > maxScore) return { ok: false, message: `Score must be between 0 and ${maxScore}.` };
  const missesRaw = String(missesInput ? missesInput.value : "").trim();
  let misses = null;
  if (missesRaw) {
    if (!/^\d+$/.test(missesRaw)) return { ok: false, message: "Misses must be zero or greater." };
    misses = Number(missesRaw);
  }
  const parsedTime = parseTrainingTimeInput(timeInput ? timeInput.value : "");
  if (!parsedTime.ok) return parsedTime;
  const notes = String(notesInput ? notesInput.value : "").trim();
  return {
    ok: true,
    result: {
      status: "manual",
      score,
      maxScore,
      percentage: trainingPercentage(score, maxScore),
      scoreSource: stageRead.stageScores ? "stageScores" : "totalScore",
      stageScores: stageRead.stageScores || [],
      misses,
      timeSeconds: parsedTime.seconds,
      timeDisplay: parsedTime.display,
      notes,
      source: "manual"
    }
  };
}

function bindDistanceControl() {
  const distanceInput = document.getElementById("targetDistance");
  if (!distanceInput) return;
  const otherInput = document.getElementById("targetDistanceOther");
  distanceInput.addEventListener("change", () => {
    if (distanceLocked) return;
    if (distanceInput.value === "Other") {
      selectedDistanceValue = "";
      otherInput.classList.remove("is-hidden");
      otherInput.value = "";
      otherInput.focus();
    } else {
      selectedDistanceValue = distanceInput.value;
      otherInput.classList.add("is-hidden");
      otherInput.value = "";
    }
    updateDistanceDisplay();
    invalidateCorrectionContext();
  });
  if (otherInput) {
    otherInput.addEventListener("input", () => {
      otherInput.value = otherInput.value.replace(/\D/g, "");
      selectedDistanceValue = otherInput.value;
      updateDistanceDisplay();
      invalidateCorrectionContext();
    });
  }
  document.querySelectorAll("[data-target-distance-unit]").forEach(button => {
    button.addEventListener("click", () => {
      if (distanceLocked) return;
      selectedDistanceUnit = button.dataset.targetDistanceUnit;
      document.querySelectorAll("[data-target-distance-unit]").forEach(item => {
        const selected = item === button;
        item.classList.toggle("is-active", selected);
        item.setAttribute("aria-pressed", String(selected));
        item.textContent = `${item.dataset.targetDistanceUnit}${selected ? " ✓" : ""}`;
      });
      updateDistanceDisplay();
      invalidateCorrectionContext();
    });
  });
  document.querySelectorAll("[data-target-adjustment-unit]").forEach(button => {
    button.addEventListener("click", () => {
      selectedAdjustmentUnit = button.dataset.targetAdjustmentUnit === "MRAD" ? "MRAD" : "MOA";
      document.querySelectorAll("[data-target-adjustment-unit]").forEach(item => {
        const selected = item === button;
        item.classList.toggle("is-active", selected);
        item.setAttribute("aria-pressed", String(selected));
        item.textContent = `${item.dataset.targetAdjustmentUnit}${selected ? " ✓" : ""}`;
      });
      invalidateCorrectionContext();
    });
  });
  updateDistanceDisplay();
}

function bindCorrectionContextDrawer() {
  const sight = document.getElementById("correctionContextSight");
  const distance = document.getElementById("correctionContextDistance");
  const distanceUnit = document.getElementById("correctionContextDistanceUnit");
  const adjustmentUnit = document.getElementById("correctionContextAdjustmentUnit");
  const confirm = document.getElementById("confirmCorrectionContext");
  if (!sight || sight.dataset.bound === "true") return;
  sight.dataset.bound = "true";

    selectedSightSystem = sight.value === "optic" ? "optic" : "iron";

    invalidateCorrectionContext();
  });
  distance.addEventListener("input", () => {
    selectedDistanceValue = distance.value;
    invalidateCorrectionContext();
  });
  distanceUnit.addEventListener("change", () => {

    invalidateCorrectionContext();
  });

    selectedAdjustmentUnit = adjustmentUnit.value === "MRAD" ? "MRAD" : "MOA";

function syncDistanceFromControls() {
  const distanceInput = document.getElementById("targetDistance");
  const otherInput = document.getElementById("targetDistanceOther");
  if (!distanceInput) return;
  selectedDistanceValue = distanceInput.value === "Other" ? (otherInput.value || "100") : distanceInput.value;
}

function updateDistanceDisplay() {
  const display = document.getElementById("distanceDisplay");
  if (display) display.textContent = formatDistanceDisplay();
}

function correctionContextSnapshot(authorityPackage = backendAuthorityPackage) {
  const source = session && session.matrixSnapshot || matrix || {};
  const model = authorityPackage && authorityPackage.mechanicalValidation
    ? authorityPackage.mechanicalValidation.model || {}
    : {};
  const opticType = String(source.opticType || source.opticModel || source.adjustmentSystem || "").toLowerCase();
  const sightSystem = selectedSightSystem || (
    opticType.includes("iron") || opticType.includes("m4_iron") ? "iron" : "optic"
  );
  return {
    sightSystem,
    sightLabel: sightSystem === "iron" ? "Iron Sight" : "Optic",
    distanceValue: Number(selectedDistanceValue || 0),
    distanceUnit: selectedDistanceUnit === "M" ? "M" : "YDS",
    adjustmentUnit: selectedAdjustmentUnit === "MRAD" ? "MRAD" : "MOA",
    equipmentAuthorityRecordId: String(
      model.equipmentAuthorityRecordId
      || source.equipmentAuthorityRecordId
      || source.mechanicalSightAuthorityId
      || source.sightAuthorityId
      || ""
    ),
    opticIdentity: sightSystem === "optic"
      ? [source.opticType, source.opticBrand, source.opticModel].filter(Boolean).join("|")
      : "",
    opticClickValue: sightSystem === "optic"
      ? Number(
        source.opticClickValue
        || (selectedAdjustmentUnit === "MRAD" ? source.opticClickValueMRAD : source.opticClickValueMOA)
        || 0
      )
      : null
  };
}

function correctionContextFingerprint(authorityPackage = backendAuthorityPackage) {
  const context = correctionContextSnapshot(authorityPackage);
  if (window.SCZN3ZeroingPlatform) {
    return window.SCZN3ZeroingPlatform.contextFingerprint({
      ...context,
      distance: context.distanceValue,
      sightAuthorityId: context.equipmentAuthorityRecordId
    });
  }
  return JSON.stringify(context);
}

function correctionContextIsAuthoritative(authorityPackage = backendAuthorityPackage) {
  const context = correctionContextSnapshot(authorityPackage);
  return !!(
    Number.isFinite(context.distanceValue)
    && context.distanceValue > 0
    && authorityPackage
    && authorityPackage.clicks
    && authorityPackage.mechanicalValidation
    && authorityPackage.mechanicalValidation.status === "calculated"
  );
}

function correctionContextIsConfirmed(authorityPackage = backendAuthorityPackage) {
  return !!(
    correctionContextConfirmedFingerprint
    && correctionContextConfirmedFingerprint === correctionContextFingerprint(authorityPackage)
    && correctionContextIsAuthoritative(authorityPackage)
  );
}

function correctionUnavailableShooterMessage(authorityPackage = backendAuthorityPackage) {
  const context = correctionContextSnapshot(authorityPackage);
  if (!Number.isFinite(context.distanceValue) || context.distanceValue <= 0) {
    return "Enter the firing distance, then tap Confirm.";
  }
  if (context.sightSystem === "optic" && (!Number.isFinite(context.opticClickValue) || context.opticClickValue <= 0)) {
    return "The optic adjustment value is missing. Return to Weapon Library, complete the optic setup, then try again.";
  }
  if (context.sightSystem === "iron" && !context.equipmentAuthorityRecordId) {
    return "This iron-sight setup is not registered for click adjustments. Return to Weapon Library and select the supported M4 sight setup.";
  }
  if (!authorityPackage || !authorityPackage.clicks || authorityPackage.mechanicalValidation?.status !== "calculated") {
    return "This sight setup does not provide a verified click adjustment. Review the sight setup in Weapon Library, then try again.";
  }
  return "A correction could not be calculated from this group. Check the session setup and try Show Results again.";
}

function remainingCorrectionShooterMessage(authorityPackage = backendAuthorityPackage) {
  const clicks = authorityPackage && authorityPackage.clicks;
  if (!clicks) {
    return "Review the session setup before firing another confirmation group.";
  }
  const axes = ["windage", "elevation"].map(axis => {
    const direction = String(clicks[`${axis}Direction`] || "CENTER").trim().toUpperCase();
    const count = Math.abs(Number(clicks[`${axis}Clicks`] || 0));
    if (!Number.isFinite(count) || count <= 0 || direction === "CENTER") return "";
    const readableDirection = direction.charAt(0) + direction.slice(1).toLowerCase();
    return `${readableDirection} ${count} ${count === 1 ? "click" : "clicks"}`;
  }).filter(Boolean);
  if (!axes.length) {
    return "Fire and tap another confirmation group.";
  }
  return `Apply the remaining correction: ${axes.join(" · ")}. Then fire and tap another confirmation group.`;
}

function correctionContextEvidenceX(authorityPackage = backendAuthorityPackage) {
  const points = currentImpactPoints.map(safePoint).filter(Boolean);
  const poib = safePoint(authorityPackage && (
    authorityPackage.poib
    || authorityPackage.renderCoordinates && authorityPackage.renderCoordinates.poib
  ));
  if (poib) points.push(poib);
  if (!points.length) return 50;
  return points.reduce((sum, point) => sum + Number(point.xPercent), 0) / points.length;
}

function placeCorrectionContextDrawer() {
  const drawer = document.getElementById("correctionContextDrawer");
  if (!drawer) return;
  drawer.dataset.drawerDirection = correctionContextEvidenceX() < 50 ? "right" : "left";
}

function founderContextAtResultsGate() {
  return !!(
    FOUNDER_WORKSPACE_TEST_MODE
    && isM4AuthoritySession()
    && currentAimPoint
    && currentImpactPoints.length
    && holeEntrySettled
    && !resultsShown
    && !correctionContextReviewDismissed
  );
}

function renderCorrectionContextDrawer() {
  const drawer = document.getElementById("correctionContextDrawer");
  if (!drawer) return;
  const founderGate = founderContextAtResultsGate();
  const available = isM4AuthoritySession() && (
    FOUNDER_WORKSPACE_TEST_MODE
      ? founderGate || resultsShown
      : correctionContextPending || !!correctionContextConfirmedFingerprint
  );
  drawer.hidden = !available;
  if (!available) return;
  const context = correctionContextSnapshot();
  const sight = document.getElementById("correctionContextSight");
  const distance = document.getElementById("correctionContextDistance");
  const distanceUnit = document.getElementById("correctionContextDistanceUnit");
  const adjustmentUnit = document.getElementById("correctionContextAdjustmentUnit");
  if (sight && document.activeElement !== sight) sight.value = context.sightSystem;
  if (distance && document.activeElement !== distance) distance.value = String(context.distanceValue || "");
  if (distanceUnit && document.activeElement !== distanceUnit) distanceUnit.value = context.distanceUnit;
  if (adjustmentUnit && document.activeElement !== adjustmentUnit) adjustmentUnit.value = context.adjustmentUnit;
  if (adjustmentUnit) {
    const mrad = adjustmentUnit.querySelector('option[value="MRAD"]');
    if (mrad) mrad.disabled = !FOUNDER_WORKSPACE_TEST_MODE && context.sightSystem === "iron";
  }
  const confirm = document.getElementById("confirmCorrectionContext");
  if (confirm) {
    confirm.disabled = correctionContextRefreshing || !Number.isFinite(context.distanceValue) || context.distanceValue <= 0;
    confirm.textContent = correctionContextRefreshing
      ? (resultsShown ? "Updating…" : "Calculating…")
      : FOUNDER_WORKSPACE_TEST_MODE
        ? (resultsShown ? "Update Results" : "Show Results")
        : "Confirm";
  }
  if (founderGate || correctionContextPending) drawer.open = true;
  placeCorrectionContextDrawer();
}

function syncCorrectionContextGate() {
  if (FOUNDER_WORKSPACE_TEST_MODE && isM4AuthoritySession()) {
    correctionContextPending = false;
    renderCorrectionContextDrawer();
    return;
  }
  if (!isM4AuthoritySession() || !resultsShown || !currentClicks) {
    renderCorrectionContextDrawer();
    return;
  }
  correctionContextPending = !correctionContextIsConfirmed(backendAuthorityPackage);
  renderCorrectionContextDrawer();
}

function invalidateCorrectionContext() {
  markWorkspaceProgressUnsaved();
  if (FOUNDER_WORKSPACE_TEST_MODE && isM4AuthoritySession()) {
    correctionContextPending = false;
    correctionContextConfirmedFingerprint = "";
    sessionSaved = false;
    persistCorrectionContextSelection();
    renderCorrectionContextDrawer();
    renderMarkStatus();
    return;
  }
  correctionContextConfirmedFingerprint = "";
  correctionContextPending = !!(isM4AuthoritySession() && resultsShown && currentClicks);
  sessionSaved = false;
  if (correctionContextPending) {
    setSaveSessionStatus("Review the session setup to refresh the correction.");
  }
  renderMarkers();
  renderCorrectionContextDrawer();
  renderMarkStatus();
}

function persistCorrectionContextSelection() {
  if (!session) ensureTargetSession();
  const source = { ...(session && session.matrixSnapshot || matrix || {}) };
  const previousOpticType = String(source.opticType || "");
  const nextOpticType = selectedSightSystem === "iron"
    ? "Iron Sights"
    : (!previousOpticType.toLowerCase().includes("iron") && previousOpticType ? previousOpticType : "Optic");
  const nextMatrix = {
    ...source,
    opticType: nextOpticType,
    opticAdjustmentUnit: selectedAdjustmentUnit,
    targetDistance: `${selectedDistanceValue} ${selectedDistanceUnit === "M" ? "m" : "yds"}`,
    targetDistanceValue: String(selectedDistanceValue),
    targetDistanceUnit: selectedDistanceUnit
  };
  matrix = { ...(matrix || {}), ...nextMatrix };
  session = SCZN3M4.updateActiveSession({
    matrixSnapshot: nextMatrix,
    targetDistance: nextMatrix.targetDistance,
    targetDistanceValue: nextMatrix.targetDistanceValue,
    targetDistanceUnit: nextMatrix.targetDistanceUnit,
    correctionContextConfirmedFingerprint: "",
    correctionContextSnapshot: correctionContextSnapshot(null)
  }) || session;
}

async function confirmCorrectionContext() {
  if (correctionContextRefreshing) return;
  const context = correctionContextSnapshot();
  if (!Number.isFinite(context.distanceValue) || context.distanceValue <= 0) return;
  correctionContextRefreshing = true;
  renderCorrectionContextDrawer();
  persistCorrectionContextSelection();
  try {
    const authorityPackage = await requestBackendAuthority();
    applyBackendAuthorityPackage(authorityPackage);
    if (!FOUNDER_WORKSPACE_TEST_MODE && !correctionContextIsAuthoritative(authorityPackage)) {
      correctionContextPending = true;
      authorityStatusMessage = correctionUnavailableShooterMessage(authorityPackage);
      setSaveSessionStatus(authorityStatusMessage, "error");
      return;
    }
    correctionContextConfirmedFingerprint = correctionContextFingerprint(authorityPackage);
    correctionContextPending = false;
    correctionContextReviewDismissed = false;
    session = SCZN3M4.updateActiveSession({
      correctionContextConfirmedFingerprint,
      correctionContextSnapshot: correctionContextSnapshot(authorityPackage)
    }) || session;
    if (m4LivePhase === "confirmation" && authorityPackage.validation) {
      setSaveSessionStatus(
        authorityPackage.validation.confirmed
          ? "Confirmation complete."
          : remainingCorrectionShooterMessage(authorityPackage),
        authorityPackage.validation.confirmed ? "saved" : ""
      );
    } else {
      setSaveSessionStatus("");
    }
    const drawer = document.getElementById("correctionContextDrawer");
    if (drawer) drawer.open = false;
  } catch (error) {
    console.warn("Correction context authority refresh failed", error);
    correctionContextPending = true;
    authorityStatusMessage = "The correction could not be refreshed. Your impacts remain on this screen; check the session setup and try again.";
    setSaveSessionStatus(authorityStatusMessage, "error");
  } finally {
    correctionContextRefreshing = false;
    renderMarkers();
    renderResults();
    renderMarkStatus();
    renderCorrectionContextDrawer();
  }
}

function unlockDistanceForNewTarget() {
  distanceLocked = false;
}

function lockDistanceForSession() {
  syncDistanceFromControls();
  if (!selectedDistanceValue) selectedDistanceValue = "100";
  distanceLocked = true;
}

function activeCalculationContextForTarget() {
  const source = {
    ...(matrix || {}),
    targetDistanceValue: selectedDistanceValue || "100",
    targetDistanceUnit: selectedDistanceUnit,
    targetDistance: formatDistanceDisplay(),
    distance: formatDistanceDisplay(),
    opticAdjustmentUnit: selectedAdjustmentUnit
  };
  if (SCZN3M4.buildActiveCalculationContext) {
    return SCZN3M4.buildActiveCalculationContext(source, session);
  }
  return {
    contextVersion: "active-calculation-context-v1",
    sessionDistance: {
      value: Number(selectedDistanceValue || 100),
      unit: selectedDistanceUnit,
      display: formatDistanceDisplay(),
      source: "session",
      locked: distanceLocked
    },
    establishedZero: null,
    angularUnit: selectedAdjustmentUnit,
    clickValue: Number(source.opticClickValue || source.clickValue || (selectedAdjustmentUnit === "MRAD" ? 0.1 : 0.25)),
    authorityStatus: "context-attached"
  };
}

function distanceClickQueryPayload(goToDistance) {
  const source = matrix || {};
  const opticAdjustmentUnit = selectedAdjustmentUnit;
  const opticClickValueMOA = source.opticClickValueMOA || source.clickValueMOA || source.opticClickValue || source.clickValue || 0.25;
  const opticClickValueMRAD = source.opticClickValueMRAD || source.clickValueMRAD || (opticAdjustmentUnit === "MRAD" ? 0.1 : null);
  const opticClickValue = opticAdjustmentUnit === "MRAD" ? opticClickValueMRAD : opticClickValueMOA;
  const activeCalculationContext = activeCalculationContextForTarget();
  return {
    session_id: session && session.sessionId,
    sessionId: session && session.sessionId,
    target_profile_id: activeTargetProfileId(),
    targetProfileId: activeTargetProfileId(),
    currentDistance: Number(selectedDistanceValue || 100),
    currentDistanceUnit: selectedDistanceUnit,
    adjustmentUnit: opticAdjustmentUnit,
    clickValue: Number(opticClickValue),
    goToDistance: Number(goToDistance),
    activeCalculationContext,
    distanceTransitionAuthority: null
  };
}

async function requestDistanceClickQuery(goToDistance) {
  const response = await fetch(DISTANCE_CLICK_QUERY_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(distanceClickQueryPayload(goToDistance))
  });
  if (!response.ok) {
    throw new Error(`Distance click authority failed: ${response.status}`);
  }
  return response.json();
}

function bindGuidanceCard() {
  const calculateButton = document.getElementById("calculateDistanceClicks");
  if (!calculateButton) return;
  calculateButton.addEventListener("click", async () => {
    const desired = Number(document.getElementById("desiredZeroDistance").value);
    const result = document.getElementById("guidanceResult");
    if (!Number.isFinite(desired)) {
      result.textContent = "Dial:";
      return;
    }
    result.textContent = "Dial: Checking...";
    result.dataset.unit = selectedDistanceUnit;
    result.dataset.adjustmentUnit = selectedAdjustmentUnit;
    try {
      const authority = await requestDistanceClickQuery(desired);
      result.textContent = authority && authority.ok === true && authority.display
        ? authority.display
        : "Dial: Not enough info to calculate";
    } catch (error) {
      result.textContent = "Dial: Not enough info to calculate";
    }
  });
}

function workspaceEvidenceDimensions(evidence) {
  const source = String(evidence && evidence.dataUrl || "");
  if (source.includes("BAKER_ST-M16A2-M4_SMART_TARGET.svg")) {
    return { width: 1024, height: 1270 };
  }
  const width = Number(evidence && (evidence.imageWidthPx || evidence.width));
  const height = Number(evidence && (evidence.imageHeightPx || evidence.height));

  const naturalHeight = Number(image && image.naturalHeight);
  const dimensions = registered || (
    Number.isFinite(naturalWidth) && naturalWidth > 0 && Number.isFinite(naturalHeight) && naturalHeight > 0
      ? { width: naturalWidth, height: naturalHeight }
      : null
  );
  if (!dimensions) return;
  const viewportWidth = Math.max(1, document.documentElement.clientWidth || window.innerWidth || dimensions.width);
  const viewportHeight = Math.max(1, document.documentElement.clientHeight || window.innerHeight || dimensions.height);
  const width = Math.floor(Math.min(viewportWidth, viewportHeight * (dimensions.width / dimensions.height)));
  const height = Math.floor(width * (dimensions.height / dimensions.width));
  stage.style.setProperty("--workspace-stage-width", `${width}px`);
  stage.style.setProperty("--workspace-stage-height", `${height}px`);
  stage.style.setProperty("--workspace-target-ratio", `${dimensions.width} / ${dimensions.height}`);
  stage.dataset.geometryLocked = "true";
}

function downsizeImageDataUrl(dataUrl, maxSize = 1200) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
      if (scale >= 1) {
        resolve(dataUrl);
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.86));
    };
    image.onerror = () => resolve(dataUrl);
    image.src = dataUrl;
  });
}

const TRANSIENT_AUTHORITY_HTTP_STATUSES = new Set([502, 503, 504]);

function waitForAuthorityRetry(delayMs = 250) {
  return new Promise(resolve => window.setTimeout(resolve, delayMs));
}

async function fetchAuthorityResponse(authorityEndpoint, requestOptions) {
  let lastNetworkError = null;
  for (let attempt = 0; attempt < 2; attempt += 1) {
    try {
      const response = await fetch(authorityEndpoint, requestOptions);
      if (response.ok) return response;
      if (attempt === 0 && TRANSIENT_AUTHORITY_HTTP_STATUSES.has(response.status)) {
        await waitForAuthorityRetry();
        continue;
      }
      throw new Error(`Backend authority failed: ${response.status}`);
    } catch (error) {
      if (error && /^Backend authority failed:/.test(String(error.message || error))) throw error;
      lastNetworkError = error;
      if (attempt === 0) {
        await waitForAuthorityRetry();
        continue;
      }
    }
  }
  throw lastNetworkError || new Error("Backend authority request failed");
}

async function requestBackendAuthority() {
  const requestPayload = backendAuthorityRequest();
  const requestBody = JSON.stringify(requestPayload);
  const exactWireRequest = JSON.parse(requestBody);
  const authorityEndpoint = isM4AuthoritySession()
    ? SCZN3M4.M4_AUTHORITY_ENDPOINT
    : BACKEND_AUTHORITY_ENDPOINT;
  const response = await fetchAuthorityResponse(authorityEndpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: requestBody
  });
  const responseBody = await response.text();
  const authorityPackage = JSON.parse(responseBody);
  if (GSSF_CANONICAL_EXPORT_ENABLED && isGssfAuthoritySession()) {
    gssfCanonicalValidationTransaction = {
      evidenceType: "SCZN3 GSSF canonical-session diagnostic validation evidence",
      evidenceStatus: "diagnostic_only",
      observationSemantics: "xPx/yPx are ordered observation locations on the exact registered canonical asset; they are not scoring coordinates.",
      authorityChain: [
        "registered_asset_observation",
        "registration_package_transform",
        "geometry_profile_canonical_inches",
        "spatial_classification",
        "scoring_profile",
        "mission_profile",
        "result_package",
        "universal_sec"
      ],
      request: exactWireRequest,
      response: JSON.parse(responseBody)
    };
    window.__SCZN3_GSSF_CANONICAL_VALIDATION_EVIDENCE__ = gssfCanonicalValidationTransaction;
  }
  authorityPackage.frontendRequest = requestPayload;
  return authorityPackage;
}

async function resolveMissionFromTargetProfile() {
  if (!TARGET_PROFILE_LAUNCH_ID) return;
  if (SESSION_ROUTE_MISS) {
    renderMissionResolutionState();
    renderMarkStatus();
    return;
  }
  missionResolutionStatus = "resolving";
  missionResolutionMessage = "Loading target...";
  backendAuthorityPackage = null;
  syncAuthorityDerivedState();
  renderMissionResolutionState();
  try {
    if (!session) ensureTargetSession();
    if (isM4AuthoritySession()) {
      ensureTargetAttribution();
      const evidence = installM4CanonicalEvidence();
      missionResolutionStatus = "resolved";
      missionResolutionMessage = "";
      renderEvidencePreview(evidence);
      setMode("aim");
      renderSetupSummary();
      renderResults();
      renderMarkStatus();
      return;
    }
    if (isGssfAuthoritySession()) {
      const evidence = installGssfCanonicalEvidence();
      missionResolutionStatus = "resolved";
      missionResolutionMessage = "";
      renderEvidencePreview(evidence);
      setMode("impact");
      renderSetupSummary();
      renderResults();
      renderMarkStatus();
      return;
    }
    if (isBaker100YardSession()) {
      const evidence = installBaker100YardEvidence();
      missionResolutionStatus = "resolved";
      missionResolutionMessage = "";
      renderEvidencePreview(evidence);
      setMode("aim");
      renderSetupSummary();
      renderResults();
      renderMarkStatus();
      return;
    }
    const authorityPackage = await requestBackendAuthority();
    applyBackendAuthorityPackage(authorityPackage);
    if (!backendAuthorityPackage) {
      throw new Error("Backend returned incompatible mission package");
    }
    missionResolutionStatus = "resolved";
    missionResolutionMessage = "";
    renderEvidencePreview(activeEvidence());
    setMode(isGssfAuthoritySession() ? "impact" : (currentAimPoint ? "impact" : "aim"));
    renderSetupSummary();
    renderResults();
    renderMarkStatus();
  } catch (error) {
    console.warn("Mission resolution failed", error);
    backendAuthorityPackage = null;
    syncAuthorityDerivedState();
    missionResolutionStatus = "unavailable";
    missionResolutionMessage = "Unable to load this target. Try again.";
    renderMissionResolutionState();
  }
}

function columnLabel(index) {
  let value = index + 1;
  let label = "";
  while (value > 0) {
    value -= 1;
    label = String.fromCharCode(65 + (value % 26)) + label;
    value = Math.floor(value / 26);
  }
  return label;
}

function renderGridCoordinateOverlay() {
  const layer = document.getElementById("gridCoordinateLayer");
  if (!layer) return;
  if (!showGridCoordinates) {
    layer.textContent = "";
    layer.classList.remove("is-visible");
    return;
  }
  const grid = BAKER_GRID_AUDIT;
  const left = (grid.leftPx / grid.imageWidth) * 100;
  const top = (grid.topPx / grid.imageHeight) * 100;
  const width = ((grid.rightPx - grid.leftPx) / grid.imageWidth) * 100;
  const height = ((grid.bottomPx - grid.topPx) / grid.imageHeight) * 100;
  const columns = Math.round((grid.rightPx - grid.leftPx) / grid.squarePx);
  const rows = Math.round((grid.bottomPx - grid.topPx) / grid.squarePx);
  const columnLabels = Array.from({ length: columns }, (_, index) => {
    const x = left + (((index + 0.5) / columns) * width);
    return `<span class="grid-coordinate-label grid-column-label" style="left:${x}%;top:${top}%">${columnLabel(index)}</span>`;
  }).join("");
  const rowLabels = Array.from({ length: rows }, (_, index) => {
    const y = top + (((index + 0.5) / rows) * height);
    return `<span class="grid-coordinate-label grid-row-label" style="left:${left}%;top:${y}%">${index + 1}</span>`;
  }).join("");
  layer.classList.add("is-visible");
  layer.innerHTML = `
    <div class="grid-coordinate-box" style="left:${left}%;top:${top}%;width:${width}%;height:${height}%"></div>
    ${columnLabels}
    ${rowLabels}`;
}

function markerPointHtml(className, point, content = "", attributes = "") {
  const safe = safePoint(point);
  if (!safe) return "";
  return `<span class="${className}" style="left:${safe.xPercent}%;top:${safe.yPercent}%" data-x-percent="${safe.xPercent}" data-y-percent="${safe.yPercent}"${attributes ? ` ${attributes}` : ""}>${content}</span>`;
}

function backendHitClassifications(authorityPackage) {
  return Array.isArray(authorityPackage && authorityPackage.hitClassifications)
    ? authorityPackage.hitClassifications
    : [];
}

function backendHitCoordinateForValidation(authorityPackage, hit, index) {
  return safePoint((hit && hit.coordinate) || backendRenderedHitCoordinates(authorityPackage)[index]);
}

function backendRenderedHitEntries(authorityPackage) {
  const render = authorityPackage && authorityPackage.renderCoordinates ? authorityPackage.renderCoordinates : {};
  const hits = Array.isArray(render.hits) ? render.hits : [];
  const impacts = Array.isArray(render.impacts) ? render.impacts : [];
  return hits.length ? hits : impacts;
}

function backendShotIdForHit(authorityPackage, hit, index) {
  if (hit && hit.shot !== undefined && hit.shot !== null && hit.shot !== "") return hit.shot;
  const renderedHit = backendRenderedHitEntries(authorityPackage)[index];
  return renderedHit && renderedHit.shot !== undefined && renderedHit.shot !== null && renderedHit.shot !== ""
    ? renderedHit.shot
    : null;
}

function gssfZoneTone(zone) {
  const normalized = String(zone || "").trim().toLowerCase().replace(/[\s_-]+/g, "");
  if (normalized === "downzero" || normalized === "0") return "down-zero";
  if (normalized === "plusone" || normalized === "+1" || normalized === "1") return "plus-one";
  if (normalized === "plusthree" || normalized === "+3" || normalized === "3") return "plus-three";
  if (normalized === "miss") return "miss";
  return "other";
}

function gssfZoneMarkerClass(zone) {
  return `gssf-zone-${gssfZoneTone(zone)}`;
}

function isGssfBucketLine(line) {
  const label = String(line || "").split(":")[0].trim().toLowerCase();
  return label === "down zero" || label === "+1" || label === "+3" || label === "miss";
}

function gssfContextResultLines(lines) {
  return Array.isArray(lines) ? lines.filter(line => !isGssfBucketLine(line)) : [];
}

function gssfShooterResultLines(lines) {
  return gssfContextResultLines(lines).filter(line => /^paper penalty:/i.test(String(line || "").trim()));
}

function gssfFormatSeconds(value) {
  return typeof value === "number" && Number.isFinite(value) ? `${value.toFixed(2)} sec` : "unavailable";
}

function gssfPaperPenaltySeconds(authorityPackage) {
  return isGssfAuthorityPackage(authorityPackage) ? authorityPackage.totalPaperPenaltySeconds : null;
}

function gssfOfficialCompetitionResult(authorityPackage) {
  const hasAuthority = isGssfAuthorityPackage(authorityPackage);
  const officialMatchTimeSeconds = hasAuthority
    && typeof authorityPackage?.rawTimeSeconds === "number"
    && Number.isFinite(authorityPackage.rawTimeSeconds)
    && authorityPackage.rawTimeSeconds >= 0
    ? authorityPackage.rawTimeSeconds
    : null;
  const totalPaperPenaltySeconds = gssfPaperPenaltySeconds(authorityPackage);
  const officialFinalScoreSeconds = hasAuthority
    && authorityPackage?.finalTimeStatus === "calculated"
    && typeof authorityPackage.finalTimeSeconds === "number"
    && Number.isFinite(authorityPackage.finalTimeSeconds)
    && authorityPackage.finalTimeSeconds >= 0
    ? authorityPackage.finalTimeSeconds
    : null;
  return {
    officialMatchTimeSeconds,
    totalPaperPenaltySeconds,
    officialFinalScoreSeconds,
    finalScoreStatus: totalPaperPenaltySeconds === null
      ? "authority_unavailable"
      : (officialFinalScoreSeconds === null ? "unavailable_without_official_time" : "calculated"),
    manualTimeSource: "shooter-entered-official-timer",
    scoringSource: "backend-penalty-plus-manual-time"
  };
}

function gssfOfficialFinalScoreHtml(authorityPackage) {
  const result = gssfOfficialCompetitionResult(authorityPackage);
  const hasTimerTime = result.officialMatchTimeSeconds !== null;
  const finalText = result.finalScoreStatus === "authority_unavailable"
    ? "Authority unavailable"
    : (result.officialFinalScoreSeconds === null
      ? gssfFormatSeconds(result.totalPaperPenaltySeconds)
      : gssfFormatSeconds(result.officialFinalScoreSeconds));
  const inputValue = result.officialMatchTimeSeconds === null ? "" : Number(result.officialMatchTimeSeconds).toFixed(2);
  const officialTimeText = hasTimerTime ? gssfFormatSeconds(result.officialMatchTimeSeconds) : "Not entered";
  const paperPenaltyText = result.totalPaperPenaltySeconds === null
    ? "Authority unavailable"
    : `+${gssfFormatSeconds(result.totalPaperPenaltySeconds)}`;
  return `
    <section class="gssf-final-score-panel" aria-label="Competition paper target result">
      <span id="gssfOfficialResultLabel">${hasTimerTime ? "Final Time" : "Paper Penalty"}</span>
      <strong id="gssfOfficialFinalScore">${escapeHtml(finalText)}</strong>
      <p id="gssfOfficialResultStatus"${hasTimerTime ? " hidden" : ""}>Timer time required for Final Time</p>
      <div class="gssf-final-score-breakdown" aria-label="Score breakdown">
        <div>
          <span>Timer Time</span>
          <strong id="gssfOfficialTimeDisplay">${escapeHtml(officialTimeText)}</strong>
        </div>
        <div>
          <span>Paper Penalty</span>
          <strong>${escapeHtml(paperPenaltyText)}</strong>
        </div>
      </div>
      <small>Timer time + paper penalty = Final Time</small>
    </section>
    <label class="gssf-official-time-entry" for="gssfOfficialMatchTime">
      <span>Timer Time</span>
      <input id="gssfOfficialMatchTime" type="number" inputmode="decimal" min="0" step="0.01" placeholder="42.31" value="${escapeHtml(inputValue)}" />
      <small>Enter the official timer value from the range.</small>
      <em id="gssfOfficialTimeSource">Entered manually</em>
    </label>
  `;
}

function updateGssfOfficialFinalScoreDisplay(authorityPackage) {
  const finalScore = document.getElementById("gssfOfficialFinalScore");
  const officialTimeDisplay = document.getElementById("gssfOfficialTimeDisplay");
  const resultLabel = document.getElementById("gssfOfficialResultLabel");
  const resultStatus = document.getElementById("gssfOfficialResultStatus");
  if (!finalScore) return;
  const result = gssfOfficialCompetitionResult(authorityPackage);
  const hasTimerTime = result.officialMatchTimeSeconds !== null;
  finalScore.textContent = result.finalScoreStatus === "authority_unavailable"
    ? "Authority unavailable"
    : (result.officialFinalScoreSeconds === null
      ? gssfFormatSeconds(result.totalPaperPenaltySeconds)
      : gssfFormatSeconds(result.officialFinalScoreSeconds));
  if (resultLabel) resultLabel.textContent = hasTimerTime ? "Final Time" : "Paper Penalty";
  if (resultStatus) resultStatus.hidden = hasTimerTime;
  if (officialTimeDisplay) {
    officialTimeDisplay.textContent = hasTimerTime
      ? gssfFormatSeconds(result.officialMatchTimeSeconds)
      : "Not entered";
  }
}

function bindGssfOfficialTimeInput(authorityPackage) {
  const input = document.getElementById("gssfOfficialMatchTime");
  if (!input || input.dataset.gssfOfficialTimeBound) return;
  input.dataset.gssfOfficialTimeBound = "true";
  input.addEventListener("input", () => {
    markWorkspaceProgressUnsaved();
    const rawValue = String(input.value || "").trim();
    const value = Number(rawValue);
    gssfOfficialMatchTimeSeconds = rawValue !== "" && Number.isFinite(value) && value >= 0 ? value : null;
    const requestToken = ++gssfTimerAuthorityRequestToken;
    window.clearTimeout(gssfTimerAuthorityRequestHandle);
    gssfTimerAuthorityRequestHandle = window.setTimeout(async () => {
      try {
        const verifiedPackage = await requestBackendAuthority();
        if (requestToken !== gssfTimerAuthorityRequestToken) return;
        applyBackendAuthorityPackage(verifiedPackage);
        renderMarkers();
        renderResults();
        renderMarkStatus();
      } catch (error) {
        if (requestToken !== gssfTimerAuthorityRequestToken) return;
        console.warn("Timer authority request failed", error);
        authorityStatusMessage = "Final Time unavailable: timer time could not be verified by scoring authority.";
        renderResults();
      }
    }, 250);
  });
}

function gssfBucketDefinitions() {
  return [
    { id: "down-zero", zone: "downZero", label: "Down Zero" },
    { id: "plus-one", zone: "plusOne", label: "+1" },
    { id: "plus-three", zone: "plusThree", label: "+3" },
    { id: "miss", zone: "miss", label: "Miss / Other" }
  ];
}

function gssfAuthoritativeBreakdown(authorityPackage) {
  if (!isGssfAuthorityPackage(authorityPackage)) return [];
  const breakdownByZone = new Map(authorityPackage.scoringBreakdown.map(bucket => [bucket.zone, bucket]));
  return gssfBucketDefinitions().map(bucket => ({ ...bucket, source: breakdownByZone.get(bucket.zone) }));
}

function gssfBucketSummaryHtml(authorityPackage) {
  const buckets = gssfAuthoritativeBreakdown(authorityPackage);
  if (!buckets.length) return "";
  const cards = buckets.map(bucket => {
    const count = Number(bucket.source.count);
    const multiplier = Number(bucket.source.penaltySecondsPerHit);
    const subtotal = Number(bucket.source.subtotalPenaltySeconds);
    const shotIds = bucket.source.shotIds.map(String);
    return `
      <div class="gssf-bucket-card gssf-zone-card-${bucket.id}">
        <strong><i class="gssf-zone-dot gssf-zone-${bucket.id}"></i>${escapeHtml(bucket.label)}</strong>
        <em>${escapeHtml(`${count} × ${multiplier}`)}</em>
        <b>${escapeHtml(`= ${subtotal} sec`)}</b>
        <span>Hits: ${escapeHtml(count)}</span>
        <small>Shots: <i class="gssf-shot-id-list">${escapeHtml(shotIds.length ? shotIds.join(", ") : "None")}</i></small>

  }).join("");
  return `<div class="gssf-bucket-grid" aria-label="Competition paper target scoring buckets">${cards}</div>`;

function vectorHtmlFromBackend(vector) {
  if (!vector || !vector.start || !vector.end) return "";
  const start = safePoint(vector.start);
  const end = safePoint(vector.end);
  if (!start || !end) return "";

    <defs>
      <marker id="targetCorrectionArrowhead" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto" markerUnits="strokeWidth">

    </defs>
    <line x1="${start.xPercent}" y1="${start.yPercent}" x2="${end.xPercent}" y2="${end.yPercent}" marker-end="url(#targetCorrectionArrowhead)"></line>

}

function renderPendingInputMarkers() {

function backendPoibDisplayCoordinate(authorityPackage) {
  if (!authorityPackage) return null;
  const backendPoib = safePoint(authorityPackage.poib || authorityPackage.groupCenter);
  if (backendPoib) return backendPoib;
  if (typeof console !== "undefined" && !backendPoibDisplayCoordinate.hasWarned) {

  }

}

function backendRenderedHitCoordinates(authorityPackage) {
  return backendRenderedHitEntries(authorityPackage).map(safePoint).filter(Boolean);
}

function renderBackendAuthorityMarkers(authorityPackage) {
  const render = authorityPackage && authorityPackage.renderCoordinates ? authorityPackage.renderCoordinates : {};
  const parts = [];
  const classifications = backendHitClassifications(authorityPackage);
  const confirmationEvidenceOnly = isM4AuthoritySession() && m4LivePhase === "confirmation";
  if (!confirmationEvidenceOnly) parts.push(vectorHtmlFromBackend(render.vector));
  backendRenderedHitCoordinates(authorityPackage).forEach((point, index) => {
    const hit = classifications[index] || {};
    const shotNumber = backendShotIdForHit(authorityPackage, hit, index);
    const zone = escapeHtml(hit.zone || "");
    const zoneClass = isGssfAuthorityPackage(authorityPackage) ? ` ${gssfZoneMarkerClass(hit.zone)}` : "";
    const label = shotNumber === null ? String(index + 1) : String(shotNumber);
    parts.push(markerPointHtml(`target-marker impact-marker${zoneClass}`, point, label, `data-shot-index="${escapeHtml(label)}" data-backend-zone="${zone}"`));
  });
  if (render.aim && !isM4AuthoritySession()) {
    parts.push(markerPointHtml("target-marker aim-marker", render.aim, "", 'aria-label="Confirmed aim point"'));
  }
  if (render.bull && !isM4AuthoritySession()) {
    parts.push(markerPointHtml("target-marker bull-marker", render.bull, "", 'aria-label="Registered bull"'));
  }
  const poib = backendPoibDisplayCoordinate(authorityPackage);
  if (poib && !confirmationEvidenceOnly) {
    parts.push(markerPointHtml("target-marker poib-auto-marker", poib, "POIB", 'aria-label="Point of impact balance"'));
  }
  return parts.join("");
}

function renderMarkers() {
  const layer = document.getElementById("markerLayer");
  if (!layer) return;
  syncOverlayLayerToDisplayedImage();
  if (isDotTortureAuthoritySession()) {
    layer.innerHTML = "";
    renderResults();
    return;
  }
  const correction = currentVisualCorrection();
  const authorityPackage = resultsShown ? backendAuthorityPackage : null;
  layer.innerHTML = (authorityPackage ? renderBackendAuthorityMarkers(authorityPackage) : renderPendingInputMarkers()) + renderCorrectionOverlay(correction);
  syncArrowLayerToMarkerLayer();
  auditBackendMarkerAlignment(authorityPackage);
  renderResults();
}

function auditBackendMarkerAlignment(authorityPackage) {
  if (!authorityPackage || !authorityPackage.renderCoordinates || typeof console === "undefined") return;
  requestAnimationFrame(() => {
    const layer = document.getElementById("markerLayer");
    if (!layer) return;
    const layerRect = layer.getBoundingClientRect();
    const backendHits = backendRenderedHitCoordinates(authorityPackage);
    if (!backendHits.length) return;
    const markers = Array.from(layer.querySelectorAll(".impact-marker"));
    const mismatches = backendHits
      .map((point, index) => {
        const marker = markers[index];
        if (!marker) return { shot: index + 1, reason: "missing rendered marker", point };
        const rendered = renderedPercentFromRect(marker.getBoundingClientRect(), layerRect);
        if (!rendered) return { shot: index + 1, reason: "unreadable marker", point };
        const xDelta = Number((rendered.xPercent - point.xPercent).toFixed(2));
        const yDelta = Number((rendered.yPercent - point.yPercent).toFixed(2));
        return Math.abs(xDelta) > 0.25 || Math.abs(yDelta) > 0.25
          ? { shot: index + 1, expected: point, rendered, xDelta, yDelta }
          : null;
      })
      .filter(Boolean);
    if (mismatches.length) {
      console.warn("Backend hit marker display does not match backend render coordinates.", mismatches);
    }
    const aimMarker = layer.querySelector(".aim-marker");
    const arrowLine = layer.querySelector(".target-correction-vector line");
    const authoritativeAim = safePoint(authorityPackage.renderCoordinates.aim);
    const authoritativeVectorEnd = safePoint(authorityPackage.renderCoordinates.vector && authorityPackage.renderCoordinates.vector.end);
    const renderedAim = aimMarker ? renderedPercentFromRect(aimMarker.getBoundingClientRect(), layerRect) : null;
    const arrowEnd = arrowLine ? {
      xPercent: Number(arrowLine.getAttribute("x2")),
      yPercent: Number(arrowLine.getAttribute("y2"))
    } : null;
    const exceedsTolerance = (first, second) => !first || !second
      || Math.abs(Number(first.xPercent) - Number(second.xPercent)) > 0.25
      || Math.abs(Number(first.yPercent) - Number(second.yPercent)) > 0.25;
    if (
      exceedsTolerance(authoritativeVectorEnd, authoritativeAim)
      || exceedsTolerance(arrowEnd, authoritativeAim)
      || (!isM4AuthoritySession() && exceedsTolerance(renderedAim, authoritativeAim))
    ) {
      console.warn("Confirmed Aim Point authority does not match the rendered vector endpoint.", {
        authoritativeAim,
        authoritativeVectorEnd,
        arrowEnd,
        renderedAim
      });
    }
  });
}

function compactClick(value, axis) {
  if (!value) return "Not calculated";
  const label = typeof value === "object" && value.label ? value.label : String(value);
  const amount = typeof value === "object" && Number.isFinite(Number(value.clicks))
    ? String(Math.abs(Number(value.clicks)))
    : (label.match(/\d+/)?.[0] || "0");
  const upper = typeof value === "object" && value.direction
    ? String(value.direction).toUpperCase()
    : label.toUpperCase();
  if (axis === "elevation") {
    if (upper.includes("UP")) return `${amount} Clicks ↑`;
    if (upper.includes("DOWN")) return `${amount} Clicks ↓`;
  }
  if (axis === "windage") {
    if (upper.includes("RIGHT")) return `${amount} Clicks →`;
    if (upper.includes("LEFT")) return `${amount} Clicks ←`;
  }
  return `${amount} Clicks`;
}

function scoreClass(score) {
  if (!Number.isFinite(score)) return "score-pending";
  if (score >= 90) return "score-green";
  if (score >= 80) return "score-yellow";
  if (score >= 70) return "score-orange";
  return "score-red";
}

function renderDotTortureTrainingResults(authorityPackage) {
  const grid = document.getElementById("resultsGrid");
  if (grid && !document.getElementById("dotTortureTrainingResult")) {
    grid.innerHTML = dotTortureTrainingHtml(authorityPackage);
  }
  const stages = Array.isArray(authorityPackage.stages) ? authorityPackage.stages : [];
  const hasBackendTrainingPackage = isDotTortureTrainingPackage(authorityPackage) && authorityPackage.ok === true;
  const maxIndex = Math.max(stages.length - 1, 0);
  trainingStageIndex = Math.min(Math.max(trainingStageIndex, 0), maxIndex);
  const counter = document.getElementById("trainingStageCounter");
  const guidance = document.getElementById("trainingCurrentGuidance");
  const stageLabel = document.getElementById("trainingStageLabel");
  const stageTitle = document.getElementById("trainingStageTitle");
  const stageRounds = document.getElementById("trainingStageRounds");
  const beginButton = document.getElementById("trainingBeginStage");
  const previousButton = document.getElementById("trainingPreviousStage");
  const nextButton = document.getElementById("trainingNextStage");
  const finishButton = document.getElementById("trainingFinishDrill");
  const status = document.getElementById("trainingDrillStatus");
  const secPreview = document.getElementById("trainingSecPreview");
  const savedStatus = document.getElementById("trainingSecSavedStatus");
  const manualFields = ["trainingManualScore", "trainingManualMisses", "trainingManualTime", "trainingManualNotes"]
    .map(id => document.getElementById(id))
    .filter(Boolean)
    .concat(Array.from(document.querySelectorAll(".training-stage-score-input")));
  if (counter) counter.textContent = `Stage ${trainingStageIndex + 1} of ${Math.max(stages.length, 1)}`;
  if (stageLabel) stageLabel.textContent = trainingStageLabel(authorityPackage, trainingStageIndex);
  if (stageTitle) stageTitle.textContent = `Stage ${trainingStageIndex + 1}`;
  if (stageRounds) stageRounds.textContent = String((stages[trainingStageIndex] && stages[trainingStageIndex].rounds) || "--");
  if (guidance) guidance.innerHTML = hasBackendTrainingPackage
    ? conciseTrainingInstruction(authorityPackage, trainingStageIndex)
    : "Stage guidance is loading.";
  if (beginButton) {
    beginButton.disabled = !hasBackendTrainingPackage || trainingDrillFinished;
    beginButton.textContent = trainingStageIndex >= maxIndex ? "Finish Drill" : (trainingStageIndex === 0 ? "Begin Stage" : "Next Stage");
    beginButton.onclick = () => {
      if (!hasBackendTrainingPackage || trainingDrillFinished) return;
      markWorkspaceProgressUnsaved();
      if (trainingStageIndex < maxIndex) {
        trainingStageIndex += 1;
        renderDotTortureTrainingResults(authorityPackage);
      } else {
        trainingDrillFinished = true;
        renderDotTortureTrainingResults(authorityPackage);
        renderMarkStatus();
      }
    };
  }
  if (previousButton) {
    previousButton.disabled = !hasBackendTrainingPackage || trainingDrillFinished || trainingStageIndex <= 0;
    previousButton.onclick = () => {
      if (trainingStageIndex > 0) {
        markWorkspaceProgressUnsaved();
        trainingStageIndex -= 1;
        renderDotTortureTrainingResults(authorityPackage);
      }
    };
  }
  if (nextButton) {
    nextButton.disabled = !hasBackendTrainingPackage || trainingDrillFinished || trainingStageIndex >= maxIndex;
    nextButton.classList.toggle("secondary", !hasBackendTrainingPackage || trainingDrillFinished || trainingStageIndex >= maxIndex);
    nextButton.onclick = () => {
      if (trainingStageIndex < maxIndex) {
        markWorkspaceProgressUnsaved();
        trainingStageIndex += 1;
        renderDotTortureTrainingResults(authorityPackage);
      }
    };
  }
  if (finishButton) {
    const finishIsPrimary = hasBackendTrainingPackage && !trainingDrillFinished && trainingStageIndex >= maxIndex;
    finishButton.disabled = !hasBackendTrainingPackage;
    finishButton.textContent = trainingDrillFinished ? "Drill Complete" : "Finish Drill";
    finishButton.classList.toggle("secondary", !finishIsPrimary);
    finishButton.onclick = () => {
      markWorkspaceProgressUnsaved();
      trainingDrillFinished = true;
      renderDotTortureTrainingResults(authorityPackage);
      renderMarkStatus();
    };
  }
  if (status) {
    status.textContent = !hasBackendTrainingPackage
      ? "Stage guidance required."
      : (trainingDrillFinished ? "Results ready. Save when ready." : "");
  }
  if (secPreview) secPreview.classList.toggle("is-hidden", !trainingDrillFinished);
  if (savedStatus) savedStatus.textContent = sessionSaved ? "saved" : "pending";
  manualFields.forEach(field => {
    if (!field.dataset.trainingManualBound) {
      field.addEventListener("input", () => {
        markWorkspaceProgressUnsaved();
        updateTrainingManualPreview();
      });
      field.dataset.trainingManualBound = "true";
    }
  });
  updateTrainingManualPreview();
  const message = document.getElementById("authorityStatusMessage");
  if (message) {

function renderResults() {
  if (isMissionResolving() || isMissionResolutionUnavailable()) {
    renderMissionResolutionState();
    return;
  }
  syncAuthorityDerivedState();
  const impacts = currentImpactPoints;
  const numericScore = currentScore === null ? NaN : Number(currentScore);
  document.body.dataset.authorityStatus = authorityStatusMessage ? "true" : "false";
  if (isDotTortureAuthoritySession() || isDotTortureTrainingPackage(backendAuthorityPackage)) {
    renderDotTortureTrainingResults(dotTortureWorkspacePackage());
    return;
  }
  if (isGssfAuthoritySession() && !isGssfAuthorityPackage(backendAuthorityPackage)) {
    const grid = document.getElementById("resultsGrid");
    if (grid) grid.innerHTML = targetIntelStackHtml();
    bindAuthorityRecoveryAction();
    return;
  }
  if (isGssfAuthorityPackage(backendAuthorityPackage)) {
    let resultBlock = document.getElementById("gssfAuthorityResult");
    if (!resultBlock) {
      const grid = document.getElementById("resultsGrid");
      if (grid) grid.innerHTML = targetIntelStackHtml();
      resultBlock = document.getElementById("gssfAuthorityResult");
    }
    const lines = backendAuthorityPackage.display && Array.isArray(backendAuthorityPackage.display.resultLines)
      ? backendAuthorityPackage.display.resultLines
      : [];
    if (resultBlock) {
      resultBlock.innerHTML = gssfShooterModeHtml(backendAuthorityPackage, lines);
      bindGssfOfficialTimeInput(backendAuthorityPackage);
    }
    const message = document.getElementById("authorityStatusMessage");
    if (message) {
      message.innerHTML = authorityStatusMessage
        ? `<strong>${authorityStatusMessage}</strong>`
        : "";
      message.classList.toggle("is-hidden", !authorityStatusMessage);
    }
    return;
  }
  if (authorityStatusMessage && !resultsShown) {
    const grid = document.getElementById("resultsGrid");
    if (grid) grid.innerHTML = authorityRecoveryHtml(authorityStatusMessage);
    bindAuthorityRecoveryAction();
    return;
  }
  let scoreCell = document.getElementById("scoreCell");
  if (!scoreCell && resultsShown) {
    const grid = document.getElementById("resultsGrid");
    if (grid) grid.innerHTML = targetIntelStackHtml();
    bindDistanceControl();
    scoreCell = document.getElementById("scoreCell");
  }
  if (!scoreCell) {
    const grid = document.getElementById("resultsGrid");
    if (grid && authorityStatusMessage) grid.innerHTML = authorityRecoveryHtml(authorityStatusMessage);
    bindAuthorityRecoveryAction();
    return;
  }
  scoreCell.className = `target-intel-score ${scoreClass(numericScore)}`;
  document.getElementById("scoreValue").textContent = Number.isFinite(numericScore) ? String(numericScore) : "--";
  const hitsParts = [SIMULATION_MODE
    ? `Shot group: ${impacts.length} ${impacts.length === 1 ? "impact" : "impacts"}`
    : `${impacts.length} Hits`];
  if (SIMULATION_MODE && backendPoibDisplayCoordinate(backendAuthorityPackage)) {
    hitsParts.push("Center of group highlighted");
  }
  document.getElementById("hitsValue").textContent = hitsParts.join(" • ");
  const message = document.getElementById("authorityStatusMessage");
  if (message) {
    message.innerHTML = authorityStatusMessage
      ? `<strong>${authorityStatusMessage}</strong>`
      : "";
    message.classList.toggle("is-hidden", !authorityStatusMessage);
  }
}

function shooterTipFromResults() {
  if (!currentImpactPoints.length) return "Record confirmed impacts before saving.";
  if (!currentClicks) return "The group is measured, but click instructions are unavailable for this sight setup.";
  if (currentImpactPoints.length < 3) return "Add more confirmed impacts for a stronger read.";
  const windage = Number(currentClicks.windageClicks || 0);
  const elevation = Number(currentClicks.elevationClicks || 0);
  const windageDirection = String(currentClicks.windageDirection || "CENTER").toLowerCase();
  const elevationDirection = String(currentClicks.elevationDirection || "CENTER").toLowerCase();
  if (windage === 0 && elevation === 0) return "Group is centered; confirm with another string.";
  if (elevation > windage) return "Apply elevation " + elevationDirection + ", then confirm.";
  if (windage > elevation) return "Apply windage " + windageDirection + ", then confirm.";
  return "Apply both corrections, then confirm.";
}

function scheduleHoleEntryReadiness() {
  cancelHoleEntryReadiness();
  holeEntrySettled = false;
  if (!currentImpactPoints.length || resultsShown) return;
  holeEntryIdleHandle = window.setTimeout(() => {
    holeEntryIdleHandle = null;
    if (!resultsShown && currentImpactPoints.length) {
      holeEntrySettled = true;
      correctionContextReviewDismissed = false;
      renderMarkStatus();
    }
  }, HOLE_ENTRY_IDLE_MS);

function resultsOfferReady() {
  return !isM4AuthoritySession() || holeEntrySettled;

function awaitingNextM4Group() {
  return !!(
    isM4AuthoritySession()
    && m4LivePhase === "confirmation"
    && resultsShown
    && backendAuthorityPackage
    && backendAuthorityPackage.validation
    && backendAuthorityPackage.validation.status === "calculated"
    && !backendAuthorityPackage.validation.confirmed
    && !correctionContextPending

  );

function rangeWorkflowState(canMark) {
  if (simulationLimitReached()) return "simulation-complete";
  if (!canMark) return "choose-target";
  if (isDotTortureAuthoritySession()) {
    if (!resultsShown) return "show-results";
    if (!trainingDrillFinished) return "training-drill";
    if (!sessionSaved) return "save-session";
    return "view-sec";
  }
  if (isGssfAuthoritySession()) {
    if (!currentImpactPoints.length) return "tap-holes";
    if (!resultsShown) return "show-results";
    if (!sessionSaved) return "save-session";
    return "view-sec";
  }
  if (!currentAimPoint) return "tap-aim";
  if (!currentImpactPoints.length) return "tap-holes";
  if (founderContextAtResultsGate()) return "review-context";
  if (!resultsShown) return resultsOfferReady() ? "show-results" : "tap-holes";
  if (correctionContextPending) return "confirm-context";
  if (awaitingNextM4Group()) return "await-next-group";
  if (
    isM4AuthoritySession()
    && m4LivePhase === "confirmation"
    && backendAuthorityPackage
    && backendAuthorityPackage.validation
    && !backendAuthorityPackage.validation.confirmed
  ) return "continue-confirmation";
  if (!sessionSaved) return "save-session";
  return "view-sec";
}

    ["chooseTargetButton", "setAimMode", "addImpactMode", "showResults", "undoImpact", "clearMarks", "saveMarks"].forEach(id => {

  }
  setMissionResolutionChrome();
  if (simulationLimitReached()) {

    return;
  }
  const isGssf = isGssfAuthoritySession();

  syncCorrectionContextGate();

    || sessionSaved
    || !resultsShown
    || correctionContextPending
    || awaitingNextM4Group()
    || (isTraining && !trainingDrillFinished);
  document.getElementById("showResults").disabled = authorityRequestInFlight || !canProceed || (!isTraining && currentImpactPoints.length === 0);
  let nextStep = "chooseTargetButton";
  if (canProceed && isTraining && !resultsShown) nextStep = "showResults";
  if (hasEvidence && isGssf && !currentImpactPoints.length) nextStep = "addImpactMode";
  if (hasEvidence && !isGssf && !isTraining && !currentAimPoint) nextStep = "setAimMode";
  if (hasEvidence && !isGssf && !isTraining && currentAimPoint && !currentImpactPoints.length) nextStep = "addImpactMode";
  if (hasEvidence && !isTraining && currentImpactPoints.length && !resultsShown) {
    nextStep = resultsOfferReady() ? "showResults" : "addImpactMode";
  }
  if (canProceed && resultsShown && (!isTraining || trainingDrillFinished)) nextStep = "saveMarks";
  if (correctionContextPending || founderContextAtResultsGate() || awaitingNextM4Group()) nextStep = null;
  if (sessionSaved) nextStep = null;
  setNextStep(nextStep);
  const saveButton = document.getElementById("saveMarks");
  if (saveButton && isM4AuthoritySession()) {
    const confirmationComplete = m4LivePhase === "confirmation"
      && backendAuthorityPackage
      && backendAuthorityPackage.validation
      && backendAuthorityPackage.validation.confirmed;
    const additionalCorrection = m4LivePhase === "confirmation"
      && backendAuthorityPackage
      && backendAuthorityPackage.validation
      && backendAuthorityPackage.validation.status === "calculated"
      && !backendAuthorityPackage.validation.confirmed;
    saveButton.textContent = confirmationComplete
      ? "Save Session"
      : additionalCorrection
        ? "Fire Another Group"
        : m4LivePhase === "confirmation"
          ? "Save Session"
          : "Apply the Correction, Then Begin Confirmation";
  } else if (saveButton) {
    saveButton.textContent = "Save Session";
  }
  document.body.dataset.rangeState = rangeWorkflowState(canProceed);
  document.body.dataset.m4LivePhase = isM4AuthoritySession() ? m4LivePhase : "";
  document.body.dataset.hasEvidence = hasEvidence ? "true" : "false";
  document.body.dataset.hasResults = resultsShown ? "true" : "false";
  document.body.dataset.awaitingNextGroup = awaitingNextM4Group() ? "true" : "false";
  document.body.dataset.correctionContext = correctionContextPending
    ? "pending"
    : correctionContextConfirmedFingerprint
      ? "confirmed"
      : "unconfirmed";
  document.body.dataset.targetMission = isTraining ? "marksmanshipTraining" : (isGssf ? "gssf" : "zeroing");
}

function handleMarkTap(event) {
  if (!hasMarkableEvidence()) return;
  const beginsNextGroup = awaitingNextM4Group();
  if (resultsShown && !beginsNextGroup) return;
  if (SIMULATION_MODE && (currentAimPoint || isGssfAuthoritySession()) && currentImpactPoints.length >= 10) return;
  syncOverlayLayerToDisplayedImage();
  const point = evidencePointFromPointer(event);
  if (!point) return;
  if (beginsNextGroup) {
    cancelHoleEntryReadiness();
    currentImpactPoints = [point];
    currentClicks = null;
    currentScore = null;
    backendAuthorityPackage = null;
    resultsShown = false;
    authorityStatusMessage = "";
    sessionSaved = false;
    holeEntrySettled = false;
    markMode = "impact";
    hideShooterTip();
    setSaveSessionStatus("");
    scheduleHoleEntryReadiness();
  } else if (isGssfAuthoritySession()) {
    currentImpactPoints.push(point);
    scheduleHoleEntryReadiness();
  } else if (markMode === "aim" || !currentAimPoint) {
    currentAimPoint = point;
    markMode = "impact";
    holeEntrySettled = false;
  } else {
    currentImpactPoints.push(point);
    correctionContextReviewDismissed = false;
    scheduleHoleEntryReadiness();
  }
  markWorkspaceProgressUnsaved();
  clearCalculatedResults();
  setMode(markMode);
  renderMarkers();
  renderMarkStatus();
}

function resetMarkPointerState() {
  activeMarkPointers.clear();
  markTapCandidate = null;
  markGestureCancelled = false;
}

function handleMarkPointerDown(event) {
  if (resultsShown && !awaitingNextM4Group()) return;
  if (!hasMarkableEvidence()) return;
  activeMarkPointers.add(event.pointerId);
  if (activeMarkPointers.size > 1) {
    markGestureCancelled = true;
    markTapCandidate = null;
    return;
  }
  markGestureCancelled = false;
  markTapCandidate = {
    pointerId: event.pointerId,
    pointerType: event.pointerType,
    clientX: event.clientX,
    clientY: event.clientY
  };
}

function handleMarkPointerUp(event) {
  const wasOnlyPointer = activeMarkPointers.size === 1 && activeMarkPointers.has(event.pointerId);
  activeMarkPointers.delete(event.pointerId);
  if ((resultsShown && !awaitingNextM4Group()) || !hasMarkableEvidence()) {
    resetMarkPointerState();
    return;
  }
  if (!wasOnlyPointer || markGestureCancelled || !markTapCandidate || markTapCandidate.pointerId !== event.pointerId) {
    if (!activeMarkPointers.size) resetMarkPointerState();
    return;
  }
  const moveDistance = Math.hypot(event.clientX - markTapCandidate.clientX, event.clientY - markTapCandidate.clientY);
  const maxTapMove = markTapCandidate.pointerType === "touch" ? 24 : 8;
  if (moveDistance <= maxTapMove) handleMarkTap(event);
  resetMarkPointerState();
}

function handleMarkPointerCancel(event) {
  activeMarkPointers.delete(event.pointerId);
  if (!activeMarkPointers.size) resetMarkPointerState();
}

function handleMarkTouchMove(event) {
  if ((resultsShown && !awaitingNextM4Group()) || !hasMarkableEvidence()) return;
  if (event.touches && event.touches.length === 1) event.preventDefault();
}
