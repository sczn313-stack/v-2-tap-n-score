      plusThreeCount: authorityPackage.plusThreeCount,
      missCount: authorityPackage.missCount,
      totalPaperPenaltySeconds: authorityPackage.totalPaperPenaltySeconds,
      finalTimeSeconds: authorityPackage.finalTimeSeconds,
      finalTimeStatus: authorityPackage.finalTimeStatus,
      officialMatchTimeSeconds: gssfOfficialResult.officialMatchTimeSeconds,
      officialFinalScoreSeconds: gssfOfficialResult.officialFinalScoreSeconds,
      officialFinalScoreStatus: gssfOfficialResult.finalScoreStatus,
      manualTimeSource: gssfOfficialResult.manualTimeSource,
      authoritySource: "backend"
    },
    officialMatchTimeSeconds: gssfOfficialResult.officialMatchTimeSeconds,
    gssfOfficialMatchTimeSeconds: gssfOfficialResult.officialMatchTimeSeconds,
    totalPaperPenaltySeconds: gssfOfficialResult.totalPaperPenaltySeconds,
    officialFinalScoreSeconds: gssfOfficialResult.officialFinalScoreSeconds,
    officialFinalScoreStatus: gssfOfficialResult.finalScoreStatus,
    gssfManualTimeSource: gssfOfficialResult.manualTimeSource,
    gssfScoringSource: gssfOfficialResult.scoringSource,
    hits: currentImpactPoints.length,
    shotCount: currentImpactPoints.length,
    correctionStatus: "not-applicable",
    savedToSEC: true,
    targetDistance: targetDistanceValue(),
    targetDistanceValue: selectedDistanceValue,
    targetDistanceUnit: selectedDistanceUnit,
    targetDistanceLocked: true,
    distance: targetDistanceValue(),
    timestamp: savedTimestamp,
    savedAt: savedTimestamp
  } : isDotTortureTrainingPackage(authorityPackage) ? {
    backendAuthorityPackage: authorityPackage,
    ugeoAuthorityPackage: authorityPackage,
    trainingManualResult,
    score: authorityPackage.score || null,
    scoreValue: trainingManualResult ? trainingManualResult.score : null,
    shotData: {
      status: "training-manual",
      score: authorityPackage.score || null,
      scoreValue: trainingManualResult ? trainingManualResult.score : null,
      authoritySource: "backend",
      manualSource: "shooter-entry"
    },
    hits: 0,
    shotCount: 0,
    correctionStatus: "not-applicable",
    savedToSEC: true,
    targetDistance: targetDistanceValue(),
    targetDistanceValue: selectedDistanceValue,
    targetDistanceUnit: selectedDistanceUnit,
    targetDistanceLocked: true,
    distance: targetDistanceValue(),
    timestamp: savedTimestamp,
    savedAt: savedTimestamp
  } : {
    aimPoint: safePoint(currentAimPoint),
    confirmedAimPoint: authorityPackage.inputs && authorityPackage.inputs.confirmedAimPoint || safePoint(currentAimPoint),
    confirmedAimPointAuthority: authorityPackage.confirmedAimPointAuthority || null,
    impactPoints: currentImpactPoints.map(safePoint).filter(Boolean),
    backendAuthorityPackage: authorityPackage,
    ugeoAuthorityPackage: authorityPackage,
    score: authorityPackage.score || null,
    scoreValue: backendScoreValue(authorityPackage),
    poib: authorityPackage.poib || null,
    groupCenter: authorityPackage.groupCenter || null,
    clicks: authorityClicks,
    correctionData: {
      status: authorityPackage.status && authorityPackage.status.hasCorrection ? "backend-authority-calculated" : "not-calculated",
      clicks: authorityClicks,
      correction: authorityPackage.correction || null,
      moa: authorityPackage.moa || null,
      vectors: authorityPackage.vectors || null
    },
    shotData: {
      aimPoint: safePoint(currentAimPoint),
      confirmedAimPoint: authorityPackage.inputs && authorityPackage.inputs.confirmedAimPoint || safePoint(currentAimPoint),
      impactPoints: currentImpactPoints.map(safePoint).filter(Boolean),
      shotCount: currentImpactPoints.length,
      hits: currentImpactPoints.length,
      poib: authorityPackage.poib || null,
      groupCenter: authorityPackage.groupCenter || null,
      score: authorityPackage.score || null,
      scoreValue: backendScoreValue(authorityPackage),
      authoritySource: "backend"
    },
    hits: currentImpactPoints.length,
    shotCount: currentImpactPoints.length,
    correctionStatus: "backend-authority-calculated",
    savedToSEC: true,
    targetDistance: targetDistanceValue(),
    targetDistanceValue: selectedDistanceValue,
    targetDistanceUnit: selectedDistanceUnit,
    targetDistanceLocked: true,
    distance: targetDistanceValue(),
    timestamp: savedTimestamp,
    savedAt: savedTimestamp
  };
  savePatch.correctionContextSnapshot = correctionContextSnapshot(authorityPackage);
  savePatch.founderWorkspaceTestMode = FOUNDER_WORKSPACE_TEST_MODE;
  savePatch.savedIdentifier = session.savedIdentifier || `SEC-${session.sessionId}`;
  savePatch.savedRecordId = session.savedRecordId || session.sessionId;
  savePatch.authorityPackage = authorityPackage;
  if (isM4AuthoritySession()) {
    if (m4LivePhase === "confirmation") {
      const initialAuthority = m4InitialAuthorityPackage
        || session.m4AuthorityPackage
        || session.backendAuthorityPackage
        || session.authorityPackage;
      const initialImpacts = Array.isArray(session.impactPoints)
        ? session.impactPoints.map(safePoint).filter(Boolean)
        : [];
      savePatch.backendAuthorityPackage = initialAuthority;
      savePatch.ugeoAuthorityPackage = initialAuthority;
      savePatch.authorityPackage = initialAuthority;
      savePatch.m4AuthorityPackage = initialAuthority;
      savePatch.aimPoint = safePoint(session.aimPoint || currentAimPoint);
      savePatch.confirmedAimPoint = initialAuthority && initialAuthority.inputs && initialAuthority.inputs.confirmedAimPoint
        || safePoint(session.confirmedAimPoint || session.aimPoint || currentAimPoint);
      savePatch.confirmedAimPointAuthority = initialAuthority && initialAuthority.confirmedAimPointAuthority
        || session.confirmedAimPointAuthority
        || null;
      savePatch.impactPoints = initialImpacts;
      savePatch.shotData = session.shotData || {
        aimPoint: savePatch.aimPoint,
        impactPoints: initialImpacts,
        shotCount: initialImpacts.length,
        hits: initialImpacts.length,
        poib: initialAuthority && initialAuthority.poib || null,
        groupCenter: initialAuthority && initialAuthority.groupCenter || null,
        score: initialAuthority && initialAuthority.score || null,
        scoreValue: backendScoreValue(initialAuthority),
        authoritySource: "backend"
      };
      savePatch.score = session.score || initialAuthority && initialAuthority.score || null;
      savePatch.scoreValue = Number.isFinite(Number(session.scoreValue))
        ? Number(session.scoreValue)
        : backendScoreValue(initialAuthority);
      savePatch.poib = session.poib || initialAuthority && initialAuthority.poib || null;
      savePatch.groupCenter = session.groupCenter || initialAuthority && initialAuthority.groupCenter || null;
      savePatch.clicks = session.clicks || initialAuthority && initialAuthority.clicks || null;
      savePatch.correctionData = session.correctionData || {
        status: initialAuthority && initialAuthority.status && initialAuthority.status.hasCorrection
          ? "backend-authority-calculated"
          : "not-calculated",
        clicks: savePatch.clicks,
        correction: initialAuthority && initialAuthority.correction || null,
        moa: initialAuthority && initialAuthority.moa || null,
        vectors: initialAuthority && initialAuthority.vectors || null
      };
      savePatch.confirmationEvidenceImage = activeEvidence();
      savePatch.confirmationImpactPoints = currentImpactPoints.map(safePoint).filter(Boolean);
      savePatch.confirmationAuthorityPackage = authorityPackage;
      savePatch.confirmationStatus = authorityPackage.validation && authorityPackage.validation.confirmed
        ? "Confirmed"
        : "Correction Required";
      savePatch.confirmedAt = authorityPackage.validation && authorityPackage.validation.confirmed
        ? savedTimestamp
        : null;
      savePatch.savedToSEC = true;
      savePatch.workflowStage = "preservation";
      savePatch.preservationStatus = "saved";
    } else {
      savePatch.m4AuthorityPackage = authorityPackage;
      savePatch.savedToSEC = false;
      savePatch.workflowStage = "validation";
      savePatch.preservationStatus = "initial-authority-saved-confirmation-pending";
    }
  }
  if (SIMULATION_MODE) {
    const source = session.matrixSnapshot || matrix || {};
    savePatch.experienceMode = "simulation";
    savePatch.simulation = true;
    savePatch.simulationSessionId = SIMULATION_SESSION_ID;
    savePatch.matrixSnapshot = {
      target_profile_id: source.target_profile_id || source.targetProfileId || "",
      targetProfileId: source.targetProfileId || source.target_profile_id || "",
      targetId: source.targetId || source.target_profile_id || source.targetProfileId || "",
      targetName: source.targetName || "Simulation Target",
      targetFamily: source.targetFamily || "",
      mission_family: source.mission_family || source.missionFamily || source.missionFamilyId || "",
      missionFamily: source.missionFamily || source.mission_family || source.missionFamilyId || "",
      targetDistance: targetDistanceValue(),
      targetDistanceValue: selectedDistanceValue,
      targetDistanceUnit: selectedDistanceUnit,
      opticClickValue: source.opticClickValue || "",
      opticAdjustmentUnit: source.opticAdjustmentUnit || source.adjustmentUnit || ""
    };
  }
  try {
    saved = SCZN3M4.updateActiveSession(savePatch);
  } catch (error) {
    console.warn("Session preservation failed", error);
    saveButton.disabled = false;
    saveButton.textContent = "Save Session";
    setSaveSessionStatus("Save failed. Your marks remain on this screen; try again.", "error");
    return;
  }
  if (!saved || !saved.savedIdentifier || !saved.authorityPackage) {
    saveButton.disabled = false;
    saveButton.textContent = "Save Session";
    setSaveSessionStatus("Save failed. The complete session was not preserved.", "error");
    return;
  }
  if (saved && saved.targetEvidenceImage) {
    renderEvidencePreview(saved.targetEvidenceImage);
  }
  try {
    if (window.SCZN3Ops) window.SCZN3Ops.recordSessionSaved(saved, { hadSavedHistoryBefore });
  } catch (error) {}
  markWorkspaceProgressPreserved();
  session = saved;
  if (isM4AuthoritySession() && m4LivePhase === "initial") {
    m4InitialAuthorityPackage = authorityPackage;
    m4LivePhase = "confirmation";
    markWorkspaceProgressUnsaved();
    currentImpactPoints = [];
    holeEntrySettled = false;
    currentClicks = null;
    currentScore = null;
    backendAuthorityPackage = null;
    resultsShown = false;
    authorityStatusMessage = "";
    hideShooterTip();
    renderEvidencePreview(saved.targetEvidenceImage || activeEvidence());
    setMode("impact");
    renderMarkers();
    renderResults();
    renderMarkStatus();
    setSaveSessionStatus("");
    return;
  }
  renderMarkStatus();
  renderResults();
  saveButton.textContent = "Saved ✓";
  setSaveSessionStatus(`Saved as ${saved.savedIdentifier}. Opening Shooter Experience Card…`, "saved");
  if (saved) {
    window.setTimeout(() => {
      if (isM4AuthoritySession()) {
        window.location.href = "sec.html?v=stay-on-screen-002";
      } else {
        const recordQuery = new URLSearchParams();
        if (SIMULATION_MODE) recordQuery.set("simulation", "1");
        if (saved.sessionId) recordQuery.set("session", saved.sessionId);
        window.location.href = `records.html${recordQuery.toString() ? `?${recordQuery}` : ""}`;
      }
    }, 450);
  }
});

window.addEventListener("resize", () => {
  syncOverlayLayerToDisplayedImage();
  renderMarkers();
  placeCorrectionContextDrawer();
});

bindCorrectionContextDrawer();
if (TARGET_PROFILE_LAUNCH_ID) {
  resolveMissionFromTargetProfile();
} else {
  if (isM4AuthoritySession()) {
    const evidence = installM4CanonicalEvidence();
    if (evidence) renderEvidencePreview(evidence);
  }
  setMode(isGssfAuthoritySession() ? "impact" : (currentAimPoint ? "impact" : "aim"));
  renderSetupSummary();
  renderResults();
}
</script>
</body>
</html>
