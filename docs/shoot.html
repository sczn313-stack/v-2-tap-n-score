function gssfZoneTone(zone) {
  const normalized = String(zone || "").trim().toLowerCase().replace(/[\s_-]+/g, "");
  if (normalized === "downzero" || normalized === "0") return "down-zero";
  if (normalized === "plusone" || normalized === "+1" || normalized === "1") return "plus-one";
  if (normalized === "plusthree" || normalized === "+3" || normalized === "3") return "plus-three";
  if (normalized === "miss") return "miss";
  return "other";
}

function gssfZoneMarkerClass(zone) {
  return `gssf-zone-${gssfZoneTone(zone)}`;
}

function isGssfBucketLine(line) {
  const label = String(line || "").split(":")[0].trim().toLowerCase();
  return label === "down zero" || label === "+1" || label === "+3" || label === "miss";
}

function gssfContextResultLines(lines) {
  return Array.isArray(lines) ? lines.filter(line => !isGssfBucketLine(line)) : [];
}

function gssfShooterResultLines(lines) {
  return gssfContextResultLines(lines).filter(line => /^paper penalty:/i.test(String(line || "").trim()));
}

function gssfFormatSeconds(value) {
  return typeof value === "number" && Number.isFinite(value) ? `${value.toFixed(2)} sec` : "unavailable";
}

function gssfPaperPenaltySeconds(authorityPackage) {
  return isGssfAuthorityPackage(authorityPackage) ? authorityPackage.totalPaperPenaltySeconds : null;
}

function gssfTimerSelectorParts(value) {
  const numericValue = Number(value);
  const boundedTenths = Number.isFinite(numericValue)
    ? Math.min(599, Math.max(0, Math.round(numericValue * 10)))
    : 0;
  return {
    seconds: Math.floor(boundedTenths / 10),
    tenths: boundedTenths % 10
  };
}

function gssfTimerSelectorOptions(maximum, selectedValue) {
  return Array.from({ length: maximum + 1 }, (_, value) => (
    `<option value="${value}"${value === selectedValue ? " selected" : ""}>${value}</option>`
  )).join("");
}

function gssfTimerSelectorValue(seconds, tenths) {
  const safeSeconds = Math.min(59, Math.max(0, Number.parseInt(seconds, 10) || 0));
  const safeTenths = Math.min(9, Math.max(0, Number.parseInt(tenths, 10) || 0));
  return safeSeconds + (safeTenths / 10);
}

function gssfOfficialCompetitionResult(authorityPackage) {
  const hasAuthority = isGssfAuthorityPackage(authorityPackage);
  const officialMatchTimeSeconds = hasAuthority
    && typeof authorityPackage?.rawTimeSeconds === "number"
    && Number.isFinite(authorityPackage.rawTimeSeconds)
    && authorityPackage.rawTimeSeconds >= 0
    ? authorityPackage.rawTimeSeconds
    : null;
  const totalPaperPenaltySeconds = gssfPaperPenaltySeconds(authorityPackage);
  const officialFinalScoreSeconds = hasAuthority
    && authorityPackage?.finalTimeStatus === "calculated"
    && typeof authorityPackage.finalTimeSeconds === "number"
    && Number.isFinite(authorityPackage.finalTimeSeconds)
    && authorityPackage.finalTimeSeconds >= 0
    ? authorityPackage.finalTimeSeconds
    : null;
  return {
    officialMatchTimeSeconds,
    totalPaperPenaltySeconds,
    officialFinalScoreSeconds,
    finalScoreStatus: totalPaperPenaltySeconds === null
      ? "authority_unavailable"
      : (officialFinalScoreSeconds === null ? "unavailable_without_official_time" : "calculated"),
    manualTimeSource: "shooter-entered-official-timer",
    scoringSource: "backend-penalty-plus-manual-time"
  };
}

function gssfTimerTimeReadyForSave(authorityPackage = backendAuthorityPackage) {
  const result = gssfOfficialCompetitionResult(authorityPackage);
  return result.officialMatchTimeSeconds !== null
    && result.finalScoreStatus === "calculated";
}

function gssfOfficialFinalScoreHtml(authorityPackage) {
  const result = gssfOfficialCompetitionResult(authorityPackage);
  const hasTimerTime = result.officialMatchTimeSeconds !== null;
  const finalText = result.finalScoreStatus === "authority_unavailable"
    ? "Score not available"
    : (result.officialFinalScoreSeconds === null
      ? gssfFormatSeconds(result.totalPaperPenaltySeconds)
      : gssfFormatSeconds(result.officialFinalScoreSeconds));
  const inputValue = result.officialMatchTimeSeconds === null ? "" : Number(result.officialMatchTimeSeconds).toFixed(2);
  const selectorParts = gssfTimerSelectorParts(result.officialMatchTimeSeconds);
  const selectorTimeText = `${gssfTimerSelectorValue(selectorParts.seconds, selectorParts.tenths).toFixed(2)} sec`;
  const officialTimeText = hasTimerTime ? gssfFormatSeconds(result.officialMatchTimeSeconds) : "Not entered";
  const paperPenaltyText = result.totalPaperPenaltySeconds === null
    ? "Not available"
    : `+${gssfFormatSeconds(result.totalPaperPenaltySeconds)}`;
  return `
    <section class="gssf-final-score-panel" aria-label="Competition paper target result">
      <span id="gssfOfficialResultLabel">${hasTimerTime ? "Final Time" : "Paper Penalty"}</span>
      <strong id="gssfOfficialFinalScore">${escapeHtml(finalText)}</strong>
      <p id="gssfOfficialResultStatus"${hasTimerTime ? " hidden" : ""}>Timer time required for Final Time</p>
      <div class="gssf-final-score-breakdown" aria-label="Score breakdown">
        <div>
          <span>Timer Time</span>
          <strong id="gssfOfficialTimeDisplay">${escapeHtml(officialTimeText)}</strong>
        </div>
        <div>
          <span>Paper Penalty</span>
          <strong>${escapeHtml(paperPenaltyText)}</strong>
        </div>
      </div>
      <small>Timer time + paper penalty = Final Time</small>
    </section>
    <label class="gssf-official-time-entry" for="gssfOfficialMatchTime">
      <span>Timer Time</span>
      <input id="gssfOfficialMatchTime" type="number" inputmode="decimal" min="0" step="0.01" placeholder="42.31" value="${escapeHtml(inputValue)}" />
      <small>Enter the official timer value from the range.</small>
      <em id="gssfOfficialTimeSource">Entered manually</em>
    </label>
    <section class="gssf-mobile-time-selector" aria-label="Timer Time selector">
      <strong id="gssfMobileTimerTimeDisplay">Timer Time: ${escapeHtml(selectorTimeText)}</strong>
      <div class="gssf-mobile-time-dials">
        <label>
          <span>Seconds</span>
          <select id="gssfTimerSeconds" aria-label="Timer seconds">
            ${gssfTimerSelectorOptions(59, selectorParts.seconds)}
          </select>
        </label>
        <label>
          <span>Tenths</span>
          <select id="gssfTimerTenths" aria-label="Timer tenths">
            ${gssfTimerSelectorOptions(9, selectorParts.tenths)}
          </select>
        </label>
      </div>
    </section>
  `;
}

function updateGssfOfficialFinalScoreDisplay(authorityPackage) {
  const finalScore = document.getElementById("gssfOfficialFinalScore");
  const officialTimeDisplay = document.getElementById("gssfOfficialTimeDisplay");
  const resultLabel = document.getElementById("gssfOfficialResultLabel");
  const resultStatus = document.getElementById("gssfOfficialResultStatus");
  if (!finalScore) return;
  const result = gssfOfficialCompetitionResult(authorityPackage);
  const hasTimerTime = result.officialMatchTimeSeconds !== null;
  finalScore.textContent = result.finalScoreStatus === "authority_unavailable"
    ? "Score not available"
    : (result.officialFinalScoreSeconds === null
      ? gssfFormatSeconds(result.totalPaperPenaltySeconds)
      : gssfFormatSeconds(result.officialFinalScoreSeconds));
  if (resultLabel) resultLabel.textContent = hasTimerTime ? "Final Time" : "Paper Penalty";
  if (resultStatus) resultStatus.hidden = hasTimerTime;
  if (officialTimeDisplay) {
    officialTimeDisplay.textContent = hasTimerTime
      ? gssfFormatSeconds(result.officialMatchTimeSeconds)
      : "Not entered";
  }
}

function bindGssfOfficialTimeInput(authorityPackage) {
  const input = document.getElementById("gssfOfficialMatchTime");
  const secondsDial = document.getElementById("gssfTimerSeconds");
  const tenthsDial = document.getElementById("gssfTimerTenths");
  const mobileDisplay = document.getElementById("gssfMobileTimerTimeDisplay");

  function submitTimerValue(value) {
    markWorkspaceProgressUnsaved();
    gssfOfficialMatchTimeSeconds = Number.isFinite(value) && value >= 0 ? value : null;
    if (mobileDisplay && gssfOfficialMatchTimeSeconds !== null) {
      mobileDisplay.textContent = `Timer Time: ${gssfOfficialMatchTimeSeconds.toFixed(2)} sec`;
    }
    const officialTimeDisplay = document.getElementById("gssfOfficialTimeDisplay");
    if (officialTimeDisplay && gssfOfficialMatchTimeSeconds !== null) {
      officialTimeDisplay.textContent = gssfFormatSeconds(gssfOfficialMatchTimeSeconds);
    }
    const requestToken = ++gssfTimerAuthorityRequestToken;
    window.clearTimeout(gssfTimerAuthorityRequestHandle);
    gssfTimerAuthorityRequestHandle = window.setTimeout(async () => {
      try {
        const verifiedPackage = await requestBackendAuthority();
        if (requestToken !== gssfTimerAuthorityRequestToken) return;
        applyBackendAuthorityPackage(verifiedPackage);
        renderMarkers();
        renderResults();
        renderMarkStatus();
      } catch (error) {
        if (requestToken !== gssfTimerAuthorityRequestToken) return;
        console.warn("Timer authority request failed", error);
        authorityStatusMessage = "Final Time unavailable: timer time could not be verified by scoring authority.";
        renderResults();
      }
    }, 250);
  }

  if (input && !input.dataset.gssfOfficialTimeBound) {
    input.dataset.gssfOfficialTimeBound = "true";
    input.addEventListener("input", () => {
      const rawValue = String(input.value || "").trim();
      const value = Number(rawValue);
      submitTimerValue(rawValue !== "" && Number.isFinite(value) && value >= 0 ? value : null);
    });
  }

  if (secondsDial && tenthsDial && !secondsDial.dataset.gssfOfficialTimeBound) {
    secondsDial.dataset.gssfOfficialTimeBound = "true";
    tenthsDial.dataset.gssfOfficialTimeBound = "true";
    const handleDialChange = () => {
      const value = gssfTimerSelectorValue(secondsDial.value, tenthsDial.value);
      if (input) input.value = value.toFixed(2);
      submitTimerValue(value);
    };
    secondsDial.addEventListener("change", handleDialChange);
    tenthsDial.addEventListener("change", handleDialChange);
  }
}

function gssfBucketDefinitions() {
  return [
    { id: "down-zero", zone: "downZero", label: "Down Zero" },
    { id: "plus-one", zone: "plusOne", label: "+1" },
    { id: "plus-three", zone: "plusThree", label: "+3" },
    { id: "miss", zone: "miss", label: "Miss / Other" }
  ];
}

function gssfAuthoritativeBreakdown(authorityPackage) {
  if (!isGssfAuthorityPackage(authorityPackage)) return [];
  const breakdownByZone = new Map(authorityPackage.scoringBreakdown.map(bucket => [bucket.zone, bucket]));
  return gssfBucketDefinitions().map(bucket => ({ ...bucket, source: breakdownByZone.get(bucket.zone) }));
}

function gssfBucketSummaryHtml(authorityPackage) {
  const buckets = gssfAuthoritativeBreakdown(authorityPackage);
  if (!buckets.length) return "";
  const cards = buckets.map(bucket => {
    const count = Number(bucket.source.count);
    const multiplier = Number(bucket.source.penaltySecondsPerHit);
    const subtotal = Number(bucket.source.subtotalPenaltySeconds);
    const shotIds = bucket.source.shotIds.map(String);
    return `
      <div class="gssf-bucket-card gssf-zone-card-${bucket.id}">
        <strong><i class="gssf-zone-dot gssf-zone-${bucket.id}"></i>${escapeHtml(bucket.label)}</strong>
        <em>${escapeHtml(`${count} × ${multiplier}`)}</em>
        <b>${escapeHtml(`= ${subtotal} sec`)}</b>
        <span>Hits: ${escapeHtml(count)}</span>
        <small>Shots: <i class="gssf-shot-id-list">${escapeHtml(shotIds.length ? shotIds.join(", ") : "None")}</i></small>
      </div>
    `;
  }).join("");
  return `<div class="gssf-bucket-grid" aria-label="Competition paper target scoring buckets">${cards}</div>`;
}

function gssfShooterModeHtml(authorityPackage, lines) {
  return `
    ${gssfOfficialFinalScoreHtml(authorityPackage)}
    ${gssfBucketSummaryHtml(authorityPackage)}
  `;
}

function vectorHtmlFromBackend(vector) {
  if (!vector || !vector.start || !vector.end) return "";
  const start = safePoint(vector.start);
  const end = safePoint(vector.end);
  if (!start || !end) return "";
  return `<svg class="target-correction-vector" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <defs>
      <marker id="targetCorrectionArrowhead" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,4 L0,8 Z"></path>
      </marker>
    </defs>
    <line x1="${start.xPercent}" y1="${start.yPercent}" x2="${end.xPercent}" y2="${end.yPercent}" marker-end="url(#targetCorrectionArrowhead)"></line>
  </svg>`;
}

function renderPendingInputMarkers() {
  const parts = [];
  currentImpactPoints.map(safePoint).filter(Boolean).forEach((point, index) => {
    parts.push(markerPointHtml("target-marker impact-marker precision-tap-marker", point, "", `data-shot-index="${index + 1}" aria-label="Shot ${index + 1}"`));
  });
  if (currentAimPoint && !(isZeroingAuthoritySession() && zeroingLivePhase === "confirmation")) {
    parts.push(markerPointHtml("target-marker aim-marker precision-tap-aim-marker", currentAimPoint, "", 'aria-label="Intended aim point"'));
  }
  return parts.join("");
}

function backendPoibDisplayCoordinate(authorityPackage) {
  if (!authorityPackage) return null;
  const render = authorityPackage.renderCoordinates || {};
  const backendPoib = safePoint(render.poib || authorityPackage.poib || authorityPackage.groupCenter);
  if (backendPoib) return backendPoib;
  if (typeof console !== "undefined" && !backendPoibDisplayCoordinate.hasWarned) {
    console.warn("POIB unavailable from backend authority.");
    backendPoibDisplayCoordinate.hasWarned = true;
  }
  return null;
}

function backendRenderedHitCoordinates(authorityPackage) {
  return backendRenderedHitEntries(authorityPackage).map(safePoint).filter(Boolean);
}

function governedCorrectionVector(authorityPackage) {
  if (!authorityPackage) return null;
  const render = authorityPackage.renderCoordinates || {};
  const poib = backendPoibDisplayCoordinate(authorityPackage);
  const aim = safePoint(render.aim);
  if (!poib || !aim) return null;
  return { start: poib, end: aim, intent: "POIB_TO_AIM" };
}

function renderBackendAuthorityMarkers(authorityPackage) {
  const render = authorityPackage && authorityPackage.renderCoordinates ? authorityPackage.renderCoordinates : {};
  const parts = [];
  const classifications = backendHitClassifications(authorityPackage);
  const confirmationEvidenceOnly = isZeroingAuthoritySession() && zeroingLivePhase === "confirmation";
  if (!confirmationEvidenceOnly) parts.push(vectorHtmlFromBackend(governedCorrectionVector(authorityPackage)));
  backendRenderedHitCoordinates(authorityPackage).forEach((point, index) => {
    const hit = classifications[index] || {};
    const shotNumber = backendShotIdForHit(authorityPackage, hit, index);
    const zone = escapeHtml(hit.zone || "");
    const zoneClass = isGssfAuthorityPackage(authorityPackage) ? ` ${gssfZoneMarkerClass(hit.zone)}` : "";
    const label = shotNumber === null ? String(index + 1) : String(shotNumber);
    parts.push(markerPointHtml(`target-marker impact-marker${zoneClass}`, point, label, `data-shot-index="${escapeHtml(label)}" data-backend-zone="${zone}"`));
  });
  if (render.aim && !isM4AuthoritySession()) {
    parts.push(markerPointHtml("target-marker aim-marker precision-tap-aim-marker", render.aim, "", 'aria-label="Confirmed aim point"'));
  }
  if (render.bull && !isM4AuthoritySession()) {
    parts.push(markerPointHtml("target-marker bull-marker", render.bull, "", 'aria-label="Registered bull"'));
  }
  const poib = backendPoibDisplayCoordinate(authorityPackage);
  if (poib && !confirmationEvidenceOnly) {
    parts.push(markerPointHtml("target-marker poib-auto-marker", poib, "POIB", 'aria-label="Point of impact balance"'));
  }
  return parts.join("");
}

function renderMarkers() {
  const layer = document.getElementById("markerLayer");
  if (!layer) return;
  syncOverlayLayerToDisplayedImage();
  if (isDotTortureAuthoritySession()) {
    layer.innerHTML = "";
    renderResults();
    return;
  }
  const correction = currentVisualCorrection();
  const authorityPackage = resultsShown ? backendAuthorityPackage : null;
  layer.innerHTML = (authorityPackage ? renderBackendAuthorityMarkers(authorityPackage) : renderPendingInputMarkers()) + renderCorrectionOverlay(correction);
  syncArrowLayerToMarkerLayer();
  auditBackendMarkerAlignment(authorityPackage);
  renderResults();
}

function auditBackendMarkerAlignment(authorityPackage) {
  if (!authorityPackage || !authorityPackage.renderCoordinates || typeof console === "undefined") return;
  requestAnimationFrame(() => {
    const layer = document.getElementById("markerLayer");
    if (!layer) return;
    const layerRect = layer.getBoundingClientRect();
    const backendHits = backendRenderedHitCoordinates(authorityPackage);
    if (!backendHits.length) return;
    const markers = Array.from(layer.querySelectorAll(".impact-marker"));
    const mismatches = backendHits
      .map((point, index) => {
        const marker = markers[index];
        if (!marker) return { shot: index + 1, reason: "missing rendered marker", point };
        const rendered = renderedPercentFromRect(marker.getBoundingClientRect(), layerRect);
        if (!rendered) return { shot: index + 1, reason: "unreadable marker", point };
        const xDelta = Number((rendered.xPercent - point.xPercent).toFixed(2));
        const yDelta = Number((rendered.yPercent - point.yPercent).toFixed(2));
        return Math.abs(xDelta) > 0.25 || Math.abs(yDelta) > 0.25
          ? { shot: index + 1, expected: point, rendered, xDelta, yDelta }
          : null;
      })
      .filter(Boolean);
    if (mismatches.length) {
      console.warn("Backend hit marker display does not match backend render coordinates.", mismatches);
    }
    const aimMarker = layer.querySelector(".aim-marker");
    const arrowLine = layer.querySelector(".target-correction-vector line");
    const authoritativeAim = safePoint(authorityPackage.renderCoordinates.aim);
    const authoritativeVectorEnd = safePoint(authorityPackage.renderCoordinates.vector && authorityPackage.renderCoordinates.vector.end);
    const renderedAim = aimMarker ? renderedPercentFromRect(aimMarker.getBoundingClientRect(), layerRect) : null;
    const arrowEnd = arrowLine ? {
      xPercent: Number(arrowLine.getAttribute("x2")),
      yPercent: Number(arrowLine.getAttribute("y2"))
    } : null;
    const exceedsTolerance = (first, second) => !first || !second
      || Math.abs(Number(first.xPercent) - Number(second.xPercent)) > 0.25
      || Math.abs(Number(first.yPercent) - Number(second.yPercent)) > 0.25;
    if (
      exceedsTolerance(authoritativeVectorEnd, authoritativeAim)
      || exceedsTolerance(arrowEnd, authoritativeAim)
      || (!isM4AuthoritySession() && exceedsTolerance(renderedAim, authoritativeAim))
    ) {
      console.warn("Confirmed Aim Point authority does not match the rendered vector endpoint.", {
        authoritativeAim,
        authoritativeVectorEnd,
        arrowEnd,
        renderedAim
      });
    }
  });
}

function compactClick(value, axis) {
  if (!value) return "Not calculated";
  const label = typeof value === "object" && value.label ? value.label : String(value);
  const amount = typeof value === "object" && Number.isFinite(Number(value.clicks))
    ? String(Math.abs(Number(value.clicks)))
    : (label.match(/\d+/)?.[0] || "0");
  const upper = typeof value === "object" && value.direction
    ? String(value.direction).toUpperCase()
    : label.toUpperCase();
  if (axis === "elevation") {
    if (upper.includes("UP")) return `${amount} Clicks ↑`;
    if (upper.includes("DOWN")) return `${amount} Clicks ↓`;
  }
  if (axis === "windage") {
    if (upper.includes("RIGHT")) return `${amount} Clicks →`;
    if (upper.includes("LEFT")) return `${amount} Clicks ←`;
  }
  return `${amount} Clicks`;
}

function scoreClass(score) {
  if (!Number.isFinite(score)) return "score-pending";
  if (score >= 90) return "score-green";
  if (score >= 80) return "score-yellow";
  if (score >= 70) return "score-orange";
  return "score-red";
}

function renderDotTortureTrainingResults(authorityPackage) {
  const grid = document.getElementById("resultsGrid");
  if (grid && !document.getElementById("dotTortureTrainingResult")) {
    grid.innerHTML = dotTortureTrainingHtml(authorityPackage);
  }
  const stages = Array.isArray(authorityPackage.stages) ? authorityPackage.stages : [];
  const hasBackendTrainingPackage = isDotTortureTrainingPackage(authorityPackage) && authorityPackage.ok === true;
  const maxIndex = Math.max(stages.length - 1, 0);
  trainingStageIndex = Math.min(Math.max(trainingStageIndex, 0), maxIndex);
  const counter = document.getElementById("trainingStageCounter");
  const guidance = document.getElementById("trainingCurrentGuidance");
  const stageLabel = document.getElementById("trainingStageLabel");
  const stageTitle = document.getElementById("trainingStageTitle");
  const stageRounds = document.getElementById("trainingStageRounds");
  const beginButton = document.getElementById("trainingBeginStage");
  const previousButton = document.getElementById("trainingPreviousStage");
  const nextButton = document.getElementById("trainingNextStage");
  const finishButton = document.getElementById("trainingFinishDrill");
  const status = document.getElementById("trainingDrillStatus");
  const secPreview = document.getElementById("trainingSecPreview");
  const savedStatus = document.getElementById("trainingSecSavedStatus");
  const manualFields = ["trainingManualScore", "trainingManualMisses", "trainingManualTime", "trainingManualNotes"]
    .map(id => document.getElementById(id))
    .filter(Boolean)
    .concat(Array.from(document.querySelectorAll(".training-stage-score-input")));
  if (counter) counter.textContent = `Stage ${trainingStageIndex + 1} of ${Math.max(stages.length, 1)}`;
  if (stageLabel) stageLabel.textContent = trainingStageLabel(authorityPackage, trainingStageIndex);
  if (stageTitle) stageTitle.textContent = `Stage ${trainingStageIndex + 1}`;
  if (stageRounds) stageRounds.textContent = String((stages[trainingStageIndex] && stages[trainingStageIndex].rounds) || "--");
  if (guidance) guidance.innerHTML = hasBackendTrainingPackage
    ? conciseTrainingInstruction(authorityPackage, trainingStageIndex)
    : "Stage guidance is loading.";
  if (beginButton) {
    beginButton.disabled = !hasBackendTrainingPackage || trainingDrillFinished;
    beginButton.textContent = trainingStageIndex >= maxIndex ? "Finish Drill" : (trainingStageIndex === 0 ? "Begin Stage" : "Next Stage");
    beginButton.onclick = () => {
      if (!hasBackendTrainingPackage || trainingDrillFinished) return;
      markWorkspaceProgressUnsaved();
      if (trainingStageIndex < maxIndex) {
        trainingStageIndex += 1;
        renderDotTortureTrainingResults(authorityPackage);
      } else {
        trainingDrillFinished = true;
        renderDotTortureTrainingResults(authorityPackage);
        renderMarkStatus();
      }
    };
  }
  if (previousButton) {
    previousButton.disabled = !hasBackendTrainingPackage || trainingDrillFinished || trainingStageIndex <= 0;
    previousButton.onclick = () => {
      if (trainingStageIndex > 0) {
        markWorkspaceProgressUnsaved();
        trainingStageIndex -= 1;
        renderDotTortureTrainingResults(authorityPackage);
      }
    };
  }
  if (nextButton) {
    nextButton.disabled = !hasBackendTrainingPackage || trainingDrillFinished || trainingStageIndex >= maxIndex;
    nextButton.classList.toggle("secondary", !hasBackendTrainingPackage || trainingDrillFinished || trainingStageIndex >= maxIndex);
    nextButton.onclick = () => {
      if (trainingStageIndex < maxIndex) {
        markWorkspaceProgressUnsaved();
        trainingStageIndex += 1;
        renderDotTortureTrainingResults(authorityPackage);
      }
    };
  }
  if (finishButton) {
    const finishIsPrimary = hasBackendTrainingPackage && !trainingDrillFinished && trainingStageIndex >= maxIndex;
    finishButton.disabled = !hasBackendTrainingPackage;
    finishButton.textContent = trainingDrillFinished ? "Drill Complete" : "Finish Drill";
    finishButton.classList.toggle("secondary", !finishIsPrimary);
    finishButton.onclick = () => {
      markWorkspaceProgressUnsaved();
      trainingDrillFinished = true;
      renderDotTortureTrainingResults(authorityPackage);
      renderMarkStatus();
    };
  }
  if (status) {
    status.textContent = !hasBackendTrainingPackage
      ? "Stage guidance required."
      : (trainingDrillFinished ? "Results ready. Save when ready." : "");
  }
  if (secPreview) secPreview.classList.toggle("is-hidden", !trainingDrillFinished);
  if (savedStatus) savedStatus.textContent = sessionSaved ? "saved" : "pending";
  manualFields.forEach(field => {
    if (!field.dataset.trainingManualBound) {
      field.addEventListener("input", () => {
        markWorkspaceProgressUnsaved();
        updateTrainingManualPreview();
      });
      field.dataset.trainingManualBound = "true";
    }
  });
  updateTrainingManualPreview();
  const message = document.getElementById("authorityStatusMessage");
  if (message) {
    message.innerHTML = authorityStatusMessage
      ? `<strong>${authorityStatusMessage}</strong>`
      : "";
    message.classList.toggle("is-hidden", !authorityStatusMessage);
  }
}

function renderResults() {
  if (isMissionResolving() || isMissionResolutionUnavailable()) {
    renderMissionResolutionState();
    return;
  }
  syncAuthorityDerivedState();
  const impacts = currentImpactPoints;
  const numericScore = currentScore === null ? NaN : Number(currentScore);
  document.body.dataset.authorityStatus = authorityStatusMessage ? "true" : "false";
  if (isDotTortureAuthoritySession() || isDotTortureTrainingPackage(backendAuthorityPackage)) {
    renderDotTortureTrainingResults(dotTortureWorkspacePackage());
    return;
  }
  if (isGssfAuthoritySession() && !isGssfAuthorityPackage(backendAuthorityPackage)) {
    const grid = document.getElementById("resultsGrid");
    if (grid) grid.innerHTML = targetIntelStackHtml();
    bindAuthorityRecoveryAction();
    return;
  }
  if (isGssfAuthorityPackage(backendAuthorityPackage)) {
    let resultBlock = document.getElementById("gssfAuthorityResult");
    if (!resultBlock) {
      const grid = document.getElementById("resultsGrid");
      if (grid) grid.innerHTML = targetIntelStackHtml();
      resultBlock = document.getElementById("gssfAuthorityResult");
    }
    const lines = backendAuthorityPackage.display && Array.isArray(backendAuthorityPackage.display.resultLines)
      ? backendAuthorityPackage.display.resultLines
      : [];
    if (resultBlock) {
      resultBlock.innerHTML = gssfShooterModeHtml(backendAuthorityPackage, lines);
      bindGssfOfficialTimeInput(backendAuthorityPackage);
    }
    const message = document.getElementById("authorityStatusMessage");
    if (message) {
      message.innerHTML = authorityStatusMessage
        ? `<strong>${authorityStatusMessage}</strong>`
        : "";
      message.classList.toggle("is-hidden", !authorityStatusMessage);
    }
    return;
  }
  if (authorityStatusMessage && !resultsShown) {
    const grid = document.getElementById("resultsGrid");
    if (grid) grid.innerHTML = authorityRecoveryHtml(authorityStatusMessage);
    bindAuthorityRecoveryAction();
    return;
  }
  let scoreCell = document.getElementById("scoreCell");
  if (!scoreCell && resultsShown) {
    const grid = document.getElementById("resultsGrid");
    if (grid) grid.innerHTML = targetIntelStackHtml();
    bindDistanceControl();
    scoreCell = document.getElementById("scoreCell");
  }
  if (!scoreCell) {
    const grid = document.getElementById("resultsGrid");
    if (grid && authorityStatusMessage) grid.innerHTML = authorityRecoveryHtml(authorityStatusMessage);
    bindAuthorityRecoveryAction();
    return;
  }
  scoreCell.className = `target-intel-score ${scoreClass(numericScore)}`;
  document.getElementById("scoreValue").textContent = Number.isFinite(numericScore) ? String(numericScore) : "--";
  const groupValue = document.getElementById("groupValue");
  if (groupValue) {
    const group = backendAuthorityPackage && backendAuthorityPackage.group;
    groupValue.textContent = group && group.status === "calculated" && group.display ? String(group.display) : "--";
  }
  const hitsParts = [SIMULATION_MODE
    ? `Shot group: ${impacts.length} ${impacts.length === 1 ? "impact" : "impacts"}`
    : `${impacts.length} Hits`];
  if (SIMULATION_MODE && backendPoibDisplayCoordinate(backendAuthorityPackage)) {
    hitsParts.push("Center of group highlighted");
  }
  document.getElementById("hitsValue").textContent = hitsParts.join(" • ");
  const message = document.getElementById("authorityStatusMessage");
  if (message) {
    message.innerHTML = authorityStatusMessage
      ? `<strong>${authorityStatusMessage}</strong>`
      : "";
    message.classList.toggle("is-hidden", !authorityStatusMessage);
  }
}

function shooterTipFromResults() {
  if (!currentImpactPoints.length) return "Record confirmed impacts before saving.";
  if (!currentClicks) return "The group is measured, but click instructions are unavailable for this sight setup.";
  if (currentImpactPoints.length < 3) return "Add more confirmed impacts for a stronger read.";
  const windage = Number(currentClicks.windageClicks || 0);
  const elevation = Number(currentClicks.elevationClicks || 0);
  const windageDirection = String(currentClicks.windageDirection || "CENTER").toLowerCase();
  const elevationDirection = String(currentClicks.elevationDirection || "CENTER").toLowerCase();
  if (windage === 0 && elevation === 0) return "Group is centered; confirm with another string.";
  if (elevation > windage) return "Apply elevation " + elevationDirection + ", then confirm.";
  if (windage > elevation) return "Apply windage " + windageDirection + ", then confirm.";
  return "Apply both corrections, then confirm.";
}

function cancelHoleEntryReadiness() {
  if (holeEntryIdleHandle !== null) {
    window.clearTimeout(holeEntryIdleHandle);
    holeEntryIdleHandle = null;
  }
}

function scheduleHoleEntryReadiness() {
  cancelHoleEntryReadiness();
  holeEntrySettled = false;
  if (!currentImpactPoints.length || resultsShown) return;
  holeEntryIdleHandle = window.setTimeout(() => {
    holeEntryIdleHandle = null;
    if (!resultsShown && currentImpactPoints.length) {
      holeEntrySettled = true;
      correctionContextReviewDismissed = false;
      renderMarkStatus();
    }
  }, HOLE_ENTRY_IDLE_MS);
}

function resultsOfferReady() {
  return !isMfamZeroingAuthoritySession() || holeEntrySettled;
}

function awaitingNextConfirmationGroup() {
  return !!(
    isMfamZeroingAuthoritySession()
    && zeroingLivePhase === "confirmation"
    && resultsShown
    && backendAuthorityPackage
    && backendAuthorityPackage.validation
    && backendAuthorityPackage.validation.status === "calculated"
    && !backendAuthorityPackage.validation.confirmed
    && !correctionContextPending
    && correctionContextIsConfirmed(backendAuthorityPackage)
  );
}

function rangeWorkflowState(canMark) {
  if (simulationLimitReached()) return "simulation-complete";
  if (!canMark) return "choose-target";
  if (isDotTortureAuthoritySession()) {
    if (!resultsShown) return "show-results";
    if (!trainingDrillFinished) return "training-drill";
    if (!sessionSaved) return "save-session";
    return "view-sec";
  }
  if (isGssfAuthoritySession()) {
    if (!currentImpactPoints.length) return "tap-holes";
    if (!resultsShown) return "show-results";
    if (!gssfTimerTimeReadyForSave()) return "enter-timer-time";
    if (!sessionSaved) return "save-session";
    return "view-sec";
  }
  if (!currentAimPoint) return "tap-aim";
  if (!currentImpactPoints.length) return "tap-holes";
  if (founderContextAtResultsGate()) return "review-context";
  if (!resultsShown) return resultsOfferReady() ? "show-results" : "tap-holes";
  if (correctionContextPending) return "confirm-context";
  if (awaitingNextConfirmationGroup()) return "await-next-group";
  if (
    isMfamZeroingAuthoritySession()
    && zeroingLivePhase === "confirmation"
    && backendAuthorityPackage
    && backendAuthorityPackage.validation
    && !backendAuthorityPackage.validation.confirmed
  ) return "continue-confirmation";
  if (!sessionSaved) return "save-session";
  return "view-sec";
}

function precisionTapControlState(rangeState, hasEvidence) {
  if (!hasEvidence || rangeState === "choose-target") return "photo_entry";
  if (rangeState === "tap-aim") return "aim_entry";
  if (rangeState === "tap-holes" || rangeState === "training-drill") {
    return isZeroingAuthoritySession() && zeroingLivePhase === "confirmation"
      ? "confirmation_entry"
      : "shot_entry";
  }
  if (rangeState === "show-results" || rangeState === "review-context" || rangeState === "confirm-context") {
    return "result";
  }
  if (rangeState === "await-next-group" || rangeState === "continue-confirmation") return "confirmation_entry";
  if (rangeState === "save-session") {
    return isZeroingAuthoritySession() && zeroingLivePhase !== "confirmation"
      ? "confirmation_entry"
      : "save";
  }
  if (rangeState === "view-sec") return "save";
  return rangeState;
}

function renderPrecisionTapControls(controlState, rangeState) {
  const visible = new Set();
  const picker = document.getElementById("precisionTapPhotoPicker");
  const pickerOpen = picker && !picker.hidden;
  if (controlState === "photo_entry") {
    visible.add(pickerOpen ? "precisionTapPhotoPicker" : "chooseTargetButton");
  } else if (controlState === "aim_entry") {
    visible.add("setAimMode");
  } else if (controlState === "shot_entry") {
    visible.add("targetHitCounter");
    visible.add("addImpactMode");
    if (currentImpactPoints.length) {
      visible.add("undoImpact");
      visible.add("clearMarks");
    }
  } else if (controlState === "result") {
    visible.add("targetHitCounter");
    visible.add("showResults");
    visible.add("undoImpact");
    if (currentImpactPoints.length) visible.add("clearMarks");
  } else if (controlState === "confirmation_entry") {
    if (rangeState === "tap-holes") {
      visible.add("targetHitCounter");
      visible.add("addImpactMode");
      if (currentImpactPoints.length) {
        visible.add("undoImpact");
        visible.add("clearMarks");
      }
    } else {
      visible.add("saveMarks");
    }
  } else if (controlState === "save") {
    visible.add("saveMarks");
  }
  [
    "targetHitCounter",
    "chooseTargetButton",
    "precisionTapPhotoPicker",
    "setAimMode",
    "addImpactMode",
    "showResults",
    "undoImpact",
    "clearMarks",
    "saveMarks"
  ].forEach(id => {
    const control = document.getElementById(id);
    if (!control) return;
    const isVisible = visible.has(id);
    control.hidden = !isVisible;
    if (isVisible) control.style.removeProperty("display");
    else control.style.setProperty("display", "none", "important");
  });
}

function renderMarkStatus() {
  renderTargetHeaderIdentity();
  if (isMissionResolving() || isMissionResolutionUnavailable()) {
    renderMissionWorkspaceChrome();
    setMissionResolutionChrome();
    ["chooseTargetButton", "setAimMode", "addImpactMode", "showResults", "undoImpact", "clearMarks", "saveMarks"].forEach(id => {
      const control = document.getElementById(id);
      if (control) {
        control.disabled = true;
        control.classList.remove("next-step");
      }
    });
    document.body.dataset.rangeState = isMissionResolving() ? "mission-resolving" : "mission-unavailable";
    document.body.dataset.hasEvidence = "false";
    document.body.dataset.hasResults = "false";
    document.body.dataset.targetMission = "resolving";
    return;
  }
  setMissionResolutionChrome();
  if (simulationLimitReached()) {
    renderMissionWorkspaceChrome();
    ["setAimMode", "addImpactMode", "showResults", "undoImpact", "clearMarks", "saveMarks"].forEach(id => {
      const control = document.getElementById(id);
      if (control) {
        control.disabled = true;
        control.classList.remove("next-step");
      }
    });
    const chooseTarget = document.getElementById("chooseTargetButton");
    if (chooseTarget) {
      chooseTarget.classList.remove("next-step");
      chooseTarget.setAttribute("aria-disabled", "true");
    }
    document.body.dataset.rangeState = "simulation-complete";
    document.body.dataset.hasEvidence = hasMarkableEvidence() ? "true" : "false";
    document.body.dataset.hasResults = resultsShown ? "true" : "false";
    return;
  }
  const isGssf = isGssfAuthoritySession();
  const isTraining = isDotTortureAuthoritySession();
  const hasEvidence = hasMarkableEvidence();
  const canProceed = hasEvidence || isTraining;
  const gssfTimerTimePending = isGssf && resultsShown && !gssfTimerTimeReadyForSave();
  syncCorrectionContextGate();
  updateHitCounter();
  renderMissionWorkspaceChrome();
  document.getElementById("chooseTargetButton").disabled = false;
  document.getElementById("chooseTargetButton").removeAttribute("aria-disabled");
  document.getElementById("setAimMode").disabled = !hasEvidence || isGssf || isTraining;
  document.getElementById("addImpactMode").disabled = !hasEvidence || isTraining || (!currentAimPoint && !isGssf);
  document.getElementById("undoImpact").disabled = !hasEvidence || isTraining || currentImpactPoints.length === 0;
  document.getElementById("clearMarks").disabled = !hasEvidence || isTraining || (!currentAimPoint && currentImpactPoints.length === 0);
  document.getElementById("saveMarks").disabled = !session
    || sessionSaved
    || !resultsShown
    || correctionContextPending
    || awaitingNextConfirmationGroup()
    || gssfTimerTimePending
    || (isTraining && !trainingDrillFinished);
  document.getElementById("showResults").disabled = authorityRequestInFlight || !canProceed || (!isTraining && currentImpactPoints.length === 0);
  document.getElementById("undoImpact").textContent = "Undo";
  let nextStep = "chooseTargetButton";
  if (canProceed && isTraining && !resultsShown) nextStep = "showResults";
  if (hasEvidence && isGssf && !currentImpactPoints.length) nextStep = "addImpactMode";
  if (hasEvidence && !isGssf && !isTraining && !currentAimPoint) nextStep = "setAimMode";
  if (hasEvidence && !isGssf && !isTraining && currentAimPoint && !currentImpactPoints.length) nextStep = "addImpactMode";
  if (hasEvidence && !isTraining && currentImpactPoints.length && !resultsShown) {
    nextStep = resultsOfferReady() ? "showResults" : "addImpactMode";
  }
  if (canProceed && resultsShown && !gssfTimerTimePending && (!isTraining || trainingDrillFinished)) nextStep = "saveMarks";
  if (correctionContextPending || founderContextAtResultsGate() || awaitingNextConfirmationGroup()) nextStep = null;
  if (sessionSaved) nextStep = null;
  setNextStep(nextStep);
  const saveButton = document.getElementById("saveMarks");
  if (saveButton && isZeroingAuthoritySession()) {
    const confirmationComplete = zeroingLivePhase === "confirmation"
      && backendAuthorityPackage
      && (!isMfamZeroingAuthoritySession() || backendAuthorityPackage.validation && backendAuthorityPackage.validation.confirmed);
    const additionalCorrection = isMfamZeroingAuthoritySession() && zeroingLivePhase === "confirmation"
      && backendAuthorityPackage
      && backendAuthorityPackage.validation
      && backendAuthorityPackage.validation.status === "calculated"
      && !backendAuthorityPackage.validation.confirmed;
    saveButton.textContent = confirmationComplete
      ? "Save Session"
      : additionalCorrection
        ? "Fire Another Group"
        : zeroingLivePhase === "confirmation"
          ? "Save Session"
          : "Begin Confirmation";
  } else if (saveButton) {
    saveButton.textContent = "Save Session";
  }
  const controlEvidence = displayedEvidence || activeEvidence();
  const evidenceRole = String(controlEvidence && controlEvidence.assetRole || "");
  const shooterPhotoLoaded = !!(controlEvidence && evidenceRole.includes("shooter-captured"));
  const referenceEvidence = hasEvidence && !shooterPhotoLoaded;
  const controlEvidenceReady = precisionTapShooterEvidenceReady();
  const activeRangeState = rangeWorkflowState(canProceed);
  document.body.dataset.rangeState = activeRangeState;
  document.body.dataset.precisionTapControlState = precisionTapControlState(activeRangeState, controlEvidenceReady);
  document.body.dataset.m4LivePhase = isZeroingAuthoritySession() ? zeroingLivePhase : "";
  document.body.dataset.hasEvidence = hasEvidence ? "true" : "false";
  document.body.dataset.precisionTapHasShots = currentImpactPoints.length ? "true" : "false";
  document.body.dataset.hasResults = resultsShown ? "true" : "false";
  document.body.dataset.precisionTapReview = precisionTapReviewing ? "true" : "false";
  document.body.dataset.precisionTapRegistration = governedPrecisionTapRegistration() ? "complete" : (hasEvidence ? "required" : "none");
  if (hasEvidence && !governedPrecisionTapRegistration()) {
    document.getElementById("chooseTargetButton").textContent = "Try Another Photo";
  }
  document.body.dataset.precisionTapRegistration = governedPrecisionTapRegistration() ? "complete" : (hasEvidence ? "required" : "none");
  document.body.dataset.precisionTapPhotoSource = referenceEvidence ? "reference" : (shooterPhotoLoaded ? "shooter" : "none");
  document.getElementById("chooseTargetButton").textContent = shooterPhotoLoaded && !governedPrecisionTapRegistration()
    ? "Try Another Photo"
    : referenceEvidence
      ? "📷 Add Photo"
      : hasEvidence
        ? "Choose Another Photo"
        : "Choose Target";
  document.body.dataset.awaitingNextGroup = awaitingNextConfirmationGroup() ? "true" : "false";
  document.body.dataset.correctionContext = correctionContextPending
    ? "pending"
    : correctionContextConfirmedFingerprint
      ? "confirmed"
      : "unconfirmed";
  document.body.dataset.targetMission = isTraining ? "marksmanshipTraining" : (isGssf ? "gssf" : "zeroing");
  renderPrecisionTapControls(document.body.dataset.precisionTapControlState, activeRangeState);
}

function setMode(mode) {

function handleMarkTap(event) {
  if (!hasMarkableEvidence()) return;
  if (isBakerSampleEvidence(activeEvidence())) return;
  let restoreFullTargetContext = false;
  const beginsNextGroup = awaitingNextConfirmationGroup();
  if (resultsShown && !beginsNextGroup) return;
  if (SIMULATION_MODE && (currentAimPoint || isGssfAuthoritySession()) && currentImpactPoints.length >= 10) return;
  precisionTapReviewing = false;
  syncOverlayLayerToDisplayedImage();
  const point = evidencePointFromPointer(event);
  if (!point) return;
  if (beginsNextGroup) {
    cancelHoleEntryReadiness();
    currentImpactPoints = [point];
    currentClicks = null;
    currentScore = null;
    backendAuthorityPackage = null;
    resultsShown = false;
    authorityStatusMessage = "";
    sessionSaved = false;
    holeEntrySettled = false;
    markMode = "impact";
    hideShooterTip();
    setSaveSessionStatus("");
    scheduleHoleEntryReadiness();
  } else if (isGssfAuthoritySession()) {
    currentImpactPoints.push(point);
    scheduleHoleEntryReadiness();
  } else if (markMode === "aim" || !currentAimPoint) {
    currentAimPoint = point;
    markMode = "impact";
    holeEntrySettled = false;
    restoreFullTargetContext = true;
  } else {
    currentImpactPoints.push(point);
    correctionContextReviewDismissed = false;
    scheduleHoleEntryReadiness();
  }
  markWorkspaceProgressUnsaved();
  clearCalculatedResults();
  setMode(markMode);
  if (restoreFullTargetContext) precisionTapController?.resetView();
  renderMarkers();
  renderMarkStatus();
}

function handleTargetImageSelection(event) {
  if (!ensureTargetSession()) return;
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const processingId = beginExperienceProcessing("target-photo", "Preparing your target photo…", document.getElementById("chooseTargetButton"), document.querySelector(".workflow-control-row"));
  let processingSucceeded = false;
  readFileAsDataUrl(file)
    .then(async originalDataUrl => ({
      original: await inspectPrecisionTapImage(originalDataUrl),
      admitted: await downsizeImageDataUrl(originalDataUrl).then(inspectPrecisionTapImage)
    }))
    .then(async imageEvidenceBundle => {
    const imageEvidence = imageEvidenceBundle.admitted;
    const exactRegistration = registeredExactAssetForUpload(imageEvidenceBundle.original);
    const registrationAuthority = activeTargetImageRegistrationAuthority();
    const dataUrl = imageEvidence.dataUrl;
    // Stay-on-Screen: changing evidence replaces the image inside the governed
    // session workspace; it must not replace or resize the workspace itself.
    cancelHoleEntryReadiness();
    holeEntrySettled = false;
    currentAimPoint = null;
    currentImpactPoints = [];
    precisionTapReviewing = false;
    markWorkspaceProgressUnsaved();
    unlockDistanceForNewTarget();
    if (isDotTortureAuthoritySession()) {
      currentClicks = null;
      currentScore = null;
      authorityStatusMessage = "";
      hideShooterTip();
    } else {
      clearCalculatedResults();
    }
    pendingEvidence = {
      dataUrl,
      name: file.name,
      type: file.type,
      size: dataUrl.length,
      originalSize: file.size,
      assetRole: "shooter-captured-target-photo",
      observationCoordinateConvention: "normalized_source_image_top_left",
      observationAuthority: "shooter_declared",
      registrationStatus: registrationAuthority ? "pending" : (exactRegistration ? "complete" : "not_required"),
      registrationAuthoritySource: exactRegistration && exactRegistration.authoritySource,
      registrationAuthorityId: registrationAuthority && registrationAuthority.registrationPackageId || exactRegistration && exactRegistration.authorityId,
      registrationPackageId: registrationAuthority && registrationAuthority.registrationPackageId || exactRegistration && exactRegistration.authorityId,
      registrationPackageVersion: registrationAuthority && registrationAuthority.registrationPackageVersion || exactRegistration && exactRegistration.authorityVersion,
      canonicalAssetSha256: exactRegistration && exactRegistration.sha256,
      canonicalCoordinateSystemVersion: exactRegistration && exactRegistration.coordinateSystemVersion,
      sourceImageSha256: imageEvidence.sha256,
      imageWidthPx: imageEvidence.width,
      imageHeightPx: imageEvidence.height,
      originalSourceImageSha256: imageEvidenceBundle.original.sha256,
      originalImageWidthPx: imageEvidenceBundle.original.width,
      originalImageHeightPx: imageEvidenceBundle.original.height
    };
    renderEvidencePreview(pendingEvidence);
    document.getElementById("precisionTapPhotoPicker").hidden = true;
    document.body.dataset.precisionTapPhotoPicker = "closed";
    if (registrationAuthority) {
      const registration = await requestTargetImageRegistration(imageEvidence);
      pendingEvidence.registrationStatus = String(registration && registration.knowledgeState || "unavailable");
      pendingEvidence.registrationAuthoritySource = registration && registration.registrationMethod;
      pendingEvidence.registrationEvidenceId = registration && registration.registrationEvidenceId;
      pendingEvidence.registrationGlobalUncertaintyPx = registration && registration.globalUncertaintyPx;
      pendingEvidence.canonicalAssetSha256 = registration && registration.canonicalRepresentation && registration.canonicalRepresentation.sha256;
      pendingEvidence.sourceImageSha256 = pendingEvidence.sourceImageSha256
        || registration && registration.sourceImage && registration.sourceImage.sha256
        || "";
      pendingEvidence.originalSourceImageSha256 = pendingEvidence.originalSourceImageSha256
        || registration && registration.sourceImage && registration.sourceImage.sha256
        || "";
      pendingEvidence.canonicalCoordinateSystemVersion = registration && registration.canonicalCoordinateSystemId;
      pendingEvidence.registrationReason = registration && registration.reason;
      renderEvidencePreview(pendingEvidence);
      if (pendingEvidence.registrationStatus === "unavailable") {
        authorityStatusMessage = registration && registration.recovery && registration.recovery.shooterMessage
          || "We need a little more of the target in the picture. Take another photo.";
        setSaveSessionStatus(authorityStatusMessage);
      } else {
        authorityStatusMessage = "";
        setSaveSessionStatus("");
      }
    }
    setMode(isGssfAuthoritySession() ? "impact" : "aim");
    renderMarkStatus();
    processingSucceeded = true;
  }).catch(error => {
    console.warn("Target image read failed", error);
  }).finally(() => {
    finishExperienceProcessing(processingId, processingSucceeded);
    // Processing restores the trigger's pre-operation label. Re-project the
    // current Precision Tap state so recovery never regresses to yesterday's action.
    renderMarkStatus();
  });
}

});
document.getElementById("showResults").addEventListener("click", async () => {
  if ((!isGssfAuthoritySession() && !isDotTortureAuthoritySession() && !currentAimPoint) || (!isDotTortureAuthoritySession() && !currentImpactPoints.length)) return;
  if (authorityRequestInFlight) {
    authorityStatusMessage = isZeroingAuthoritySession()
      ? "SCZN3 is still calculating your correction."
      : "SCZN3 is still calculating your result.";
    renderResults();
    renderMarkStatus();
    return;
  }
  if (!isDotTortureAuthoritySession()) {
    cancelHoleEntryReadiness();
    holeEntrySettled = true;
    precisionTapReviewing = true;
    precisionTapController?.setReviewing(true);
    renderMarkers();
    renderMarkStatus();
  }
  if (!isDotTortureAuthoritySession()) {
    const registrationMessage = precisionTapRegistrationMessage();
    if (registrationMessage) {
      authorityStatusMessage = registrationMessage;
      renderResults();
      renderMarkStatus();
      return;
    }
  }
  const unavailableCapabilityMessage = unavailableResultCapabilityMessage();
  if (unavailableCapabilityMessage) {
    authorityStatusMessage = unavailableCapabilityMessage;
    renderResults();
    renderMarkStatus();
    return;
  }
  cancelHoleEntryReadiness();
  holeEntrySettled = true;
  if (FOUNDER_WORKSPACE_TEST_MODE && isM4AuthoritySession() && !resultsShown) {
    correctionContextReviewDismissed = false;
    renderCorrectionContextDrawer();
    renderMarkStatus();
    return;
  }
  if (isDotTortureAuthoritySession() && !session && !ensureTargetSession()) return;
  activeShowResultsTiming = {
    phase: zeroingLivePhase === "confirmation" ? "confirmation" : "initial",
    tapAt: Date.now(),
    requestSentAt: null,
    backendReceivedAt: null,
    responseReturnedAt: null,
    uiRenderedAt: null,
    serverTiming: ""
  };
  window.__SCZN3_SHOW_RESULTS_TIMING__ = activeShowResultsTiming;
  const processingMessage = isZeroingAuthoritySession()
    ? "Calculating your correction…"
    : "Calculating your score…";
  const processingId = beginExperienceProcessing("show-results", processingMessage, document.getElementById("showResults"), document.querySelector(".workflow-control-row"));
  let processingSucceeded = false;
  authorityRequestInFlight = true;
  authorityStatusMessage = "";
  renderResults();
  renderMarkStatus();
  try {
    const authorityPackage = await requestBackendAuthority();
    applyBackendAuthorityPackage(authorityPackage);
    syncCorrectionContextGate();
    try {
      if (window.SCZN3Ops) window.SCZN3Ops.recordShowResults(authorityPackage);
    } catch (error) {}
    renderMarkers();
    renderResults();
    if (resultsShown && !isNonZeroingAuthorityPackage(authorityPackage)) showShooterTip();
    if (resultsShown && isNonZeroingAuthorityPackage(authorityPackage)) hideShooterTip();
    if (isMfamZeroingAuthoritySession() && zeroingLivePhase === "confirmation" && authorityPackage.validation) {
      setSaveSessionStatus(
        correctionContextPending
          ? "Review the session setup to refresh the correction."
          : authorityPackage.validation.confirmed
          ? "Your zero is confirmed. Turn the rear elevation drum one click COUNTERCLOCKWISE back to 8/3 for your 300-meter setting."
          : remainingCorrectionShooterMessage(authorityPackage),
        !correctionContextPending && authorityPackage.validation.confirmed ? "saved" : ""
      );
    }
    processingSucceeded = resultsShown;
  } catch (error) {
    console.warn("Backend authority request failed", error);
    currentClicks = null;
    currentScore = null;
    backendAuthorityPackage = null;
    resultsShown = false;
    authorityStatusMessage = authorityFailureShooterMessage(error);
    renderResults();
  } finally {
    authorityRequestInFlight = false;
    finishExperienceProcessing(processingId, processingSucceeded);
    renderResults();
  }
  renderMarkStatus();
  if (activeShowResultsTiming) activeShowResultsTiming.uiRenderedAt = Date.now();
});

function setSaveSessionStatus(message = "", state = "") {
  const status = document.getElementById("saveSessionStatus");
  if (!status) return;
  status.textContent = message;
  status.dataset.state = state;
  status.classList.toggle("is-visible", !!message);
}

document.getElementById("saveMarks").addEventListener("click", () => {
  const saveButton = document.getElementById("saveMarks");
  if (!session) {
    setSaveSessionStatus("Session could not be saved because no active session was found.", "error");
    return;
  }
  if (!backendAuthorityPackage) {
    setSaveSessionStatus("Show Results before saving so the complete result is preserved.", "error");
    return;
  }
  if (isGssfAuthorityPackage(backendAuthorityPackage) && !gssfTimerTimeReadyForSave()) {
    setSaveSessionStatus("Select Seconds and Tenths before saving.", "error");
    return;
  }
  if (
    isMfamZeroingAuthoritySession()
    && zeroingLivePhase === "confirmation"
    && backendAuthorityPackage.validation
    && backendAuthorityPackage.validation.status === "calculated"
    && !backendAuthorityPackage.validation.confirmed
  ) {
    const nextGroupMessage = remainingCorrectionShooterMessage(backendAuthorityPackage);
    SCZN3M4.saveConfirmationAuthority(backendAuthorityPackage, activeEvidence(), currentImpactPoints.map(safePoint).filter(Boolean));
    currentImpactPoints = [];
    clearCalculatedResults();
    setMode("impact");
    setSaveSessionStatus(nextGroupMessage, "saved");
    renderMarkers();
    renderMarkStatus();
    return;
  }
  const saveProcessingId = beginExperienceProcessing("save-sec", "Preserving your Shooter Experience Card…", saveButton, document.querySelector(".workflow-control-row"));
  setSaveSessionStatus("Saving session…", "saving");
  saveButton.disabled = true;
  saveButton.textContent = "Saving…";
  let saved = null;
  if (pendingEvidence) {
    saved = SCZN3M4.saveTargetEvidenceImage(pendingEvidence);
    pendingEvidence = null;
  }
  lockDistanceForSession();
  const savedTimestamp = new Date().toISOString();
  let authorityPackage = backendAuthorityPackage;
  let trainingManualResult = null;
  if (isDotTortureTrainingPackage(authorityPackage)) {
    const manualRead = readTrainingManualResult({ requireScore: true });
    if (!manualRead.ok) {
      trainingDrillFinished = true;
      renderResults();
      showTrainingManualError(manualRead.message);
      saveButton.disabled = false;
      saveButton.textContent = "Save Session";
      setSaveSessionStatus(manualRead.message, "error");
      finishExperienceProcessing(saveProcessingId, false);
      return;
    }
    trainingManualResult = {
      ...manualRead.result,
      savedAt: savedTimestamp
    };
    authorityPackage = authorityPackageWithTrainingManualResult(authorityPackage, trainingManualResult, true);
    backendAuthorityPackage = authorityPackage;
  }
  const authorityClicks = zeroingClicksFromAuthorityPackage(authorityPackage);
  const gssfOfficialResult = isGssfAuthorityPackage(authorityPackage)
    ? gssfOfficialCompetitionResult(authorityPackage)
    : null;
  const hadSavedHistoryBefore = (SCZN3M4.getSessionHistory ? SCZN3M4.getSessionHistory() : [])
    .some(historySession => historySession && historySession.savedToSEC === true && historySession.sessionId !== session.sessionId);
  const savePatch = isGssfAuthorityPackage(authorityPackage) ? {
    aimPoint: null,
    impactPoints: currentImpactPoints.map(storedGssfPoint).filter(Boolean),
    backendAuthorityPackage: authorityPackage,
    ugeoAuthorityPackage: null,
    authorityPackage,
    score: null,
    scoreValue: null,
    poib: null,
    groupCenter: null,
    clicks: null,
    correctionData: {
      status: "not-applicable",
      clicks: null,
      correction: null,
      moa: null,
      vectors: null
    },
    shotData: {
      status: "backend-gssf-authority-calculated",
      impactPoints: currentImpactPoints.map(storedGssfPoint).filter(Boolean),
      shotCount: currentImpactPoints.length,
      hits: currentImpactPoints.length,
      hitClassifications: authorityPackage.hitClassifications || [],
      counts: authorityPackage.counts || {},
      downZeroCount: authorityPackage.downZeroCount,
      plusOneCount: authorityPackage.plusOneCount,
      plusThreeCount: authorityPackage.plusThreeCount,
      missCount: authorityPackage.missCount,
      totalPaperPenaltySeconds: authorityPackage.totalPaperPenaltySeconds,
      finalTimeSeconds: authorityPackage.finalTimeSeconds,
      finalTimeStatus: authorityPackage.finalTimeStatus,
      officialMatchTimeSeconds: gssfOfficialResult.officialMatchTimeSeconds,
      officialFinalScoreSeconds: gssfOfficialResult.officialFinalScoreSeconds,
      officialFinalScoreStatus: gssfOfficialResult.finalScoreStatus,
      manualTimeSource: gssfOfficialResult.manualTimeSource,
      authoritySource: "backend"
    },
    officialMatchTimeSeconds: gssfOfficialResult.officialMatchTimeSeconds,
    gssfOfficialMatchTimeSeconds: gssfOfficialResult.officialMatchTimeSeconds,
    totalPaperPenaltySeconds: gssfOfficialResult.totalPaperPenaltySeconds,
    officialFinalScoreSeconds: gssfOfficialResult.officialFinalScoreSeconds,
    officialFinalScoreStatus: gssfOfficialResult.finalScoreStatus,
    gssfManualTimeSource: gssfOfficialResult.manualTimeSource,
    gssfScoringSource: gssfOfficialResult.scoringSource,
    hits: currentImpactPoints.length,
    shotCount: currentImpactPoints.length,
    correctionStatus: "not-applicable",
    savedToSEC: true,
    targetDistance: targetDistanceValue(),
    targetDistanceValue: selectedDistanceValue,
    targetDistanceUnit: selectedDistanceUnit,
    targetDistanceLocked: true,
    distance: targetDistanceValue(),
    timestamp: savedTimestamp,
    savedAt: savedTimestamp
  } : isDotTortureTrainingPackage(authorityPackage) ? {
    backendAuthorityPackage: authorityPackage,
    ugeoAuthorityPackage: authorityPackage,
    trainingManualResult,
    score: authorityPackage.score || null,
    scoreValue: trainingManualResult ? trainingManualResult.score : null,
    shotData: {
      status: "training-manual",
      score: authorityPackage.score || null,
      scoreValue: trainingManualResult ? trainingManualResult.score : null,
      authoritySource: "backend",
      manualSource: "shooter-entry"
    },
    hits: 0,
    shotCount: 0,
    correctionStatus: "not-applicable",
    savedToSEC: true,
    targetDistance: targetDistanceValue(),
    targetDistanceValue: selectedDistanceValue,
    targetDistanceUnit: selectedDistanceUnit,
    targetDistanceLocked: true,
    distance: targetDistanceValue(),
    timestamp: savedTimestamp,
    savedAt: savedTimestamp
  } : {
    aimPoint: safePoint(currentAimPoint),
    confirmedAimPoint: authorityPackage.inputs && authorityPackage.inputs.confirmedAimPoint || safePoint(currentAimPoint),
    confirmedAimPointAuthority: authorityPackage.confirmedAimPointAuthority || null,
    impactPoints: currentImpactPoints.map(safePoint).filter(Boolean),
    backendAuthorityPackage: authorityPackage,
    ugeoAuthorityPackage: authorityPackage,
    score: authorityPackage.score || null,
    scoreValue: backendScoreValue(authorityPackage),
    poib: authorityPackage.poib || null,
    groupCenter: authorityPackage.groupCenter || null,
    clicks: authorityClicks,
    correctionData: {
      status: authorityPackage.status && authorityPackage.status.hasCorrection ? "backend-authority-calculated" : "not-calculated",
      clicks: authorityClicks,
      correction: authorityPackage.correction || null,
      moa: authorityPackage.moa || null,
      vectors: authorityPackage.vectors || null
    },
    shotData: {
      aimPoint: safePoint(currentAimPoint),
      confirmedAimPoint: authorityPackage.inputs && authorityPackage.inputs.confirmedAimPoint || safePoint(currentAimPoint),
      impactPoints: currentImpactPoints.map(safePoint).filter(Boolean),
      shotCount: currentImpactPoints.length,
      hits: currentImpactPoints.length,
      poib: authorityPackage.poib || null,
      groupCenter: authorityPackage.groupCenter || null,
      score: authorityPackage.score || null,
      scoreValue: backendScoreValue(authorityPackage),
      authoritySource: "backend"
    },
    hits: currentImpactPoints.length,
    shotCount: currentImpactPoints.length,
    correctionStatus: authorityPackage.status && authorityPackage.status.hasCorrection
      ? "backend-authority-calculated"
      : authorityPackage.status && authorityPackage.status.hasCorrectionEstimate
        ? "best-estimate-exact-click-count-withheld"
        : "not-calculated",
    savedToSEC: true,
    targetDistance: targetDistanceValue(),
    targetDistanceValue: selectedDistanceValue,
    targetDistanceUnit: selectedDistanceUnit,
    targetDistanceLocked: true,
    distance: targetDistanceValue(),
    timestamp: savedTimestamp,
    savedAt: savedTimestamp
  };
  savePatch.correctionContextSnapshot = correctionContextSnapshot(authorityPackage);
  savePatch.founderWorkspaceTestMode = FOUNDER_WORKSPACE_TEST_MODE;
  savePatch.savedIdentifier = session.savedIdentifier || `SEC-${session.sessionId}`;
  savePatch.savedRecordId = session.savedRecordId || session.sessionId;
  savePatch.authorityPackage = authorityPackage;
  if (isZeroingAuthoritySession()) {
    if (zeroingLivePhase === "confirmation") {
      const initialAuthority = initialZeroingAuthorityPackage
        || session.m4AuthorityPackage
        || session.backendAuthorityPackage
        || session.authorityPackage;
      const initialImpacts = Array.isArray(session.impactPoints)
        ? session.impactPoints.map(safePoint).filter(Boolean)
        : [];
      savePatch.backendAuthorityPackage = initialAuthority;
      savePatch.ugeoAuthorityPackage = initialAuthority;
      savePatch.authorityPackage = initialAuthority;
      if (isM4AuthoritySession()) savePatch.m4AuthorityPackage = initialAuthority;
      savePatch.aimPoint = safePoint(session.aimPoint || currentAimPoint);
      savePatch.confirmedAimPoint = initialAuthority && initialAuthority.inputs && initialAuthority.inputs.confirmedAimPoint
        || safePoint(session.confirmedAimPoint || session.aimPoint || currentAimPoint);
      savePatch.confirmedAimPointAuthority = initialAuthority && initialAuthority.confirmedAimPointAuthority
        || session.confirmedAimPointAuthority
        || null;
      savePatch.impactPoints = initialImpacts;
      savePatch.shotData = session.shotData || {
        aimPoint: savePatch.aimPoint,
        impactPoints: initialImpacts,
        shotCount: initialImpacts.length,
        hits: initialImpacts.length,
        poib: initialAuthority && initialAuthority.poib || null,
        groupCenter: initialAuthority && initialAuthority.groupCenter || null,
        score: initialAuthority && initialAuthority.score || null,
        scoreValue: backendScoreValue(initialAuthority),
        authoritySource: "backend"
      };
      savePatch.score = session.score || initialAuthority && initialAuthority.score || null;
      savePatch.scoreValue = Number.isFinite(Number(session.scoreValue))
        ? Number(session.scoreValue)
        : backendScoreValue(initialAuthority);
      savePatch.poib = session.poib || initialAuthority && initialAuthority.poib || null;
      savePatch.groupCenter = session.groupCenter || initialAuthority && initialAuthority.groupCenter || null;
      savePatch.clicks = session.clicks || initialAuthority && initialAuthority.clicks || null;
      savePatch.correctionData = session.correctionData || {
        status: initialAuthority && initialAuthority.status && initialAuthority.status.hasCorrection
          ? "backend-authority-calculated"
          : "not-calculated",
        clicks: savePatch.clicks,
        correction: initialAuthority && initialAuthority.correction || null,
        moa: initialAuthority && initialAuthority.moa || null,
        vectors: initialAuthority && initialAuthority.vectors || null
      };
      savePatch.confirmationEvidenceImage = activeEvidence();
      savePatch.confirmationImpactPoints = currentImpactPoints.map(safePoint).filter(Boolean);
      savePatch.confirmationAuthorityPackage = authorityPackage;
      savePatch.confirmationStatus = isMfamZeroingAuthoritySession()
        ? authorityPackage.validation && authorityPackage.validation.confirmed
          ? "Confirmed"
          : "Correction Required"
        : "Recorded";
      savePatch.confirmationRecordedAt = savedTimestamp;
      savePatch.confirmedAt = authorityPackage.validation && authorityPackage.validation.confirmed
        ? savedTimestamp
        : null;
      savePatch.savedToSEC = true;
      savePatch.workflowStage = "preservation";
      savePatch.preservationStatus = "saved";
    } else {
      if (isM4AuthoritySession()) savePatch.m4AuthorityPackage = authorityPackage;
      savePatch.savedToSEC = false;
      savePatch.workflowStage = "validation";
      savePatch.preservationStatus = "initial-authority-saved-confirmation-pending";
    }
  }
  if (SIMULATION_MODE) {
    const source = session.matrixSnapshot || matrix || {};
    savePatch.experienceMode = "simulation";
    savePatch.simulation = true;
    savePatch.simulationSessionId = SIMULATION_SESSION_ID;
    savePatch.matrixSnapshot = {
      target_profile_id: source.target_profile_id || source.targetProfileId || "",
      targetProfileId: source.targetProfileId || source.target_profile_id || "",
      targetId: source.targetId || source.target_profile_id || source.targetProfileId || "",
      targetName: source.targetName || "Simulation Target",
      targetFamily: source.targetFamily || "",
      mission_family: source.mission_family || source.missionFamily || source.missionFamilyId || "",
      missionFamily: source.missionFamily || source.mission_family || source.missionFamilyId || "",
      targetDistance: targetDistanceValue(),
      targetDistanceValue: selectedDistanceValue,
      targetDistanceUnit: selectedDistanceUnit,
      opticClickValue: source.opticClickValue || "",
      opticAdjustmentUnit: source.opticAdjustmentUnit || source.adjustmentUnit || ""
    };
  }
  try {
    saved = SCZN3M4.updateActiveSession(savePatch);
  } catch (error) {
    console.warn("Session preservation failed", error);
    saveButton.disabled = false;
    saveButton.textContent = "Save Session";
    setSaveSessionStatus("Save failed. Your marks remain on this screen; try again.", "error");
    finishExperienceProcessing(saveProcessingId, false);
    return;
  }
  if (!saved || !saved.savedIdentifier || !saved.authorityPackage) {
    saveButton.disabled = false;
    saveButton.textContent = "Save Session";
    setSaveSessionStatus("Save failed. The complete session was not preserved.", "error");
    finishExperienceProcessing(saveProcessingId, false);
    return;
  }
  if (saved && saved.targetEvidenceImage) {
    renderEvidencePreview(saved.targetEvidenceImage);
  }
  try {
    if (window.SCZN3Ops) window.SCZN3Ops.recordSessionSaved(saved, { hadSavedHistoryBefore });
  } catch (error) {}
  markWorkspaceProgressPreserved();
  session = saved;
  if (isZeroingAuthoritySession() && zeroingLivePhase === "initial") {
    initialZeroingAuthorityPackage = authorityPackage;
    zeroingLivePhase = "confirmation";
    precisionTapReviewing = false;
    markWorkspaceProgressUnsaved();
    currentImpactPoints = [];
    holeEntrySettled = false;
    currentClicks = null;
    currentScore = null;
    backendAuthorityPackage = null;
    resultsShown = false;
    authorityStatusMessage = "";
    hideShooterTip();
    renderEvidencePreview(saved.targetEvidenceImage || activeEvidence());
    setMode("impact");
    renderMarkers();
    renderResults();
    renderMarkStatus();
    setSaveSessionStatus("");
    finishExperienceProcessing(saveProcessingId, true);
    return;
  }
  renderMarkStatus();
  renderResults();
  saveButton.textContent = "Saved ✓";
  setSaveSessionStatus(`Saved as ${saved.savedIdentifier}. Opening Shooter Experience Card…`, "saved");
  finishExperienceProcessing(saveProcessingId, true);
  if (saved) {
    window.setTimeout(() => {
      if (window.SCZN3SECDispatch) {
        window.location.href = SCZN3SECDispatch.destinationFor(saved, { current: true });
      } else if (isM4AuthoritySession()) {
        window.location.href = "sec.html?v=stay-on-screen-002";
      } else {
        const recordQuery = new URLSearchParams();
        if (SIMULATION_MODE) recordQuery.set("simulation", "1");
        if (saved.sessionId) recordQuery.set("session", saved.sessionId);
        window.location.href = `records.html${recordQuery.toString() ? `?${recordQuery}` : ""}`;
      }
    }, 450);
  }
});

window.addEventListener("resize", () => {
  syncOverlayLayerToDisplayedImage();
  renderMarkers();
  placeCorrectionContextDrawer();
});

bindCorrectionContextDrawer();
if (TARGET_PROFILE_LAUNCH_ID) {
  resolveMissionFromTargetProfile();
} else {
  if (isM4AuthoritySession() && !PREPARED_M16A2_DEMO_MODE) {
    const evidence = installM4CanonicalEvidence();
    if (evidence) renderEvidencePreview(evidence);
  }
  setMode(isGssfAuthoritySession() ? "impact" : (currentAimPoint ? "impact" : "aim"));
  renderSetupSummary();
  renderResults();
}
</script>
</body>
</html>
