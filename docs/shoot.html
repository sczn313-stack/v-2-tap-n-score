  const observationCount = Math.max(0, Number(count) || 0);

    + Math.max(0, observationCount - 1) * choreography.observations.cadenceMs
    + choreography.observations.landingMs

}

function smartTargetReplenishmentMarkup(...identitySources) {
  const identity = window.SCZN3TargetProfiles && SCZN3TargetProfiles.identityRecord(...identitySources);
  const publisher = identity && identity.publisherIdentity;
  const product = identity && identity.productIdentity;
  const governedRoute = (product && product.productUrl) || (publisher && publisher.publisherUrl);
  if (!publisher || !governedRoute) return "";
  let sourceUrl;
  try {
    sourceUrl = new URL(governedRoute, window.location.href);
    if (!["http:", "https:"].includes(sourceUrl.protocol)) return "";
  } catch (error) {
    return "";
  }
  const escapeMarkup = value => String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
  const publisherLabel = escapeMarkup(publisher.publisherLabel);
  const linkLabel = escapeMarkup(publisher.publisherLinkLabel || sourceUrl.hostname);
  return `<aside class="smart-target-replenishment" data-publisher-id="${escapeMarkup(publisher.publisherId)}" data-product-id="${escapeMarkup(product && product.productId)}"><span>BUY MORE TARGETS LIKE THIS</span><strong>${publisherLabel}</strong><a href="${escapeMarkup(sourceUrl.href)}" target="_blank" rel="noopener noreferrer">${linkLabel}</a></aside>`;
}

function waitForBakerSampleDemoSurface(step) {
  if (!step.waitForSurface) return Promise.resolve();
  const frame = document.querySelector("#bakerSampleDemoScene iframe");
  if (!frame) return Promise.resolve();
  try {
    if (frame.contentDocument && frame.contentDocument.readyState === "complete") return Promise.resolve();
  } catch (error) {
    // The load event remains the readiness source if browser policy withholds the document.
  }
  return new Promise(resolve => {
    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      window.clearTimeout(timeout);
      resolve();
    };
    const timeout = window.setTimeout(finish, 5000);
    frame.addEventListener("load", finish, { once: true });
  });
}

    sessionSource.mission_name
    || sessionSource.missionName
    || matrixSource.mission_name
    || matrixSource.missionName
    || targetAuthority.mission_name
    || targetAuthority.missionName
    || TARGET_QUERY.get("mission_name")
    || TARGET_QUERY.get("missionName")
    || ""
  ).toLowerCase();
}

function authoritativeTargetName(value) {
  const name = String(value || "").trim();
  if (!name) return "";
  if (/^(target|generic target|default target|unknown baker target)$/i.test(name)) return "";
  return name;
}

function displayTargetName(value, targetProfileId = "") {
  const profileIdentity = window.SCZN3TargetProfiles && SCZN3TargetProfiles.identityRecord(targetProfileId);
  if (profileIdentity) return SCZN3TargetProfiles.display(profileIdentity);
  return SCZN3Presentation.targetLabel(targetProfileId, authoritativeTargetName(value) || "Not Known");
}

function activeTargetIdentity() {
  const authorityPackage = compatibleAuthorityPackage(backendAuthorityPackage) || {};
  const authorityTarget = authorityPackage.target || authorityPackage.targetProfile || {};
  const sessionSource = session || {};
  const matrixSource = matrix || {};
  const targetAuthority = sessionSource.targetAuthority || {};
  const targetProfileId = String(
    authorityPackage.target_profile_id
    || authorityPackage.targetProfileId
    || authorityTarget.target_profile_id
    || authorityTarget.targetProfileId
    || authorityTarget.targetId
    || activeTargetProfileId()
    || ""
  ).toLowerCase();
  const staticIdentity = STATIC_TARGET_IDENTITY[targetProfileId] || {};
  const targetName = [
    authorityPackage.target_display_name,
    authorityPackage.targetDisplayName,
    authorityPackage.target_name,
    authorityPackage.targetName,
    authorityTarget.target_display_name,
    authorityTarget.targetDisplayName,
    authorityTarget.target_name,
    authorityTarget.targetName,
    sessionSource.target_display_name,
    sessionSource.targetDisplayName,
    sessionSource.target_name,
    sessionSource.targetName,
    matrixSource.target_display_name,
    matrixSource.targetDisplayName,
    matrixSource.target_name,
    matrixSource.targetName,
    targetAuthority.target_display_name,
    targetAuthority.targetDisplayName,

    missionFamily: authorityPackage.mission_family || authorityPackage.missionFamily || authorityPackage.missionFamilyId || activeMissionFamily() || staticIdentity.missionFamily || "",
    manufacturer: authorityPackage.manufacturer || authorityTarget.manufacturer || sessionSource.manufacturer || matrixSource.manufacturer || staticIdentity.manufacturer || "",

function renderTargetHeaderIdentity() {

    identity.discipline ? `Discipline: ${identity.discipline}` : "",

function missionStageProgress(authorityPackage) {
  const stages = trainingStages(authorityPackage);
  if (!stages.length) return "";
  return `Stage ${Math.min(trainingStageIndex + 1, stages.length)} of ${stages.length}`;
}

function zeroingMissionProgress() {
  if (!hasMarkableEvidence()) return "";
  if (isZeroingAuthoritySession() && zeroingLivePhase === "confirmation") {
    if (!currentImpactPoints.length) return "Confirmation group";
    if (!resultsShown) return `${currentImpactPoints.length} confirmation ${currentImpactPoints.length === 1 ? "hole" : "holes"}`;
    if (!isMfamZeroingAuthoritySession()) return "Confirmation recorded";
    return backendAuthorityPackage && backendAuthorityPackage.validation && backendAuthorityPackage.validation.confirmed
      ? "Zero confirmed"
      : "Additional correction required";
  }
  if (!currentAimPoint) return "Tap aim point";
  if (!currentImpactPoints.length) return "Tap bullet holes";
  if (!resultsShown) return `${currentImpactPoints.length} ${currentImpactPoints.length === 1 ? "hole" : "holes"} recorded`;
  if (!sessionSaved) return "Ready for confirmation";
  return "Session saved";
}

function gssfMissionProgress() {
  if (!hasMarkableEvidence()) return "";
  if (!currentImpactPoints.length) return "Tap stage hits";
  if (!resultsShown) return `${currentImpactPoints.length} hits recorded`;
  if (!sessionSaved) return "Ready to save";
  return "Session saved";
}

function simulationCompletedCount() {
  if (!SIMULATION_MODE || !SIMULATION_SESSION_ID) return 0;
  return SCZN3M4.getSessionHistory().filter(candidate => (
    candidate
    && candidate.savedToSEC === true
    && candidate.experienceMode === "simulation"
    && candidate.simulationSessionId === SIMULATION_SESSION_ID
  )).length;
}

function simulationLimitReached() {
  return SIMULATION_MODE && simulationCompletedCount() >= SIMULATION_LIMIT;
}

function zeroingMissionGuidance() {
  if (isBakerSampleEvidence()) return "";
  if (!precisionTapShooterEvidenceReady()) return "Add a target photo to begin.";
  if (isZeroingAuthoritySession() && zeroingLivePhase === "confirmation") {
    if (!currentImpactPoints.length) return "Tap each hole in the confirmation group.";
    if (!resultsShown) return "Tap Show Results for this confirmation group.";
    if (!isMfamZeroingAuthoritySession()) return "Confirmation recorded. Save the completed session.";
    return backendAuthorityPackage && backendAuthorityPackage.validation && backendAuthorityPackage.validation.confirmed
      ? "Your zero is confirmed. Turn the rear elevation drum one click COUNTERCLOCKWISE back to 8/3 for your 300-meter setting."
      : "Apply the correction, then fire another confirmation group.";
  }
  if (!currentAimPoint) return "Tap your aim point on the photo.";
  if (!currentImpactPoints.length) return "Tap your shots on the photo.";
  if (!resultsShown) return (!isMfamZeroingAuthoritySession() || holeEntrySettled)
    ? "Tap Show Results when your shots are marked."
    : "Continue tapping bullet holes.";
  if (!sessionSaved) return isMfamZeroingAuthoritySession()
    ? "Apply the clicks, then shoot your confirmation."
    : "Apply your clicks, then shoot your confirmation shots.";
  return "View Record";
}

function zeroingMissionStatus() {
  if (isBakerSampleEvidence()) return "Sample";
  if (!hasMarkableEvidence()) return "Ready";
  if (isZeroingAuthoritySession() && zeroingLivePhase === "confirmation") {
    if (!currentImpactPoints.length) return "Confirmation";
    if (!resultsShown) return "Confirmation Evidence";
    if (!isMfamZeroingAuthoritySession()) return "Confirmation Recorded";
    return backendAuthorityPackage && backendAuthorityPackage.validation && backendAuthorityPackage.validation.confirmed
      ? "Zero Confirmed"
      : "Correction Required";
  }
  if (!currentAimPoint) return "Awaiting Aim Point";
  if (!currentImpactPoints.length) return "Awaiting Impacts";
  if (!resultsShown) return "Ready for Results";
  if (!sessionSaved) return "Initial Results";
  return "Saved";
}

function gssfMissionGuidance() {
  if (!precisionTapShooterEvidenceReady()) return "Add a target photo to begin.";
  if (!currentImpactPoints.length) return "Record Impacts";
  if (!resultsShown) return "Show Results";
  if (!sessionSaved) return "Save Session";
  return "View Record";
}

function gssfMissionStatus() {
  if (!hasMarkableEvidence()) return "Ready";
  if (!currentImpactPoints.length) return "Recording Impacts";
  if (!resultsShown) return "Ready for Results";
  if (!sessionSaved) return "Results Ready";
  return "Saved";
}

function trainingMissionGuidance(authorityPackage) {
  if (!precisionTapShooterEvidenceReady()) return "Add a target photo to begin.";

  return trainingStageGuidance(authorityPackage, trainingStageIndex);
}

function trainingMissionStatus(authorityPackage) {
  if (!hasMarkableEvidence()) return "Ready";
  if (trainingDrillFinished) return "Results Ready";
  const progress = missionStageProgress(authorityPackage);
  return progress || "Training In Progress";
}

function isGssfAuthoritySession() {
  return activeTargetProfileId() === "gssf_ac_1" || activeMissionFamily() === "gssf";
}

function sessionCapability(name) {
  const capabilities = session && (
    session.authoritativeCapabilities
    || session.backendSessionAuthority && session.backendSessionAuthority.capabilities
  );
  return capabilities && capabilities[name] || null;
}

function unavailableResultCapabilityMessage() {
  const capabilityName = isGssfAuthoritySession() ? "officialScore" : "correction";
  const capability = sessionCapability(capabilityName);
  if (!capability || capability.status !== "unavailable") return "";
  const snapshot = session && session.matrixSnapshot || {};
  const opticType = String(snapshot.opticType || "").trim();
  const clickValue = Number(snapshot.opticClickValue);
  return SCZN3Presentation.capabilityGuidance({
    targetProfileId: activeTargetProfileId(),
    missionFamily: activeMissionFamily(),
    sightClickDataMissing: !!opticType && (!Number.isFinite(clickValue) || clickValue <= 0)
  });
}

function isBaker100YardSession() {
  return activeTargetProfileId() === "baker_st_100yd_smart_zero";
}

function isDotTortureAuthoritySession() {
  const missionName = activeMissionName();
  return isDotTortureProfileId(activeTargetProfileId())
    || (activeMissionFamily() === "marksmanshiptraining" && (
      missionName === "dottorture"
      || missionName === "dottorturestandard"
      || missionName === "dottorturelite"
      || missionName === "revolvingdottorture"
    ));
}

function isGssfAuthorityPackage(authorityPackage) {
  if (!authorityPackage || typeof authorityPackage !== "object") return false;
  if (authorityPackage.ok !== true || authorityPackage.status !== "calculated") return false;
  if (authorityPackage.target_profile_id !== "gssf_ac_1" || authorityPackage.mission_family !== "gssf") return false;
  if (authorityPackage.resultPackageType !== "gssfPaperPenaltyResult" || authorityPackage.resultSource !== "backend") return false;
  if (typeof authorityPackage.totalPaperPenaltySeconds !== "number" || !Number.isFinite(authorityPackage.totalPaperPenaltySeconds) || authorityPackage.totalPaperPenaltySeconds < 0) return false;
  const breakdown = authorityPackage.scoringBreakdown;
  if (!Array.isArray(breakdown) || breakdown.length !== 4) return false;
  const expectedZones = new Set(["downZero", "plusOne", "plusThree", "miss"]);
  const seenZones = new Set();
  const seenShotIds = new Set();
  for (const bucket of breakdown) {
    if (!bucket || typeof bucket !== "object" || !expectedZones.has(bucket.zone) || seenZones.has(bucket.zone)) return false;
    if (typeof bucket.count !== "number" || !Number.isFinite(bucket.count) || !Number.isInteger(bucket.count) || bucket.count < 0) return false;
    if (typeof bucket.penaltySecondsPerHit !== "number" || !Number.isFinite(bucket.penaltySecondsPerHit)) return false;
    if (typeof bucket.subtotalPenaltySeconds !== "number" || !Number.isFinite(bucket.subtotalPenaltySeconds)) return false;
    if (!Array.isArray(bucket.shotIds) || bucket.shotIds.length !== bucket.count) return false;
    for (const shotId of bucket.shotIds) {
      if (typeof shotId !== "number" || !Number.isFinite(shotId) || !Number.isInteger(shotId) || shotId < 1 || seenShotIds.has(shotId)) return false;
      seenShotIds.add(shotId);
    }
    seenZones.add(bucket.zone);
  }
  return seenZones.size === expectedZones.size;
}

function isDotTortureTrainingPackage(authorityPackage) {
  if (!authorityPackage) return false;
  const missionFamily = String(authorityPackage.mission_family || authorityPackage.missionFamily || authorityPackage.missionFamilyId || "");
  const missionName = String(authorityPackage.mission_name || authorityPackage.missionName || "");
  const missionGroup = String(authorityPackage.mission_group || authorityPackage.missionGroup || "");
  const secTemplate = String(authorityPackage.sec_template || authorityPackage.secTemplate || "");
  return missionFamily === "marksmanshipTraining"
    && secTemplate === "trainingSEC"
    && (
      missionGroup === "dotTortureFamily"
      || missionName === "dotTorture"
      || missionName === "dotTortureStandard"
      || missionName === "dotTortureLite"
      || missionName === "revolvingDotTorture"
    );
}

function isNonZeroingAuthorityPackage(authorityPackage) {
  return isGssfAuthorityPackage(authorityPackage) || isDotTortureTrainingPackage(authorityPackage);
}

function isZeroingAuthorityPackage(authorityPackage) {
  if (!authorityPackage || typeof authorityPackage !== "object") return false;
  const missionFamily = String(authorityPackage.mission_family || authorityPackage.missionFamily || authorityPackage.missionFamilyId || "");
  const resultPackageType = String(authorityPackage.resultPackageType || "");
  const status = authorityPackage.status;
  return missionFamily === "zeroingCorrection"
    && resultPackageType === "zeroCorrectionResult"
    && !!status
    && status.hasAim === true
    && status.hasPOIB === true
    && Number.isInteger(Number(status.impactCount))
    && Number(status.impactCount) > 0;
}

function isMissionResolving() {
  return missionResolutionStatus === "resolving";
}

function isMissionResolutionUnavailable() {
  return missionResolutionStatus === "unavailable";
}

function missionResolutionHtml() {
  const message = isMissionResolutionUnavailable()
    ? "Unable to load this target. Try again."
    : (missionResolutionMessage || "Loading target...");
  const subtext = isMissionResolutionUnavailable()
    ? "This target is not ready yet."
    : "Getting your target ready.";
  return `
    <div class="authority-results-panel training-results-panel mission-resolution-panel" id="missionResolutionPanel" aria-label="Target loading" role="status" aria-live="polite">
      <div class="training-result-header">
        <span>Target</span>
        <strong>${escapeHtml(message)}</strong>
        <em>${escapeHtml(subtext)}</em>
      </div>
    </div>
  `;
}

function setMissionResolutionChrome() {
  const isBlocked = isMissionResolving() || isMissionResolutionUnavailable();
  const workflow = document.querySelector(".workflow-control-row");
  const context = document.querySelector(".target-session-context");
  if (workflow) {
    workflow.hidden = isBlocked;
    workflow.style.display = isBlocked ? "none" : "";
  }
  if (context) {
    context.hidden = isBlocked;
    context.style.display = isBlocked ? "none" : "";
  }
  document.body.dataset.missionResolution = missionResolutionStatus;
}

function renderMissionResolutionState() {
  const preview = document.getElementById("targetEvidencePreview");
  if (preview) {
    preview.innerHTML = `<div class="evidence-meta evidence-status-stack"><div class="target-intel-stack" id="resultsGrid">${missionResolutionHtml()}</div></div>`;
  }
  renderMarkStatus();
}

function activeMissionKind() {
  if (isDotTortureAuthoritySession()) return "dotTortureFamily";
  if (isGssfAuthoritySession()) return "gssf";
  return "zeroing";
}

function authorityPackageMissionKind(authorityPackage) {
  if (!authorityPackage) return "";
  if (isDotTortureTrainingPackage(authorityPackage)) return "dotTortureFamily";
  if (isGssfAuthorityPackage(authorityPackage)) return "gssf";
  if (isZeroingAuthorityPackage(authorityPackage)) return "zeroing";
  return "";
}

function authorityPackageTargetProfileId(authorityPackage) {
  return String(
    authorityPackage && (
      authorityPackage.target_profile_id
      || authorityPackage.targetProfileId
      || authorityPackage.targetId
      || ""
    )
  ).toLowerCase();
}

function isAuthorityPackageCompatibleWithActiveMission(authorityPackage) {
  const packageKind = authorityPackageMissionKind(authorityPackage);
  if (!packageKind) return false;
  const activeProfileId = activeTargetProfileId();
  const packageProfileId = authorityPackageTargetProfileId(authorityPackage);
  if (activeProfileId && packageProfileId && activeProfileId !== packageProfileId) return false;
  return packageKind === activeMissionKind();
}

function compatibleAuthorityPackage(authorityPackage) {
  return isAuthorityPackageCompatibleWithActiveMission(authorityPackage) ? authorityPackage : null;
}

function stripStaleAuthorityFields(record = {}) {
  if (!record || typeof record !== "object") return {};
  const next = { ...record };
  [
    "backendAuthorityPackage",
    "ugeoAuthorityPackage",
    "authorityPackage",
    "correctionData",
    "correctionStatus",
    "clicks",
    "poib",
    "groupCenter",
    "score",
    "scoreValue",
    "rawScore",
    "qualityPossible",
    "trainingManualResult"
  ].forEach(key => delete next[key]);
  return next;
}

function hasIncompatibleAuthorityPackage(record = {}) {
  if (!record || typeof record !== "object") return false;
  const packageToCheck = record.backendAuthorityPackage || record.ugeoAuthorityPackage || record.authorityPackage || null;
  return !!(packageToCheck && !isAuthorityPackageCompatibleWithActiveMission(packageToCheck));
}

function authoritySafeRecord(record = {}) {
  return hasIncompatibleAuthorityPackage(record) ? stripStaleAuthorityFields(record) : { ...record };
}

function clearIncompatibleAuthorityFromSession(candidate) {
  if (!candidate) return candidate;
  if (!hasIncompatibleAuthorityPackage(candidate)) return candidate;
  return {
    ...stripStaleAuthorityFields(candidate),
    matrixSnapshot: candidate.matrixSnapshot || {},
    targetAuthority: candidate.targetAuthority || {},
    shotData: {
      ...(candidate.shotData || {}),
      status: "authority-cleared-for-mission-change",
      score: null,
      scoreValue: null
    }
  };
}

function syncAuthorityDerivedState() {
  backendAuthorityPackage = compatibleAuthorityPackage(backendAuthorityPackage);
  currentClicks = zeroingClicksFromAuthorityPackage(backendAuthorityPackage);
  currentScore = backendScoreValue(backendAuthorityPackage);
  resultsShown = isAuthorityPackageCalculated(backendAuthorityPackage)
    || isGovernedConfirmationEvidenceResult(backendAuthorityPackage);
}

function isGovernedConfirmationEvidenceResult(authorityPackage) {
  return !!(
    isZeroingAuthorityPackage(authorityPackage)
    && String(authorityPackage.phase || "") === "confirmation"
    && authorityPackage.validation
    && authorityPackage.validation.evidenceStatus === "recorded"
  );
}

function zeroingClicksFromAuthorityPackage(authorityPackage) {
  if (!authorityPackage || isNonZeroingAuthorityPackage(authorityPackage)) return null;
  if (!authorityPackage.clicks) return null;
  if (isMfamZeroingAuthoritySession() && authorityPackage.mechanicalValidation?.status !== "calculated") return null;
  const correction = authorityPackage.correction || {};
  const clicks = authorityPackage.clicks || {};
  return {
    ...clicks,
    elevation: correction.elevation,
    windage: correction.windage,
    poib: authorityPackage.poib,
    authorityPackage
  };
}

function isAuthorityPackageCalculated(authorityPackage) {
  if (!authorityPackage) return false;
  if (isDotTortureTrainingPackage(authorityPackage)) {
    return authorityPackage.ok === true && ["created", "calculated"].includes(String(authorityPackage.status || ""));
  }
  if (isGssfAuthorityPackage(authorityPackage)) {
    const classifications = backendHitClassifications(authorityPackage);
    const render = authorityPackage.renderCoordinates || {};
    const renderHits = Array.isArray(render.hits) ? render.hits : [];
    return authorityPackage.ok === true
      && authorityPackage.status === "calculated"
      && (classifications.length > 0 || renderHits.length > 0);
  }
  if (isZeroingAuthorityPackage(authorityPackage)) {
    return !!(
      authorityPackage.status
      && (
        authorityPackage.status.hasCorrection
        || authorityPackage.status.hasResult
        || (authorityPackage.status.hasAim && authorityPackage.status.hasPOIB && Number(authorityPackage.status.impactCount) > 0)
      )
    );
  }
  return !!(authorityPackage.status && authorityPackage.status.hasCorrection);
}

function currentSetupName() {
  if (!matrix) return "Choose a setup for this target";
  const weapon = SCZN3M4.weaponProfileDisplay ? SCZN3M4.weaponProfileDisplay(matrix) : null;
  return weapon ? weapon.summary : [matrix.weaponCategory, matrix.weaponManufacturer, matrix.weaponModelType, matrix.weaponModelCaliber].filter(Boolean).join(" / ");
}

function currentSetupMeta() {
  if (!matrix || !SCZN3M4.weaponProfileDisplay) return "";
  const weapon = SCZN3M4.weaponProfileDisplay(matrix);
  return [weapon.frameCategory, weapon.barrelLength, weapon.sightRadius, weapon.variantFlags]
    .filter(Boolean)
    .join(" / ");
}

  renderMissionWorkspaceChrome();
}

function defaultTargetMatrix() {

function parseTrainingTimeInput(value) {
  const raw = String(value || "").trim();
  if (!raw) return { ok: true, seconds: null, display: "optional/pending" };
  const clock = raw.match(/^(\d+):([0-5]\d)$/);
  if (clock) {
    const minutes = Number(clock[1]);
    const seconds = Number(clock[2]);
    return { ok: true, seconds: (minutes * 60) + seconds, display: `${minutes}:${String(seconds).padStart(2, "0")}` };
  }
  if (/^\d+(\.\d+)?$/.test(raw) && Number(raw) >= 0) {
    const seconds = Number(raw);
    return { ok: true, seconds, display: `${seconds} sec` };
  }
  return { ok: false, message: "Time must be seconds or mm:ss." };
}

function readTrainingStageScores() {
  const inputs = Array.from(document.querySelectorAll(".training-stage-score-input"));
  const hasAnyStageScore = inputs.some(input => String(input.value || "").trim() !== "");
  if (!hasAnyStageScore) return { ok: true, stageScores: null, total: null };
  const stageScores = [];
  for (const input of inputs) {
    const raw = String(input.value || "").trim();
    const label = input.dataset.stageLabel || "Stage";
    const max = Number(input.dataset.stageMax || 0);
    if (!raw) return { ok: false, message: "Enter all stage scores or use Total Score." };
    if (!/^\d+$/.test(raw)) return { ok: false, message: `${label} score must be a whole number from 0 to ${max}.` };
    const score = Number(raw);
    if (score < 0 || score > max) return { ok: false, message: `${label} score must be between 0 and ${max}.` };
    stageScores.push({
      stageIndex: Number(input.dataset.stageIndex || stageScores.length),
      label,
      score,
      max
    });
  }
  return {
    ok: true,
    stageScores,
    total: stageScores.reduce((sum, stage) => sum + stage.score, 0)
  };
}

function readTrainingManualResult({ requireScore = false } = {}) {
  const maxScore = trainingMaxScore();
  const scoreInput = document.getElementById("trainingManualScore");
  const missesInput = document.getElementById("trainingManualMisses");
  const timeInput = document.getElementById("trainingManualTime");
  const notesInput = document.getElementById("trainingManualNotes");
  const stageRead = readTrainingStageScores();
  if (!stageRead.ok) return stageRead;
  const scoreRaw = String(scoreInput ? scoreInput.value : "").trim();
  let score = stageRead.stageScores ? stageRead.total : null;
  if (score === null && !scoreRaw) {
    return requireScore
      ? { ok: false, message: `Enter a score from 0 to ${maxScore}.` }
      : { ok: true, result: null };
  }
  if (score === null) {
    if (!/^\d+$/.test(scoreRaw)) return { ok: false, message: `Score must be a whole number from 0 to ${maxScore}.` };
    score = Number(scoreRaw);
  }
  if (score < 0 || score > maxScore) return { ok: false, message: `Score must be between 0 and ${maxScore}.` };
  const missesRaw = String(missesInput ? missesInput.value : "").trim();
  let misses = null;
  if (missesRaw) {
    if (!/^\d+$/.test(missesRaw)) return { ok: false, message: "Misses must be zero or greater." };
    misses = Number(missesRaw);
  }
  const parsedTime = parseTrainingTimeInput(timeInput ? timeInput.value : "");
  if (!parsedTime.ok) return parsedTime;
  const notes = String(notesInput ? notesInput.value : "").trim();
  return {
    ok: true,
    result: {
      status: "manual",
      score,
      maxScore,
      percentage: trainingPercentage(score, maxScore),
      scoreSource: stageRead.stageScores ? "stageScores" : "totalScore",
      stageScores: stageRead.stageScores || [],
      misses,
      timeSeconds: parsedTime.seconds,
      timeDisplay: parsedTime.display,
      notes,
      source: "manual"
    }
  };
}

function bindDistanceControl() {
  const distanceInput = document.getElementById("targetDistance");
  if (!distanceInput) return;
  const otherInput = document.getElementById("targetDistanceOther");
  distanceInput.addEventListener("change", () => {
    if (distanceLocked) return;
    if (distanceInput.value === "Other") {
      selectedDistanceValue = "";
      otherInput.classList.remove("is-hidden");
      otherInput.value = "";
      otherInput.focus();
    } else {
      selectedDistanceValue = distanceInput.value;
      otherInput.classList.add("is-hidden");
      otherInput.value = "";
    }
    updateDistanceDisplay();
    invalidateCorrectionContext();
  });
  if (otherInput) {
    otherInput.addEventListener("input", () => {
      otherInput.value = otherInput.value.replace(/\D/g, "");
      selectedDistanceValue = otherInput.value;
      updateDistanceDisplay();
      invalidateCorrectionContext();
    });
  }
  document.querySelectorAll("[data-target-distance-unit]").forEach(button => {
    button.addEventListener("click", () => {
      if (distanceLocked) return;
      selectedDistanceUnit = button.dataset.targetDistanceUnit;
      document.querySelectorAll("[data-target-distance-unit]").forEach(item => {
        const selected = item === button;
        item.classList.toggle("is-active", selected);
        item.setAttribute("aria-pressed", String(selected));
        item.textContent = `${item.dataset.targetDistanceUnit}${selected ? " ✓" : ""}`;
      });
      updateDistanceDisplay();
      invalidateCorrectionContext();
    });
  });
  document.querySelectorAll("[data-target-adjustment-unit]").forEach(button => {
    button.addEventListener("click", () => {
      selectedAdjustmentUnit = button.dataset.targetAdjustmentUnit === "MRAD" ? "MRAD" : "MOA";
      document.querySelectorAll("[data-target-adjustment-unit]").forEach(item => {
        const selected = item === button;
        item.classList.toggle("is-active", selected);
        item.setAttribute("aria-pressed", String(selected));
        item.textContent = `${item.dataset.targetAdjustmentUnit}${selected ? " ✓" : ""}`;
      });
      invalidateCorrectionContext();
    });
  });
  updateDistanceDisplay();
}

function correctionContextSnapshot(authorityPackage = backendAuthorityPackage) {
  const source = session && session.matrixSnapshot || matrix || {};
  const model = authorityPackage && authorityPackage.mechanicalValidation
    ? authorityPackage.mechanicalValidation.model || {}
    : {};
  const opticType = String(source.opticType || source.opticModel || source.adjustmentSystem || "").toLowerCase();
  const sightSystem = selectedSightSystem || (
    opticType.includes("iron") || opticType.includes("m4_iron") ? "iron" : "optic"
  );
  return {
    sightSystem,
    sightLabel: sightSystem === "iron" ? "Iron Sight" : "Optic",
    distanceValue: Number(selectedDistanceValue || 0),
    distanceUnit: selectedDistanceUnit === "M" ? "M" : "YDS",
    adjustmentUnit: selectedAdjustmentUnit === "MRAD" ? "MRAD" : "MOA",
    equipmentAuthorityRecordId: String(
      model.equipmentAuthorityRecordId
      || source.equipmentAuthorityRecordId
      || source.mechanicalSightAuthorityId
      || source.sightAuthorityId
      || ""
    ),
    opticIdentity: sightSystem === "optic"
      ? [source.opticType, source.opticBrand, source.opticModel].filter(Boolean).join("|")
      : "",
    opticClickValue: sightSystem === "optic"
      ? Number(
        source.opticClickValue
        || (selectedAdjustmentUnit === "MRAD" ? source.opticClickValueMRAD : source.opticClickValueMOA)
        || 0
      )
      : null
  };
}

function correctionContextFingerprint(authorityPackage = backendAuthorityPackage) {
  const context = correctionContextSnapshot(authorityPackage);
  if (window.SCZN3ZeroingPlatform) {
    return window.SCZN3ZeroingPlatform.contextFingerprint({
      ...context,
      distance: context.distanceValue,
      sightAuthorityId: context.equipmentAuthorityRecordId
    });
  }
  return JSON.stringify(context);
}

function correctionContextIsAuthoritative(authorityPackage = backendAuthorityPackage) {
  const context = correctionContextSnapshot(authorityPackage);
  return !!(
    Number.isFinite(context.distanceValue)
    && context.distanceValue > 0
    && authorityPackage
    && authorityPackage.clicks
    && authorityPackage.mechanicalValidation
    && authorityPackage.mechanicalValidation.status === "calculated"
  );
}

function correctionContextIsConfirmed(authorityPackage = backendAuthorityPackage) {
  return !!(
    correctionContextConfirmedFingerprint
    && correctionContextConfirmedFingerprint === correctionContextFingerprint(authorityPackage)
    && correctionContextIsAuthoritative(authorityPackage)
  );
}

function correctionUnavailableShooterMessage(authorityPackage = backendAuthorityPackage) {
  const context = correctionContextSnapshot(authorityPackage);
  if (!Number.isFinite(context.distanceValue) || context.distanceValue <= 0) {
    return "Enter the firing distance, then tap Confirm.";
  }
  if (context.sightSystem === "optic" && (!Number.isFinite(context.opticClickValue) || context.opticClickValue <= 0)) {
    return "The optic adjustment value is missing. Return to Equipment Library, complete the optic setup, then try again.";
  }
  if (context.sightSystem === "iron" && !context.equipmentAuthorityRecordId) {
    return "Your group measurement is ready. Select the M4 iron-sight setup in Equipment, then try again to receive Sight Correction.";
  }
  if (!authorityPackage || !authorityPackage.clicks || authorityPackage.mechanicalValidation?.status !== "calculated") {
    return "Your group measurement is ready. Review the sight setup in Equipment, then try again to receive Sight Correction.";
  }
  return "A correction could not be calculated from this group. Check the session setup and try Show Results again.";
}

function remainingCorrectionShooterMessage(authorityPackage = backendAuthorityPackage) {
  const clicks = authorityPackage && authorityPackage.clicks;
  if (!clicks) {
    return "Review the session setup before firing another confirmation group.";
  }
  const axes = ["windage", "elevation"].map(axis => {
    const direction = String(clicks[`${axis}Direction`] || "CENTER").trim().toUpperCase();
    const count = Math.abs(Number(clicks[`${axis}Clicks`] || 0));
    if (!Number.isFinite(count) || count <= 0 || direction === "CENTER") return "";
    const readableDirection = direction.charAt(0) + direction.slice(1).toLowerCase();
    return `${readableDirection} ${count} ${count === 1 ? "click" : "clicks"}`;
  }).filter(Boolean);
  if (!axes.length) {
    return "Fire and tap another confirmation group.";
  }
  return `Apply the remaining correction: ${axes.join(" · ")}. Then fire and tap another confirmation group.`;
}

function correctionContextEvidenceX(authorityPackage = backendAuthorityPackage) {
  const points = currentImpactPoints.map(safePoint).filter(Boolean);
  const poib = safePoint(authorityPackage && (
    authorityPackage.poib
    || authorityPackage.renderCoordinates && authorityPackage.renderCoordinates.poib
  ));
  if (poib) points.push(poib);
  if (!points.length) return 50;
  return points.reduce((sum, point) => sum + Number(point.xPercent), 0) / points.length;
}

      : correctionContextPending || !!correctionContextConfirmedFingerprint
  );
  drawer.hidden = !available;
  if (!available) return;
  const context = correctionContextSnapshot();
  const sight = document.getElementById("correctionContextSight");
  const distance = document.getElementById("correctionContextDistance");
  const distanceUnit = document.getElementById("correctionContextDistanceUnit");
  const adjustmentUnit = document.getElementById("correctionContextAdjustmentUnit");
  if (sight && document.activeElement !== sight) sight.value = context.sightSystem;
  if (distance && document.activeElement !== distance) distance.value = String(context.distanceValue || "");
  if (distanceUnit && document.activeElement !== distanceUnit) distanceUnit.value = context.distanceUnit;
  if (adjustmentUnit && document.activeElement !== adjustmentUnit) adjustmentUnit.value = context.adjustmentUnit;
  if (adjustmentUnit) {
    const mrad = adjustmentUnit.querySelector('option[value="MRAD"]');
    if (mrad) mrad.disabled = !FOUNDER_WORKSPACE_TEST_MODE && context.sightSystem === "iron";
  }
  const confirm = document.getElementById("confirmCorrectionContext");
  if (confirm) {
    confirm.disabled = correctionContextRefreshing || !Number.isFinite(context.distanceValue) || context.distanceValue <= 0;
    confirm.textContent = correctionContextRefreshing
      ? (resultsShown ? "Updating…" : "Calculating…")
      : FOUNDER_WORKSPACE_TEST_MODE
        ? (resultsShown ? "Update Results" : "Show Results")
        : "Confirm";
  }
  if (founderGate || correctionContextPending) drawer.open = true;
  placeCorrectionContextDrawer();
}

function syncCorrectionContextGate() {
  if (FOUNDER_WORKSPACE_TEST_MODE && isM4AuthoritySession()) {
    correctionContextPending = false;
    renderCorrectionContextDrawer();
    return;
  }
  if (!isM4AuthoritySession() || !resultsShown || !currentClicks) {
    renderCorrectionContextDrawer();
    return;
  }
  correctionContextPending = !correctionContextIsConfirmed(backendAuthorityPackage);
  renderCorrectionContextDrawer();
}

function invalidateCorrectionContext() {
  markWorkspaceProgressUnsaved();

    correctionContextPending = false;
    correctionContextConfirmedFingerprint = "";
    sessionSaved = false;
    persistCorrectionContextSelection();
    renderCorrectionContextDrawer();
    renderMarkStatus();
    return;
  }
  correctionContextConfirmedFingerprint = "";
  correctionContextPending = !!(isM4AuthoritySession() && resultsShown && currentClicks);
  sessionSaved = false;
  if (correctionContextPending) {
    setSaveSessionStatus("Review the session setup to refresh the correction.");
  }

function persistCorrectionContextSelection() {
  if (!session && !ensureTargetSession()) return;
  const source = { ...(session && session.matrixSnapshot || matrix || {}) };
  const previousOpticType = String(source.opticType || "");
  const nextOpticType = selectedSightSystem === "iron"
    ? "Iron Sights"
    : (!previousOpticType.toLowerCase().includes("iron") && previousOpticType ? previousOpticType : "Optic");
  const nextMatrix = {
    ...source,
    opticType: nextOpticType,
    opticAdjustmentUnit: selectedAdjustmentUnit,
    targetDistance: `${selectedDistanceValue} ${selectedDistanceUnit === "M" ? "m" : "yds"}`,
    targetDistanceValue: String(selectedDistanceValue),
    targetDistanceUnit: selectedDistanceUnit
  };
  matrix = { ...(matrix || {}), ...nextMatrix };
  session = SCZN3M4.updateActiveSession({
    matrixSnapshot: nextMatrix,
    targetDistance: nextMatrix.targetDistance,
    targetDistanceValue: nextMatrix.targetDistanceValue,
    targetDistanceUnit: nextMatrix.targetDistanceUnit,
    correctionContextConfirmedFingerprint: "",
    correctionContextSnapshot: correctionContextSnapshot(null)
  }) || session;
}

async function confirmCorrectionContext() {
  if (correctionContextRefreshing) return;
  const context = correctionContextSnapshot();
  if (!Number.isFinite(context.distanceValue) || context.distanceValue <= 0) return;
  correctionContextRefreshing = true;
  renderCorrectionContextDrawer();
  persistCorrectionContextSelection();
  try {
    const authorityPackage = await requestBackendAuthority();
    applyBackendAuthorityPackage(authorityPackage);
    if (!FOUNDER_WORKSPACE_TEST_MODE && !correctionContextIsAuthoritative(authorityPackage)) {
      correctionContextPending = true;
      authorityStatusMessage = correctionUnavailableShooterMessage(authorityPackage);
      setSaveSessionStatus(authorityStatusMessage, "error");
      return;
    }
    correctionContextConfirmedFingerprint = correctionContextFingerprint(authorityPackage);
    correctionContextPending = false;
    correctionContextReviewDismissed = false;
    session = SCZN3M4.updateActiveSession({
      correctionContextConfirmedFingerprint,
      correctionContextSnapshot: correctionContextSnapshot(authorityPackage)
    }) || session;
    if (zeroingLivePhase === "confirmation" && authorityPackage.validation) {
      setSaveSessionStatus(
        authorityPackage.validation.confirmed
          ? "Confirmation complete."
          : remainingCorrectionShooterMessage(authorityPackage),
        authorityPackage.validation.confirmed ? "saved" : ""
      );
    } else {
      setSaveSessionStatus("");
    }
    const drawer = document.getElementById("correctionContextDrawer");
    if (drawer) drawer.open = false;
  } catch (error) {
    console.warn("Correction context authority refresh failed", error);
    correctionContextPending = true;
    authorityStatusMessage = "The correction could not be refreshed. Your impacts remain on this screen; check the session setup and try again.";
    setSaveSessionStatus(authorityStatusMessage, "error");
  } finally {
    correctionContextRefreshing = false;
    renderMarkers();
    renderResults();
    renderMarkStatus();
    renderCorrectionContextDrawer();
  }
}

    reader.onload = () => resolve(reader.result);

    reader.readAsDataURL(file);
  });
}

function downsizeImageDataUrl(dataUrl, maxSize = 1200) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
      if (scale >= 1) {
        resolve(dataUrl);
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.86));
    };
    image.onerror = () => resolve(dataUrl);
    image.src = dataUrl;
  });
}

async function inspectPrecisionTapImage(dataUrl) {
  const encoded = String(dataUrl || "").split(",", 2)[1] || "";
  const binary = atob(encoded);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
  const subtle = globalThis.crypto && globalThis.crypto.subtle;
  const digest = subtle ? await subtle.digest("SHA-256", bytes) : null;
  const sha256 = digest ? [...new Uint8Array(digest)].map(value => value.toString(16).padStart(2, "0")).join("") : "";
  const dimensions = await new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve({ width: image.naturalWidth, height: image.naturalHeight });
    image.onerror = reject;
    image.src = dataUrl;
  });
  return { dataUrl, sha256, ...dimensions };
}

  if (!authorityId || !/^[a-f0-9]{64}$/i.test(sourceHash)) return null;
  return {
    status: String(evidence.registrationStatus),
    authorityId,
    authorityVersion: String(evidence.registrationPackageVersion || ""),
    authoritySource: String(evidence.registrationAuthoritySource || ""),
    sourceImageSha256: sourceHash,
    canonicalAssetSha256: String(evidence.canonicalAssetSha256 || "") || null,
    coordinateSystemVersion: String(evidence.canonicalCoordinateSystemVersion || "") || null,
    registrationEvidenceId: String(evidence.registrationEvidenceId || "") || null,
    globalUncertaintyPx: Number(evidence.registrationGlobalUncertaintyPx) || 0
  };

const TRANSIENT_AUTHORITY_HTTP_STATUSES = new Set([502, 503, 504]);

function waitForAuthorityRetry(delayMs = 250) {
  return new Promise(resolve => window.setTimeout(resolve, delayMs));
}

async function fetchAuthorityResponse(authorityEndpoint, requestOptions) {
  let lastNetworkError = null;
  for (let attempt = 0; attempt < 2; attempt += 1) {
    try {
      const response = await fetch(authorityEndpoint, requestOptions);
      if (response.ok) return response;
      if (attempt === 0 && TRANSIENT_AUTHORITY_HTTP_STATUSES.has(response.status)) {
        await waitForAuthorityRetry();
        continue;
      }
      let failurePackage = null;
      try { failurePackage = await response.clone().json(); } catch (parseError) {}
      const failure = new Error(failurePackage && failurePackage.reason || `authority_http_${response.status}`);
      failure.httpStatus = response.status;
      failure.packageData = failurePackage;
      failure.isAuthorityResponse = true;
      throw failure;
    } catch (error) {
      if (error && error.isAuthorityResponse) throw error;
      lastNetworkError = error;
      if (attempt === 0) {
        await waitForAuthorityRetry();
        continue;
      }
    }
  }
  throw lastNetworkError || new Error("Backend authority request failed");
}

function authorityFailureShooterMessage(error) {
  const status = Number(error && error.httpStatus || 0);
  const reason = String(error && error.packageData && error.packageData.reason || error && error.message || "");
  if (error instanceof TypeError || (!status && !reason)) {
    return "SCZN3 cannot reach the analysis service. Check your connection, then try Show Results again.";
  }
  if (status === 401 || status === 403) {
    return "This session can no longer be verified. Return Home and begin a new session.";
  }
  if (status === 404 || reason.includes("target") && reason.includes("not")) {
    return "Analysis is not available for this target profile. Your confirmed impacts remain on the target.";
  }
  if (status === 409) {
    return "The session or target requirements changed. Review the session setup, then try Show Results again.";
  }
  if (status === 422 || reason.includes("evidence") || reason.includes("impact")) {
    return "The confirmed target evidence is incomplete. Review the aim point and impacts, then try Show Results again.";
  }
  if (status >= 500) {
    return "The analysis service is temporarily unavailable. Your confirmed impacts are preserved. Try again shortly.";
  }
  if (reason === "authority_response_invalid" || reason === "invalid_response") {
    return "The analysis service returned an incomplete result. Your confirmed impacts are preserved. Try again.";
  }
  return "Results could not be calculated. Your confirmed impacts are preserved. Try Show Results again.";
}

async function requestBackendAuthority() {
  const requestPayload = backendAuthorityRequest();
  const requestBody = JSON.stringify(requestPayload);
  const exactWireRequest = JSON.parse(requestBody);
  const authorityEndpoint = isMfamZeroingAuthoritySession()
    ? SCZN3M4.M4_AUTHORITY_ENDPOINT
    : BACKEND_AUTHORITY_ENDPOINT;
  if (activeShowResultsTiming) activeShowResultsTiming.requestSentAt = Date.now();
  const response = await fetchAuthorityResponse(authorityEndpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: requestBody
  });
  if (activeShowResultsTiming) {
    activeShowResultsTiming.responseReturnedAt = Date.now();
    activeShowResultsTiming.backendReceivedAt = Number(response.headers.get("X-SCZN3-Authority-Received-At")) || null;
    activeShowResultsTiming.serverTiming = response.headers.get("Server-Timing") || "";
  }
  const responseBody = await response.text();
  const authorityPackage = JSON.parse(responseBody);
  if (GSSF_CANONICAL_EXPORT_ENABLED && isGssfAuthoritySession()) {
    gssfCanonicalValidationTransaction = {
      evidenceType: "SCZN3 GSSF canonical-session diagnostic validation evidence",
      evidenceStatus: "diagnostic_only",
      observationSemantics: "xPx/yPx are ordered observation locations on the exact registered canonical asset; they are not scoring coordinates.",
      authorityChain: [
        "registered_asset_observation",
        "registration_package_transform",
        "geometry_profile_canonical_inches",
        "spatial_classification",
        "scoring_profile",
        "mission_profile",
        "result_package",
        "universal_sec"
      ],
      request: exactWireRequest,
      response: JSON.parse(responseBody)
    };
    window.__SCZN3_GSSF_CANONICAL_VALIDATION_EVIDENCE__ = gssfCanonicalValidationTransaction;
  }
  authorityPackage.frontendRequest = requestPayload;
  return authorityPackage;
}

async function resolveMissionFromTargetProfile() {
  if (!TARGET_PROFILE_LAUNCH_ID) return;
  if (SESSION_ROUTE_MISS) {
    renderMissionResolutionState();
    renderMarkStatus();
    return;
  }
  missionResolutionStatus = "resolving";
  missionResolutionMessage = "Loading target...";
  backendAuthorityPackage = null;
  syncAuthorityDerivedState();
  renderMissionResolutionState();
  try {
    if (!session && !ensureTargetSession()) return;
    if (isM16A2AuthoritySession()) {
      ensureTargetAttribution();
      missionResolutionStatus = "resolved";
      missionResolutionMessage = "";
      const evidence = activeEvidence();
      if (evidence) renderEvidencePreview(evidence);
      setMode(currentAimPoint ? "impact" : "aim");
      renderSetupSummary();
      renderResults();
      renderMarkStatus();
      return;
    }
    if (isM4AuthoritySession()) {
      ensureTargetAttribution();
      const evidence = installM4CanonicalEvidence();
      missionResolutionStatus = "resolved";
      missionResolutionMessage = "";
      renderEvidencePreview(evidence);
      setMode("aim");
      renderSetupSummary();
      renderResults();
      renderMarkStatus();
      return;
    }
    if (isGssfAuthoritySession()) {
      const evidence = installGssfCanonicalEvidence();
      missionResolutionStatus = "resolved";
      missionResolutionMessage = "";
      renderEvidencePreview(evidence);
      setMode("impact");
      renderSetupSummary();
      renderResults();
      renderMarkStatus();
      return;
    }
    if (isBaker100YardSession()) {
      const evidence = installBaker100YardEvidence();
      missionResolutionStatus = "resolved";
      missionResolutionMessage = "";
      renderEvidencePreview(evidence);
      setMode("aim");
      renderSetupSummary();
      renderResults();
      renderMarkStatus();
      return;
    }
    const authorityPackage = await requestBackendAuthority();
    applyBackendAuthorityPackage(authorityPackage);
    if (!backendAuthorityPackage) {
      throw new Error("Backend returned incompatible mission package");
    }
    missionResolutionStatus = "resolved";
    missionResolutionMessage = "";
    renderEvidencePreview(activeEvidence());
    setMode(isGssfAuthoritySession() ? "impact" : (currentAimPoint ? "impact" : "aim"));
    renderSetupSummary();
    renderResults();
    renderMarkStatus();
  } catch (error) {
    console.warn("Mission resolution failed", error);
    backendAuthorityPackage = null;
    syncAuthorityDerivedState();
    missionResolutionStatus = "unavailable";
    missionResolutionMessage = "Unable to load this target. Try again.";
    renderMissionResolutionState();
  }
}

function correctionAxisDisplay(clicks, axis) {
  const direction = String(clicks && clicks[`${axis}Direction`] || "CENTER").toUpperCase();
  const count = Math.abs(Number(clicks && clicks[`${axis}Clicks`] || 0));
  const arrows = {
    LEFT: "←",
    RIGHT: "→",
    UP: "↑",
    DOWN: "↓",
    CENTER: "•"
  };
  return {
    direction,
    arrow: arrows[direction] || "•",
    count: Number.isFinite(count) ? count : 0,
    unit: Number.isFinite(count) && count === 1 ? "click" : "clicks"
  };
}

function correctionEstimateAxisDisplay(authorityPackage, axis) {
  const estimate = authorityPackage && authorityPackage.correctionEstimate;
  const assessment = estimate && estimate.axisAssessments && estimate.axisAssessments[axis];
  const best = assessment && assessment.bestEstimate;
  if (!assessment || !best) return null;
  if (assessment.practicalFinding === "centered_within_one_click") {
    return { direction: "CENTERED", arrow: "•", count: 0, unit: "within 1 click" };
  }
  const exact = correctionAxisDisplay({
    [`${axis}Direction`]: best.direction,
    [`${axis}Clicks`]: best.clicks,
  }, axis);
  const minimum = Number(assessment.minimumClicks);
  const maximum = Number(assessment.maximumClicks);
  const range = Number.isFinite(minimum) && Number.isFinite(maximum)
    ? `${minimum}–${maximum} possible`
    : "exact count withheld";
  return { ...exact, unit: `estimate · ${range}` };
}

    value = Math.floor(value / 26);

}

function renderGridCoordinateOverlay() {
  const layer = document.getElementById("gridCoordinateLayer");
  if (!layer) return;
  if (!showGridCoordinates) {
    layer.textContent = "";
    layer.classList.remove("is-visible");
    return;
  }
  const grid = BAKER_GRID_AUDIT;
  const left = (grid.leftPx / grid.imageWidth) * 100;
  const top = (grid.topPx / grid.imageHeight) * 100;
  const width = ((grid.rightPx - grid.leftPx) / grid.imageWidth) * 100;
  const height = ((grid.bottomPx - grid.topPx) / grid.imageHeight) * 100;
  const columns = Math.round((grid.rightPx - grid.leftPx) / grid.squarePx);
  const rows = Math.round((grid.bottomPx - grid.topPx) / grid.squarePx);
  const columnLabels = Array.from({ length: columns }, (_, index) => {
    const x = left + (((index + 0.5) / columns) * width);
    return `<span class="grid-coordinate-label grid-column-label" style="left:${x}%;top:${top}%">${columnLabel(index)}</span>`;
  }).join("");
  const rowLabels = Array.from({ length: rows }, (_, index) => {
    const y = top + (((index + 0.5) / rows) * height);
    return `<span class="grid-coordinate-label grid-row-label" style="left:${left}%;top:${y}%">${index + 1}</span>`;
  }).join("");
  layer.classList.add("is-visible");
  layer.innerHTML = `
    <div class="grid-coordinate-box" style="left:${left}%;top:${top}%;width:${width}%;height:${height}%"></div>
    ${columnLabels}
    ${rowLabels}`;
}
