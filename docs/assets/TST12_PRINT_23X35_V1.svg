<svg xmlns="http://www.w3.org/2000/svg" width="23in" height="35in" viewBox="0 0 23 35" role="img" aria-labelledby="title desc">
  <title id="title">TST-12 23 by 35 practice target</title>
  <desc id="desc">Twelve numbered stations arranged in a three by four grid. Station labels are BOTH, RE, LE, RHS, LHO, RHO, and LHS.</desc>
  <rect width="23" height="35" fill="#fffdf7"/>
  <defs>
    <pattern id="qrc-placeholder" width=".145" height=".145" patternUnits="userSpaceOnUse">
      <rect width=".145" height=".145" fill="#fffdf7"/>
      <path d="M0 0H.092V.046H.046V.092H0ZM.099.072H.145V.145H.072V.099H.099Z" fill="#17191d"/>
    </pattern>
    <g id="station" fill="none" stroke="#17191d">
    <rect width="6.5" height="6.5" stroke-width=".092"/>
    <circle cx="3.25" cy="3.25" r="1.095" fill="#d92f38" stroke="none"/>
    <circle cx="3.25" cy="3.25" r="1.437" stroke-width=".137"/>
    <circle cx="3.25" cy="3.25" r="1.806" stroke-width=".137"/>
    <circle cx="3.25" cy="3.25" r="2.175" stroke-width=".137"/>
    <circle cx="3.25" cy="3.25" r="2.544" stroke-width=".137"/>
    <path d="M2.839 3.25H3.661M3.25 2.839V3.661" stroke="#f7dc4c" stroke-width=".103"/>
    </g>
  </defs>
  <!-- Approved Baker face identity: presentation only; target geometry remains unchanged below. -->
  <g aria-label="Baker Targets identity" font-family="Arial, sans-serif" font-weight="900">
    <g transform="translate(0.56 0.72)" fill="none" stroke="#17191d" stroke-width=".075">
      <circle cx=".27" cy="0" r=".25"/><path d="M.27 -.37V-.11M.27 .11V.37M-.1 0H.15M.39 0H.64" stroke="#d92f38"/>
    </g>
    <text x="1.2400000000000002" y="0.72" fill="#17191d" font-size="0.54" letter-spacing="-.02">Baker<tspan fill="#d92f38">Targets</tspan></text>
    <text x="11.5" y="0.76" fill="#17191d" font-size="0.6" letter-spacing=".005" text-anchor="middle">THIS TARGET<tspan fill="#d92f38"> CAN TALK</tspan></text>
    <path d="M15.2 0.51q.20 .22 0 .44M15.399999999999999 0.43q.31 .31 0 .66" fill="none" stroke="#d92f38" stroke-width=".075"/>
    <g aria-label="QRC placeholder" text-anchor="middle">
      <rect x="20.65" y="0.2" width="1" height="1" fill="url(#qrc-placeholder)" stroke="#d92f38" stroke-width=".055"/>
      <text x="21.15" y="1.3399999999999999" fill="#17191d" font-size="0.10800000000000001" letter-spacing=".02">QRC</text>
      <text x="21.15" y="1.45" fill="#17191d" font-size="0.10800000000000001" letter-spacing=".02">PLACEHOLDER</text>
    </g>
  </g>
  <g aria-label="Stations">
    <use href="#station" x="1.25" y="1.5"/><use href="#station" x="8.25" y="1.5"/><use href="#station" x="15.25" y="1.5"/>
    <use href="#station" x="1.25" y="9.25"/><use href="#station" x="8.25" y="9.25"/><use href="#station" x="15.25" y="9.25"/>
    <use href="#station" x="1.25" y="17"/><use href="#station" x="8.25" y="17"/><use href="#station" x="15.25" y="17"/>
    <use href="#station" x="1.25" y="24.75"/><use href="#station" x="8.25" y="24.75"/><use href="#station" x="15.25" y="24.75"/>
  </g>
  <g aria-label="Eye instruction by station column" fill="#17191d" font-family="Arial, sans-serif" font-size=".55" font-weight="700" text-anchor="middle">
    <text x="4.5" y="1.30">BOTH</text><text x="11.5" y="1.30">RE</text><text x="18.5" y="1.30">LE</text>
  </g>
  <g aria-label="Hand instruction by station row" fill="#17191d" font-family="Arial, sans-serif" font-size=".50" font-weight="700" text-anchor="middle">
    <text x=".65" y="4.75" transform="rotate(-90 .65 4.75)">RHS</text><text x=".65" y="12.5" transform="rotate(-90 .65 12.5)">LHO</text><text x=".65" y="20.25" transform="rotate(-90 .65 20.25)">RHO</text><text x=".65" y="28" transform="rotate(-90 .65 28)">LHS</text>
  </g>
  <g fill="#fffdf7" stroke="#17191d" stroke-width=".05">
    <rect x="6.43" y="6.65" width="1.15" height=".82" rx=".1"/><rect x="13.43" y="6.65" width="1.15" height=".82" rx=".1"/><rect x="20.43" y="6.65" width="1.15" height=".82" rx=".1"/>
    <rect x="6.43" y="14.4" width="1.15" height=".82" rx=".1"/><rect x="13.43" y="14.4" width="1.15" height=".82" rx=".1"/><rect x="20.43" y="14.4" width="1.15" height=".82" rx=".1"/>
    <rect x="6.43" y="22.15" width="1.15" height=".82" rx=".1"/><rect x="13.43" y="22.15" width="1.15" height=".82" rx=".1"/><rect x="20.43" y="22.15" width="1.15" height=".82" rx=".1"/>
    <rect x="6.43" y="29.9" width="1.15" height=".82" rx=".1"/><rect x="13.43" y="29.9" width="1.15" height=".82" rx=".1"/><rect x="20.43" y="29.9" width="1.15" height=".82" rx=".1"/>
  </g>
  <g fill="#17191d" font-family="Arial, sans-serif" font-size=".63" font-weight="700" text-anchor="middle">
    <text x="7.005" y="7.27">1</text><text x="14.005" y="7.27">2</text><text x="21.005" y="7.27">3</text>
    <text x="7.005" y="15.02">4</text><text x="14.005" y="15.02">5</text><text x="21.005" y="15.02">6</text>
    <text x="7.005" y="22.77">7</text><text x="14.005" y="22.77">8</text><text x="21.005" y="22.77">9</text>
    <text x="7.005" y="30.52">10</text><text x="14.005" y="30.52">11</text><text x="21.005" y="30.52">12</text>
  </g>
  <!-- Legend only: no footer instructions, session fields, or presentation diagnostics. -->
  <g aria-label="Target abbreviation legend" font-family="Arial, sans-serif" font-weight="700" fill="#17191d" text-anchor="middle">
    <rect x="0.13" y="31.58" width="22.74" height="3.15" fill="#f1f1ef" stroke="#17191d" stroke-width=".03"/>
    <text x="11.5" y="32.65" font-size="0.2">BOTH = Both Eyes   |   RE = Right Eye   |   LE = Left Eye</text>
    <text x="11.5" y="33.18" font-size="0.17">RHS = Right-Hand Supported   |   LHO = Left-Hand Only</text>
    <text x="11.5" y="33.65" font-size="0.17">RHO = Right-Hand Only   |   LHS = Left-Hand Supported</text>
  </g>
