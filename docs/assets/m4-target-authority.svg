<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" role="img" aria-labelledby="title desc">
  <title id="title">Military 25 Meter M4 Zeroing Target</title>
  <desc id="desc">Tan paper M4 zeroing target representation with black silhouette, numbered grid, sight adjustment block, instruction block, and QR activation zone.</desc>
  <rect width="850" height="1100" fill="#d8c39b"/>
  <rect x="26" y="26" width="798" height="1048" fill="none" stroke="#111" stroke-width="4"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111" text-anchor="middle">
    <text x="425" y="64" font-size="31" font-weight="900">25 METER ZEROING TARGET</text>
    <text x="425" y="91" font-size="18" font-weight="900">M4 CARBINE / 300 METER ZERO</text>
  </g>

  <g transform="translate(56 116)" font-family="Arial, Helvetica, sans-serif" fill="#111">
    <rect width="250" height="104" fill="none" stroke="#111" stroke-width="3"/>
    <text x="12" y="24" font-size="14" font-weight="900">INSTRUCTIONS</text>
    <text x="12" y="46" font-size="12">1. Fire group at center mass.</text>
    <text x="12" y="64" font-size="12">2. Plot group center on grid.</text>
    <text x="12" y="82" font-size="12">3. Apply sight correction.</text>
  </g>

  <g transform="translate(560 116)" font-family="Arial, Helvetica, sans-serif" fill="#111">
    <rect width="232" height="104" fill="none" stroke="#111" stroke-width="3"/>
    <text x="116" y="23" font-size="13" font-weight="900" text-anchor="middle">SCAN TO OPEN</text>
    <text x="116" y="41" font-size="13" font-weight="900" text-anchor="middle">M4 ZEROING SYSTEM</text>
    <g transform="translate(16 52)">
      <rect width="44" height="44" fill="#fff" stroke="#111" stroke-width="3"/>
      <path d="M6 6h12v12H6zM26 6h12v12H26zM6 26h12v12H6zM25 25h5v5h-5zM33 26h5v12h-5zM24 34h6v4h-6z" fill="#111"/>
    </g>
    <text x="78" y="80" font-size="11">QR zone remains part</text>
    <text x="78" y="95" font-size="11">of target workflow.</text>
  </g>

  <g transform="translate(85 248)">
    <rect width="680" height="680" fill="#d8c39b" stroke="#111" stroke-width="4"/>
    <g stroke="#111" stroke-width="1" opacity=".62">
      <path d="M45 0v680M90 0v680M135 0v680M180 0v680M225 0v680M270 0v680M315 0v680M360 0v680M405 0v680M450 0v680M495 0v680M540 0v680M585 0v680M630 0v680"/>
      <path d="M0 40h680M0 80h680M0 120h680M0 160h680M0 200h680M0 240h680M0 280h680M0 320h680M0 360h680M0 400h680M0 440h680M0 480h680M0 520h680M0 560h680M0 600h680M0 640h680"/>
    </g>
    <g stroke="#111" stroke-width="3">
      <path d="M340 0v680"/>
      <path d="M0 340h680"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#111" text-anchor="middle">
      <text x="25" y="-8">L21</text><text x="115" y="-8">L15</text><text x="205" y="-8">L9</text><text x="295" y="-8">L3</text>
      <text x="340" y="-8">0</text>
      <text x="385" y="-8">R3</text><text x="475" y="-8">R9</text><text x="565" y="-8">R15</text><text x="655" y="-8">R21</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#111">
      <text x="-30" y="44">U8</text><text x="-30" y="124">U6</text><text x="-30" y="204">U4</text><text x="-30" y="284">U2</text>
      <text x="-18" y="344">0</text>
      <text x="-30" y="424">D2</text><text x="-30" y="504">D4</text><text x="-30" y="584">D6</text><text x="-30" y="664">D8</text>
    </g>

    <path d="M242 186c13-63 56-104 98-104s85 41 98 104c7 36-6 70-32 96-16 15-21 35-11 55 12 24 35 44 58 62 53 42 82 106 72 177-15 104-91 174-185 174s-170-70-185-174c-10-71 19-135 72-177 23-18 46-38 58-62 10-20 5-40-11-55-26-26-39-60-32-96z" fill="#111"/>
    <g fill="none" stroke="#d8c39b" stroke-width="4">
      <circle cx="340" cy="340" r="92"/>
      <circle cx="340" cy="340" r="58"/>
      <circle cx="340" cy="340" r="24"/>
      <path d="M340 222v236M222 340h236"/>
    </g>
    <circle cx="340" cy="340" r="10" fill="#d8c39b"/>
  </g>

  <g transform="translate(64 956)" font-family="Arial, Helvetica, sans-serif" fill="#111">
    <rect width="722" height="76" fill="none" stroke="#111" stroke-width="3"/>
    <text x="16" y="24" font-size="14" font-weight="900">SIGHT ADJUSTMENT REFERENCE</text>
    <text x="16" y="48" font-size="12">Move strike of round toward center of target. Use grid values for correction. Confirm with follow-up group.</text>
    <text x="16" y="65" font-size="12" font-weight="900">TARGET -> QR -> MATRIX -> SHOOT -> CORRECTION -> CONFIRM -> SAVE</text>
  </g>
</svg>
