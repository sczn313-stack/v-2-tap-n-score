<svg xmlns="http://www.w3.org/2000/svg" width="17.5in" height="23in" viewBox="0 0 17.5 23" role="img" aria-labelledby="title desc">
  <title id="title">TST-12 17.5 by 23 practice target</title>
  <desc id="desc">Twelve numbered stations arranged in a three by four grid. Station labels are BOTH, RE, LE, RHS, LHO, RHO, and LHS.</desc>
  <rect width="17.5" height="23" fill="#fffdf7"/>
  <defs>
    <pattern id="qrc-placeholder" width=".11" height=".11" patternUnits="userSpaceOnUse">
      <rect width=".11" height=".11" fill="#fffdf7"/>
      <path d="M0 0H.07V.035H.035V.07H0ZM.075.055H.11V.11H.055V.075H.075Z" fill="#17191d"/>
    </pattern>
    <g id="station" fill="none" stroke="#17191d">
    <rect width="4.75" height="4.75" stroke-width=".067"/>
    <circle cx="2.375" cy="2.375" r=".8" fill="#d92f38" stroke="none"/>
    <circle cx="2.375" cy="2.375" r="1.05" stroke-width=".1"/>
    <circle cx="2.375" cy="2.375" r="1.32" stroke-width=".1"/>
    <circle cx="2.375" cy="2.375" r="1.59" stroke-width=".1"/>
    <circle cx="2.375" cy="2.375" r="1.86" stroke-width=".1"/>
    <path d="M2.075 2.375H2.675M2.375 2.075V2.675" stroke="#f7dc4c" stroke-width=".075"/>
    </g>
  </defs>
  <!-- Approved Baker face identity: presentation only; target geometry remains unchanged below. -->
  <g aria-label="Baker Targets identity" font-family="Arial, sans-serif" font-weight="900">
    <g transform="translate(0.48 0.56)" fill="none" stroke="#17191d" stroke-width=".075">
      <circle cx=".27" cy="0" r=".25"/><path d="M.27 -.37V-.11M.27 .11V.37M-.1 0H.15M.39 0H.64" stroke="#d92f38"/>
    </g>
    <text x="1.1600000000000001" y="0.56" fill="#17191d" font-size="0.43" letter-spacing="-.02">Baker<tspan fill="#d92f38">Targets</tspan></text>
    <text x="8.75" y="0.61" fill="#17191d" font-size="0.48" letter-spacing=".005" text-anchor="middle">THIS TARGET<tspan fill="#d92f38"> CAN TALK</tspan></text>
    <path d="M12.2 0.36q.20 .22 0 .44M12.399999999999999 0.27999999999999997q.31 .31 0 .66" fill="none" stroke="#d92f38" stroke-width=".075"/>
    <g aria-label="QRC placeholder" text-anchor="middle">
      <rect x="15.72" y="0.18" width="0.78" height="0.78" fill="url(#qrc-placeholder)" stroke="#d92f38" stroke-width=".055"/>
      <text x="16.11" y="1.1" fill="#17191d" font-size="0.08600000000000001" letter-spacing=".02">QRC</text>
      <text x="16.11" y="1.21" fill="#17191d" font-size="0.08600000000000001" letter-spacing=".02">PLACEHOLDER</text>
    </g>
  </g>
  <g aria-label="Stations">
    <use href="#station" x=".875" y="1.25"/><use href="#station" x="6.375" y="1.25"/><use href="#station" x="11.875" y="1.25"/>
    <use href="#station" x=".875" y="6.5"/><use href="#station" x="6.375" y="6.5"/><use href="#station" x="11.875" y="6.5"/>
    <use href="#station" x=".875" y="11.75"/><use href="#station" x="6.375" y="11.75"/><use href="#station" x="11.875" y="11.75"/>
    <use href="#station" x=".875" y="17"/><use href="#station" x="6.375" y="17"/><use href="#station" x="11.875" y="17"/>
  </g>
  <g aria-label="Eye instruction by station column" fill="#17191d" font-family="Arial, sans-serif" font-size=".40" font-weight="700" text-anchor="middle">
    <text x="3.25" y="1.10">BOTH</text><text x="8.75" y="1.10">RE</text><text x="14.25" y="1.10">LE</text>
  </g>
  <g aria-label="Hand instruction by station row" fill="#17191d" font-family="Arial, sans-serif" font-size=".38" font-weight="700" text-anchor="middle">
    <text x=".48" y="3.625" transform="rotate(-90 .48 3.625)">RHS</text><text x=".48" y="8.875" transform="rotate(-90 .48 8.875)">LHO</text><text x=".48" y="14.125" transform="rotate(-90 .48 14.125)">RHO</text><text x=".48" y="19.375" transform="rotate(-90 .48 19.375)">LHS</text>
  </g>
  <g fill="#fffdf7" stroke="#17191d" stroke-width=".04">
    <rect x="4.52" y="5.12" width=".94" height=".62" rx=".08"/><rect x="10.02" y="5.12" width=".94" height=".62" rx=".08"/><rect x="15.52" y="5.12" width=".94" height=".62" rx=".08"/>
    <rect x="4.52" y="10.37" width=".94" height=".62" rx=".08"/><rect x="10.02" y="10.37" width=".94" height=".62" rx=".08"/><rect x="15.52" y="10.37" width=".94" height=".62" rx=".08"/>
    <rect x="4.52" y="15.62" width=".94" height=".62" rx=".08"/><rect x="10.02" y="15.62" width=".94" height=".62" rx=".08"/><rect x="15.52" y="15.62" width=".94" height=".62" rx=".08"/>
    <rect x="4.52" y="20.87" width=".94" height=".62" rx=".08"/><rect x="10.02" y="20.87" width=".94" height=".62" rx=".08"/><rect x="15.52" y="20.87" width=".94" height=".62" rx=".08"/>
  </g>
  <g fill="#17191d" font-family="Arial, sans-serif" font-size=".48" font-weight="700" text-anchor="middle">
    <text x="4.99" y="5.6">1</text><text x="10.49" y="5.6">2</text><text x="15.99" y="5.6">3</text>
    <text x="4.99" y="10.85">4</text><text x="10.49" y="10.85">5</text><text x="15.99" y="10.85">6</text>
    <text x="4.99" y="16.1">7</text><text x="10.49" y="16.1">8</text><text x="15.99" y="16.1">9</text>
    <text x="4.99" y="21.35">10</text><text x="10.49" y="21.35">11</text><text x="15.99" y="21.35">12</text>
  </g>
  <!-- Legend only: no footer instructions, session fields, or presentation diagnostics. -->
  <g aria-label="Target abbreviation legend" font-family="Arial, sans-serif" font-weight="700" fill="#17191d" text-anchor="middle">
    <rect x="0.1" y="21.92" width="17.3" height="0.82" fill="#f1f1ef" stroke="#17191d" stroke-width=".03"/>
    <text x="8.75" y="22.14" font-size="0.125">BOTH = Both Eyes   |   RE = Right Eye   |   LE = Left Eye</text>
    <text x="8.75" y="22.38" font-size="0.105">RHS = Right-Hand Supported   |   LHO = Left-Hand Only</text>
    <text x="8.75" y="22.59" font-size="0.105">RHO = Right-Hand Only   |   LHS = Left-Hand Supported</text>
  </g>
</svg>
