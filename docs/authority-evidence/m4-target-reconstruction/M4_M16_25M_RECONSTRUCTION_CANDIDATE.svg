<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 2550 3300"
  data-status="candidate-not-authority" aria-labelledby="title desc">
  <title id="title">Candidate reconstruction — M4/M16 Series Weapons 25M Zero Target</title>
  <desc id="desc">Geometry reconstructed from the rectified Founder photograph and calibrated to U.S. Letter paper. Independent validation is required before authority promotion.</desc>
  <defs>
    <pattern id="gridBlack" width="75" height="75" patternUnits="userSpaceOnUse" x="75" y="225">
      <path d="M75 0H0V75" fill="none" stroke="#444" stroke-width="2.2"/>
    </pattern>
    <pattern id="gridWhite" width="75" height="75" patternUnits="userSpaceOnUse" x="75" y="225">
      <path d="M75 0H0V75" fill="none" stroke="#f7f7f2" stroke-width="2.2"/>
    </pattern>
    <clipPath id="darkDiskClip"><circle cx="1275" cy="1425" r="600"/></clipPath>
    <style>
      .title{font:600 52px "Courier New",monospace;letter-spacing:2px;text-anchor:middle;fill:#202020;stroke:#202020;stroke-width:.25px;paint-order:stroke fill}
      .note{font:38px "Courier New",monospace;letter-spacing:1px;text-anchor:middle;fill:#303030}
      .table{font:25px "Courier New",monospace;letter-spacing:1px;fill:#444}
      .table-center{text-anchor:middle}
      .heavy{fill:none;stroke:#333;stroke-width:10}
      .white-heavy{fill:none;stroke:#f7f7f2;stroke-width:12}
    </style>
  </defs>

  <rect width="2550" height="3300" fill="#f7f7f2"/>
  <text class="title" x="1275" y="105">M4/M16 SERIES WEAPONS 25M ZERO</text>
  <text class="title" x="1275" y="165">SHORT RANGE AND PISTOL MARKSMANSHIP TARGET</text>

  <!-- Candidate controlled geometry: 32 × 32 quarter-inch lattice. -->
  <rect id="target-grid-boundary" x="75" y="225" width="2400" height="2400" fill="none" stroke="#444" stroke-width="3"/>
  <circle id="dark-disk" cx="1275" cy="1425" r="600" fill="#3d3d3d"/>
  <rect x="75" y="225" width="2400" height="2400" fill="url(#gridBlack)"/>
  <rect x="75" y="225" width="2400" height="2400" fill="url(#gridWhite)" clip-path="url(#darkDiskClip)"/>

  <!-- Half-inch radial sequence observed in the calibrated reference. -->
  <circle id="ring-4-00" class="heavy" cx="1275" cy="1425" r="1200"/>
  <circle id="ring-3-50" class="heavy" cx="1275" cy="1425" r="1050"/>
  <circle id="ring-3-00" class="heavy" cx="1275" cy="1425" r="900"/>
  <circle id="ring-2-50" class="heavy" cx="1275" cy="1425" r="750"/>
  <circle id="ring-1-50" class="white-heavy" cx="1275" cy="1425" r="450"/>
  <circle id="ring-1-00" class="white-heavy" cx="1275" cy="1425" r="300"/>
  <circle id="ring-0-75" cx="1275" cy="1425" r="225" fill="none" stroke="#f7f7f2" stroke-width="10" stroke-dasharray="36 28"/>

  <!-- Heavy orthogonal axes reverse to white inside the dark disk. -->
  <path class="heavy" d="M1275 225V2625M75 1425H2475"/>
  <path class="white-heavy" d="M1275 825V2025M675 1425H1875" clip-path="url(#darkDiskClip)"/>
  <path id="center-diamond" d="M1275 1275L1425 1425L1275 1575L1125 1425Z" fill="#f7f7f2"/>

  <text class="note" x="1275" y="2682">WEAPON IS NOT CONSIDERED ZEROED UNTIL CONFIRMED AT TRUE DISTANCE</text>
  <text class="note" x="1275" y="2740">EACH BLOCK REPRESENTS 1 MOA AT 25M</text>

  <!-- Table transcription is preserved as candidate reference content. -->
  <g class="table">
    <rect x="225" y="2780" width="2100" height="390" fill="none" stroke="#555" stroke-width="3"/>
    <path d="M850 2780V3170M1675 2780V3170" fill="none" stroke="#555" stroke-width="2"/>
    <path d="M225 2835H2325M225 2890H2325M225 2945H2325M225 3000H2325M225 3055H2325M225 3110H2325" fill="none" stroke="#777" stroke-width="2"/>
    <text class="table-center" x="537" y="2818">SIGHTING SYSTEM</text>
    <text class="table-center" x="1262" y="2818">ELEVATION in MOA</text>
    <text class="table-center" x="2000" y="2818">WINDAGE in MOA</text>
    <text class="table-center" x="537" y="2874">CCO</text>
    <text class="table-center" x="1262" y="2874">0.5</text>
    <text class="table-center" x="2000" y="2874">0.5</text>
    <text class="table-center" x="537" y="2929">R150 RCO/TA-01</text>
    <text class="table-center" x="1262" y="2929">0.5</text>
    <text class="table-center" x="2000" y="2929">0.5</text>
    <text class="table-center" x="537" y="2984">M4/M4A1 REAR SIGHT (BUIS)</text>
    <text class="table-center" x="1262" y="2984">0</text>
    <text class="table-center" x="2000" y="2984">0.75</text>
    <text class="table-center" x="537" y="3039">M4/M4A1 FRONT SIGHT</text>
    <text class="table-center" x="1262" y="3039">1.75</text>
    <text class="table-center" x="2000" y="3039">0</text>
    <text class="table-center" x="537" y="3094">M16A2/A3/A4 REAR SIGHT (BUIS)</text>
    <text class="table-center" x="1262" y="3094">0</text>
    <text class="table-center" x="2000" y="3094">0.5</text>
    <text class="table-center" x="537" y="3149">M16A2/A3/A4 FRONT SIGHT</text>
    <text class="table-center" x="1262" y="3149">1.25</text>
    <text class="table-center" x="2000" y="3149">0</text>
    <text x="225" y="3220">*Internal knobs .333 MOA</text>
  </g>
</svg>
