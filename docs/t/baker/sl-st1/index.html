<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06070a" />
  <meta name="sczn3-baker-sl-st1-endpoint" content="https://sczn3-authority.onrender.com/api/target/baker-sl-st1/analyze" />
  <title>Silhouette Target (USPSA) · Tap-n-Score</title>
  <link rel="stylesheet" href="../../../styles.css?v=universal-target-controls-6" />
  <link rel="stylesheet" href="../../../universal-ui.css" />
  <link rel="stylesheet" href="../../../m4-sec.css" />
  <link rel="stylesheet" href="../../../sec-universal.css?v=universal-sec-final-gap-1" />
  <link rel="stylesheet" href="../../../experience_frame_processing.css?v=universal-processing-visual-2" />
  <link rel="stylesheet" href="../../../baker-sl-st1-sec.css?v=session-2-uspsa-1" />
  <link rel="stylesheet" href="target-page.css?v=single-photo-entry-1" />
  <script src="../../../navigation.js?v=universal-smart-targets-nav-1" defer></script>
  <script src="../../../experience_frame_processing.js?v=universal-processing-visual-2"></script>
  <script src="../../../app_state.js?v=mission-a-fresh-score-0814" defer></script>
  <script src="../../../sec_dispatch.js?v=mission-a-fresh-score-0814" defer></script>
  <script src="../../../m4_runtime.js?v=mission-a-fresh-score-0814" defer></script>
  <script src="../../../sec_reopen_lifecycle.js?v=universal-sec-reopen-3" defer></script>
  <script src="../../../sec_v1.js?v=mission-a-fresh-score-0814" defer></script>
  <script src="../../../sec_session_timeline.js?v=session-2-uspsa-1" defer></script>
  <script src="../../../baker_sl_st1_sec.js?v=session-2-uspsa-1" defer></script>
  <script src="../../../sec_reopen_capability.js?v=security-hotfix-1" defer></script>
  <script src="target-page.js?v=session-2-uspsa-1" defer></script>
</head>
<body class="platform-page target-page sl-target-page">
  <header class="m4-header universal-app-header sl-app-header">
    <div class="vendor-slot">
      <img src="../../../assets/crosshair-cross-emblem.png" alt="Tap-n-Score emblem" />
      <div class="brand-lockup">
        <a class="vendor-name" href="../../../index.html">Tap-n-Score™</a>
      </div>
    </div>
    <span class="sl-header-target-identity">Baker SL-ST1 <span aria-hidden="true">•</span> USPSA</span>
    <details class="mobile-platform-menu universal-header-menu">
      <summary aria-label="Open navigation"><span></span><span></span><span></span></summary>
      <a href="../../../index.html">Home</a>
      <a href="../../../matrix.html">Equipment Library</a>
      <a href="../../../records.html" data-preserve-active-session>History</a>
    </details>
  </header>

  <main class="sl-page-shell">
    <section class="sl-target-introduction" aria-labelledby="targetName">
      <p class="sl-printer">Baker Targets</p>
      <h1 id="targetName">Silhouette Target (USPSA)</h1>
      <p class="sl-instruction" id="targetInstruction" aria-live="polite">Load your target photo to begin.</p>
    </section>

    <section class="sl-load-card" id="loadCard" aria-label="Load target photo">
      <h2>Load Target</h2>
      <div class="sl-load-actions">
        <label class="button primary" for="libraryInput">Choose Photo</label>
        <input id="libraryInput" type="file" accept="image/*" hidden />
      </div>
    </section>

    <section class="sl-workspace" id="targetWorkspace" aria-label="Target evidence workspace" hidden>
      <div class="sl-image-frame" id="imageFrame">
        <img id="targetImage" alt="Loaded Baker silhouette target" />
        <div class="sl-impact-layer" id="impactLayer" aria-hidden="true"></div>
        <button class="sl-tap-surface" id="tapSurface" type="button" aria-label="Tap every visible bullet hole"></button>
      </div>

      <div class="sl-workflow-dock workflow-dock--compact" id="workflowDock" data-processing-host>
        <div class="workflow-support-row">
          <span id="workspaceFeedback" role="status" aria-live="polite">Tap every bullet hole you see.</span>
          <div class="workflow-secondary-actions" aria-label="Target photo actions">
            <label class="workflow-secondary-action" for="retakeInput">Retake</label>
            <input id="retakeInput" type="file" accept="image/*" capture="environment" hidden />
            <label class="workflow-secondary-action" for="replaceInput">Replace</label>
            <input id="replaceInput" type="file" accept="image/*" hidden />
          </div>
        </div>

        <div class="workflow-control-row workflow-control-row--docked" aria-label="Target evidence controls">
          <div class="target-hit-counter" id="impactCounter" aria-label="0 bullet holes recorded">
            <strong id="impactCount">0</strong>
            <span>Holes</span>
          </div>
          <button class="button primary" id="showResults" type="button" disabled>Show Results</button>
          <button class="button" id="undoImpact" type="button" disabled>Undo</button>
          <button class="button" id="clearImpacts" type="button" disabled>Clear</button>
        </div>
      </div>
    </section>
  </main>

  <main class="sl-sec-shell sec-live-host" id="bakerSecView" hidden>
    <div id="bakerSecRoot"></div>
  </main>

  <div class="sl-confirm-dialog" id="confirmationDialog" role="dialog" aria-modal="true" aria-labelledby="confirmationTitle" aria-describedby="confirmationMessage" hidden>
    <section class="sl-confirm-card">
      <h2 id="confirmationTitle">Confirm Action</h2>
      <p id="confirmationMessage"></p>
      <div class="sl-confirm-actions">
        <button class="button" id="confirmationCancel" type="button">Keep Current</button>
        <button class="button primary" id="confirmationAccept" type="button">Continue</button>
      </div>
    </section>
  </div>
</body>
</html>
